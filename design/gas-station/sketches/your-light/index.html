<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>your light — throwaway prototype</title>
<style>
  html,body{margin:0;height:100%;background:#141312;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;cursor:none}
  #note{position:fixed;left:10px;bottom:8px;font:11px/1.3 "Courier 10 Pitch",monospace;color:#ece7db;mix-blend-mode:difference;pointer-events:none}
</style>
<div id="note">throwaway · move to aim your lamp · hold (or arrow keys / WASD) to walk · keep still and the lamp goes down</div>
<script type="module">
// 03 Your light: the night forecourt. Throwaway. Not the build.
// Aim a lamp; what it lands on exists. Things you have lit keep a thin line. Keep still: the lamp goes down, the sky comes up.
import * as T from './vendor/three.module.min.js';
const Q = new URLSearchParams(location.search), STILL = Q.get('still');
const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.shadowMap.enabled = true; R.outputColorSpace = T.LinearSRGBColorSpace; document.body.prepend(R.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0);
const Wm = new T.MeshLambertMaterial({ color: 0xffffff }), K = new T.MeshBasicMaterial({ color: 0 }), LIT = new T.MeshBasicMaterial({ color: 0xffffff });
const things = [];                       // groups that can be lit and remembered
// world: x east, y up, z south (north is -z). v(x, north, up)
const v = (x, n, u) => new T.Vector3(x, u, -n);
function box(w, d, h, x, n, u, m = Wm, parent = scene) { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.position.copy(v(x, n, u + h / 2)); o.castShadow = o.receiveShadow = m === Wm; parent.add(o); return o; }
function thing(name, build) { const g = new T.Group(); g.name = name; scene.add(g); build(g); const lines = new T.Group(); g.traverse(o => { if (o.isMesh && o.material === Wm) { const l = new T.LineSegments(new T.EdgesGeometry(o.geometry, 30), new T.LineBasicMaterial({ color: 0xffffff })); l.position.copy(o.position); l.rotation.copy(o.rotation); lines.add(l); } }); lines.visible = false; scene.add(lines); g.userData.lines = lines; things.push(g); return g; }

const ground = new T.Mesh(new T.PlaneGeometry(900, 900), Wm); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// the station: a plain box. openings are always ink
thing('station', g => { box(16, 6, 3.8, 0, 19, 0, Wm, g);
  [[-.6, .6, 0, 2.25], [1.4, 4.4, .9, 2.5], [-3.0, -1.4, .9, 2.5], [-7.3, -4.2, 0, 3.0]].forEach(([a, b, z0, z1]) => { const o = new T.Mesh(new T.PlaneGeometry(b - a, z1 - z0), K); o.position.copy(v((a + b) / 2, 15.98, (z0 + z1) / 2)); g.add(o); });
  [[3.25, .11], [2.85, .07]].forEach(([z, w]) => { const o = new T.Mesh(new T.PlaneGeometry(16, w * 2), K); o.position.copy(v(0, 15.97, z)); g.add(o); }); });
[-1.5, 1.5].forEach((x, i) => thing('pump' + i, g => { box(.6, .5, 1.55, x, 11.4, 0, Wm, g); const s = new T.Mesh(new T.SphereGeometry(.27, 16, 10), Wm); s.position.copy(v(x, 11.4, 1.85)); s.castShadow = true; g.add(s); const f = new T.Mesh(new T.PlaneGeometry(.4, .35), K); f.position.copy(v(x, 11.14, 1.12)); g.add(f); }));
thing('icebox', g => { box(1.2, .7, 1.05, 5.6, 15.5, 0, Wm, g); });
thing('phone', g => { box(.9, .9, 2.3, 7.2, 12.4, 0, Wm, g); const f = new T.Mesh(new T.PlaneGeometry(.6, 1.2), K); f.position.copy(v(7.2, 11.94, 1.5)); g.add(f); });
[-4.4, 4.4].forEach((x, i) => thing('lamp' + i, g => { const p = new T.Mesh(new T.CylinderGeometry(.05, .05, 4.3, 8), Wm); p.position.copy(v(x, 11, 2.15)); p.castShadow = true; g.add(p); const c = new T.Mesh(new T.ConeGeometry(.45, .35, 12), Wm); c.position.copy(v(x, 11, 4.45)); g.add(c); }));
// the sign: pylon, name in lit boxes, a flat arrow diving at the door, bulbs
const SX = -1.75, SN = -2;
thing('sign', g => { const p = new T.Mesh(new T.CylinderGeometry(.1, .1, 11.2, 8), Wm); p.position.copy(v(SX, SN, 5.6)); p.castShadow = true; g.add(p);
  const sh = new T.Shape(); [[-.4, 0], [-.4, -4.9], [-1.2, -4.9], [0, -7.0], [1.2, -4.9], [.4, -4.9], [.4, 0], [0, -.9]].forEach((q, i) => i ? sh.lineTo(q[0], q[1]) : sh.moveTo(q[0], q[1]));
  const a = new T.Mesh(new T.ShapeGeometry(sh), new T.MeshLambertMaterial({ color: 0xffffff, side: T.DoubleSide })); a.position.copy(v(SX + .35, SN - .02, 9.7)); a.rotation.z = .2; g.add(a); g.userData.arrow = a; });
const bulbs = []; for (let s = .45; s < 6.7; s += .56) { const hw = s < 4.9 ? .4 : 1.2 * (7 - s) / 2.1; [-1, 1].forEach(k => { const b = new T.Mesh(new T.SphereGeometry(.09, 8, 6), LIT); const w = k * Math.max(.05, hw - .13); b.position.copy(v(SX + .35 + Math.sin(.2) * s + Math.cos(.2) * w, SN - .1, 9.7 - Math.cos(.2) * s + Math.sin(.2) * w)); b.userData.s = s / 7; scene.add(b); bulbs.push(b); }); }
'TRABOLD'.split('').forEach((ch, i) => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128); x.fillStyle = '#000'; x.font = 'bold 112px "DejaVu Sans",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 64, 70);
  const m = new T.Mesh(new T.PlaneGeometry(.74, .74), new T.MeshBasicMaterial({ map: new T.CanvasTexture(c) })); m.position.copy(v(SX - .6, SN - .06, 10.6 - i * .76)); scene.add(m); });
// the one lamp the station keeps on
const post = new T.PointLight(0xffffff, 30, 16, 1.2); post.position.copy(v(4.4, 11, 4.1)); post.castShadow = true; post.shadow.bias = -.003; scene.add(post);
const glow = new T.Mesh(new T.CircleGeometry(.4, 16), LIT); glow.rotation.x = Math.PI / 2; glow.position.copy(v(4.4, 11, 4.27)); scene.add(glow);
// the sky: one stroke per star, laid round the still point
const LAT = 35 * Math.PI / 180, pole = new T.Vector3(0, Math.sin(LAT), -Math.cos(LAT)), e1 = new T.Vector3(1, 0, 0), e2 = new T.Vector3().crossVectors(pole, e1).normalize();
let sd = 9; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647, stars = [];
for (let i = 0; i < 34; i++) { const rho = (5 + rnd() * 58) * Math.PI / 180, psi = rnd() * 6.283, tail = 60 * Math.PI / 180, n = 28, pos = [], w0 = 1.6 + rnd() * 2.2;
  const dir = a => pole.clone().multiplyScalar(Math.cos(rho)).add(e2.clone().multiplyScalar(Math.cos(a) * Math.sin(rho))).add(e1.clone().multiplyScalar(Math.sin(a) * Math.sin(rho)));
  let ok = true; const P = []; for (let k = 0; k <= n; k++) { const d = dir(psi + tail * k / n); if (d.y < .05) { ok = false; break; } P.push(d.multiplyScalar(400)); } if (!ok) continue;
  for (let k = 0; k < n; k++) { const a = P[k], b = P[k + 1], side = new T.Vector3().crossVectors(a, b).normalize(), wa = w0 * Math.pow(1 - k / n, 1.4) + .12, wb = w0 * Math.pow(1 - (k + 1) / n, 1.4) + .12;
    const q = [a.clone().addScaledVector(side, wa), a.clone().addScaledVector(side, -wa), b.clone().addScaledVector(side, wb), b.clone().addScaledVector(side, -wb)]; [0, 1, 2, 2, 1, 3].forEach(j => pos.push(q[j].x, q[j].y, q[j].z)); }
  const geo = new T.BufferGeometry(); geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); const m = new T.Mesh(geo, new T.MeshBasicMaterial({ color: 0xffffff, side: T.DoubleSide })); m.visible = false; m.frustumCulled = false; scene.add(m); stars.push(m); }
// you: a lamp at eye height
const cam = new T.PerspectiveCamera(68, 1, .1, 1200); const EYE = v(0, -13, 1.65);
const you = new T.SpotLight(0xffffff, 3.6, 0, .11, .05, 0); you.position.copy(EYE); you.castShadow = true; you.shadow.mapSize.set(2048, 2048); you.shadow.bias = -.0005; scene.add(you, you.target);
// post: two values only. no outlines. the edge of every light frays like a brush running dry
const quad = new T.Mesh(new T.PlaneGeometry(2, 2), new T.ShaderMaterial({ uniforms: { t: { value: null }, res: { value: new T.Vector2() }, f: { value: 0 } }, vertexShader: 'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}', fragmentShader: `
  varying vec2 v;uniform sampler2D t;uniform vec2 res;uniform float f;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),q=fract(p);q=q*q*(3.-2.*q);return mix(mix(h(i),h(i+vec2(1,0)),q.x),mix(h(i+vec2(0,1)),h(i+1.),q.x),q.y);}
  float fb(vec2 p){return n(p)*.5+n(p*2.1)*.3+n(p*4.3)*.2;}
  void main(){vec2 px=v*res;float sc=res.x/390.;
    vec2 wob=(vec2(fb(px/(30.*sc)+f),fb(px/(30.*sc)+9.+f))-.5)*6.*sc/res;
    float l=dot(texture2D(t,v+wob).rgb,vec3(.333));
    float st=fb(vec2(px.x/(40.*sc)+px.y/(70.*sc),px.y/(1.8*sc)-px.x/(6.*sc))+f);       // dry streaks in the half-lit band
    float ink=l<.30?1.:(l<.50?step(.28+(l-.30)*1.9,st):0.);
    float g=(h(px)-.5)*.03;
    gl_FragColor=vec4(mix(vec3(.925,.905,.86)+g,vec3(.078,.074,.07)+g*.5,ink),1.);}` }));
const ps = new T.Scene(); ps.add(quad); const pc = new T.Camera(); let rt;
function size() { const w = innerWidth, h = innerHeight, d = Math.min(2, devicePixelRatio || 1); R.setPixelRatio(d); R.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); rt?.dispose(); rt = new T.WebGLRenderTarget(w * d, h * d, { type: T.HalfFloatType }); quad.material.uniforms.res.value.set(w * d, h * d); }
addEventListener('resize', size); size();

// state
const aim = new T.Vector2(.02, -.2); let heading = 0, lastMove = performance.now(), lamp = 0, adapt = 0, t0 = performance.now(), chase = 0;
const ray = new T.Raycaster(); const keys = {}; let held = 0;
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = 1; lastMove = performance.now(); }); addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });
addEventListener('pointerup', () => held = 0); addEventListener('pointercancel', () => held = 0);
addEventListener('pointermove', e => { aim.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); lastMove = performance.now(); });
addEventListener('pointerdown', e => { held = performance.now(); aim.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)); lastMove = performance.now(); });
if (STILL === 'arrive') { lastMove = -1e9; lamp = 0; adapt = .25; }
if (STILL === 'aim') { aim.set(-.3, -.33); lamp = 1; }
if (STILL === 'seen') { aim.set(.55, -.36); lamp = 1; things.forEach(g => { if (/pump|sign|lamp0/.test(g.name)) g.userData.lines.visible = true; }); }
if (STILL === 'walk') { EYE.copy(v(-6.5, 5.0, 1.65)); heading = -.62; aim.set(-.15, -.2); lamp = 1; }
const DAY = Q.get('day');
const sun = new T.DirectionalLight(0xffffff, 0); sun.position.set(-40, 34, 55); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 }); sun.shadow.bias = -.0006; scene.add(sun);
const hemi = new T.HemisphereLight(0xffffff, 0x444444, 0); scene.add(hemi);
if (DAY) { scene.background = new T.Color(0xffffff); sun.intensity = 3.3; hemi.intensity = .75; post.intensity = 0; glow.material = K; bulbs.forEach(b => b.scale.setScalar(.6)); things.find(g => g.name === 'sign').userData.arrow.material = K; }
if (STILL === 'daywalk') { EYE.copy(v(6.5, 3.5, 1.65)); heading = .5; aim.set(0, -.25); }
if (STILL === 'dayroad') { aim.set(0, -.1); }
if (STILL === 'wait') { lastMove = -1e9; lamp = 0; adapt = 1; things.forEach(g => { if (/pump|sign|station|icebox/.test(g.name)) g.userData.lines.visible = true; }); }

function step(now) {
  const idle = (now - lastMove) / 1000;
  if (!STILL) { lamp += ((idle < 2.5 ? 1 : 0) - lamp) * (idle < 2.5 ? .5 : .12); adapt += ((idle > 4 ? 1 : 0) - adapt) * (idle > 4 ? .035 : .4); }
  // walking: free. hold to walk toward where you aim, or use the keys. the building is solid; there is no inside in this sketch
  { const fwd = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) + (held && now - held > 350 ? 1 : 0), turn = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    heading -= turn * .06; if (fwd) { const a = heading - aim.x * .25; EYE.x += -Math.sin(a) * .22 * fwd; EYE.z += -Math.cos(a) * .22 * fwd; EYE.z = Math.max(EYE.z, -15.3); lastMove = now; if (held) heading -= aim.x * .02; } }
  // the view swings a little toward where you aim
  cam.position.copy(EYE); const yaw = heading - aim.x * .12, pit = .21 + aim.y * .1; cam.rotation.set(pit, yaw, 0, 'YXZ');
  cam.updateMatrixWorld(); ray.setFromCamera(aim, cam);
  you.target.position.copy(EYE).addScaledVector(ray.ray.direction, 30); you.angle = .012 + .1 * lamp; you.intensity = !DAY && lamp > .05 ? 3.6 : 0;      // pure ink: the lamp does not fade, it closes
  if (lamp > .6) { const hit = ray.intersectObjects(things, true)[0]; if (hit) { let g = hit.object; while (g.parent && !things.includes(g)) g = g.parent; if (g.userData.lines) g.userData.lines.visible = true; } }
  const nvis = DAY ? 0 : Math.floor(adapt * stars.length); stars.forEach((s, i) => s.visible = i < nvis);
  chase = (now - t0) / 1000 * .7 % 1.6; bulbs.forEach(b => b.visible = STILL ? true : Math.abs(b.userData.s - chase + .3) < .55);
  quad.material.uniforms.f.value = STILL ? 0 : Math.floor(now / 250) * .37;          // the edges re-settle a few times a second, held
  quad.material.uniforms.t.value = rt.texture;
  R.setRenderTarget(rt); R.render(scene, cam); R.setRenderTarget(null); R.render(ps, pc);
}
if (STILL) { step(performance.now()); step(performance.now()); document.title = 'done'; }
else { let last = 0; const loop = now => { requestAnimationFrame(loop); if (now - last < 80) return; last = now; step(now); }; requestAnimationFrame(loop); }   // about 12 pictures a second
</script>
