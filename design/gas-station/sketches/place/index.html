<title>the place — throwaway walked prototype</title>
<style>
  html,body{margin:0;height:100%;background:#141312;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #note{position:fixed;left:0;right:0;bottom:5px;text-align:center;font:11px/1.3 "Courier 10 Pitch","Courier New",monospace;color:#8a857a;pointer-events:none;user-select:none;-webkit-user-select:none}

<div id="note"><a href="#day">day</a> · <a href="#dusk">dusk</a> · <a href="#night">night</a><span id="hint"> &nbsp; drag to look · hold to walk</span></div>
<script type="module">
// The place, walked. Throwaway: it exists to test the look, not to be built on.
// Systems' lot: sign at the road, door 16 m straight north of it, canopy and pumps to the west.
// Serve the `sketches/` folder (three.js is shared from ../ink-is-shadow/vendor).
//
// HOW THE INK IS MADE (round 2). Two values, and every mark is a brush stroke that belongs to a surface.
//  1. Every surface carries the stroke sheet (strokes.js) like any other texture. On the ground the sheet is laid along the light:
//     along the sun by day, outward from a fixed lamp at night. On walls and things it is laid along the surface with a slight lean.
//  2. The light on a surface decides how much of each stroke shows. Full light: none. Half light: the loaded spines of some strokes.
//     Shade: nearly all of every stroke, with paper between and dry gaps. Full dark: whole.
//  3. A shadow's edge is read a little ahead of and behind each stroke, along the stroke, so the edge is the strokes ending, each with its own taper.
// Nothing here depends on where you stand, so the ink stays on the world when you walk. To swap in a drawn sheet: ?sheet=file.png
import * as T from '../ink-is-shadow/vendor/three.module.min.js';
import { makeSheet, sheetFromImage } from './strokes.js';
const Q = new URLSearchParams(location.search), num = (k, d) => Q.has(k) ? +Q.get(k) : d, STILL = Q.has('still');
// which hour: #day, #dusk or #night after the address (or ?night=1, ?dusk=1, ?hour=). with none, the visitor's own clock picks one of the three
const HASH = location.hash.replace('#', ''), CLOCK = new Date().getHours() + new Date().getMinutes() / 60; addEventListener('hashchange', () => location.reload());
const MODE = Q.has('night') ? 'night' : Q.has('dusk') ? 'dusk' : Q.has('hour') ? 'day' : ['day', 'dusk', 'night'].includes(HASH) ? HASH : CLOCK >= 7 && CLOCK < 17.25 ? 'day' : (CLOCK >= 6 && CLOCK < 7) || (CLOCK >= 17.25 && CLOCK < 18.25) ? 'dusk' : 'night', DUSK = MODE === 'dusk';
document.querySelectorAll('#note a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + MODE)); if (STILL) document.getElementById('note').style.display = 'none';
const ANCHOR = Q.get('anchor') || 'world', STROKES = num('strokes', 1), LAT = 35 * Math.PI / 180, RAD = Math.PI / 180;
const R = new T.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
R.shadowMap.enabled = true; R.shadowMap.type = T.PCFShadowMap; R.outputColorSpace = T.LinearSRGBColorSpace; document.body.prepend(R.domElement);
const scene = new T.Scene();

// ---------------------------------------------------------------- the stroke sheet, and the material that wears it
const sheetTex = (() => { const s = makeSheet(); const t = new T.DataTexture(s.data, s.N, s.N, T.RGBAFormat); t.wrapS = t.wrapT = T.RepeatWrapping; t.minFilter = T.LinearMipmapLinearFilter; t.magFilter = T.LinearFilter; t.generateMipmaps = true; t.anisotropy = R.capabilities.getMaxAnisotropy(); t.colorSpace = T.NoColorSpace; t.needsUpdate = true; return t; })();
if (Q.get('sheet')) new T.ImageLoader().load(Q.get('sheet'), img => { const s = sheetFromImage(img); sheetTex.image = { data: s.data, width: s.N, height: s.N }; sheetTex.needsUpdate = true; window.sheetLoaded = true; });
window.sheetPNG = T0 => { const d = sheetTex.image.data, N = sheetTex.image.width, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d'), im = g.createImageData(N, N); for (let i = 0; i < N * N; i++) { const v = T0 == null ? 255 - d[i * 4] : d[i * 4] / 255 > T0 ? 0 : 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; } g.putImageData(im, 0, 0); return c.toDataURL('image/png'); };
const BX0 = -13, BX1 = 7, FN = 16, BN = 24, BH = 3.8, WT = .22;                    // the station: a plain box, 20 m by 8 m, front faces south at n = 16
const SU = { sunD: { value: new T.Vector3(0, 1, 0) }, youF: { value: new T.Vector3() }, youR: { value: new T.Vector2(1, 0) }, youOn: { value: 0 }, big: { value: num('big', 1) }, sheet: { value: sheetTex }, sunA: { value: new T.Vector3(1, 0, 0) }, smat: { value: new T.Matrix4() }, lampP: { value: [new T.Vector4(), new T.Vector4(), new T.Vector4(), new T.Vector4()] }, nl: { value: 0 }, screenA: { value: ANCHOR === 'screen' ? 1 : 0 }, res: { value: new T.Vector2() } };
const SHADOW = T.ShaderChunk.shadowmap_pars_fragment.replace('float getShadow(', 'float getShadow0(') + `
#ifdef USE_SHADOWMAP
  float blS(sampler2D m,vec2 sz,vec2 uv,float z){vec2 q=uv*sz-.5,f=fract(q),b=(floor(q)+.5)/sz,e=1./sz;return mix(mix(texture2DCompare(m,b,z),texture2DCompare(m,b+vec2(e.x,0.),z),f.x),mix(texture2DCompare(m,b+vec2(0.,e.y),z),texture2DCompare(m,b+e,z),f.x),f.y);}

    sc.xyz/=sc.w;sc.z+=bias;if(sc.x<0.||sc.x>1.||sc.y<0.||sc.y>1.||sc.z>1.)return 1.;

    // the sun: the shadow is read along the stroke, eight times over about a metre, shifted by the stroke's own amount. that is what tapers a stroke at a shadow's edge
    vec3 dS=(smat*vec4(gDir,0.)).xyz*(radius*.01*(1.+2.*gK));float s=0.;
    for(int i=0;i<8;i++){float k=(float(i)+gJit)/4.-1.+gOff;vec3 q=sc.xyz+dS*k;s+=blS(m,sz,q.xy,q.z);}
    return mix(1.,s/8.,si);}
#endif`;
function inkMat(scale, amb = 1, tone = 1, along = null, drift = false) {                     // tone under 1: a surface that is never quite paper, so some of its strokes always show. along: lay the sheet this way whatever the light
  const m = new T.MeshLambertMaterial({ color: new T.Color(tone, tone, tone) }); m.isInk = true;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, SU, { sscale: { value: scale }, amb: { value: amb }, drift: { value: drift ? 1 : 0 }, along: { value: along || new T.Vector2(0, 0) } });
    sh.vertexShader = 'varying vec3 vWp;varying vec3 vWn;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\nvWp=(modelMatrix*vec4(transformed,1.)).xyz;vWn=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader = `varying vec3 vWp;varying vec3 vWn;uniform sampler2D sheet;uniform vec3 sunA;uniform mat4 smat;uniform vec4 lampP[4];uniform int nl;uniform float sscale,amb,screenA,drift,youOn,big;uniform vec2 res,along,youR;uniform vec3 sunD,youF;
      vec3 gDir;float gOff,gJit,gK;vec4 gS;
      float dh2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float dn2(vec2 x){vec2 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(dh2(i),dh2(i+vec2(1.,0.)),f.x),mix(dh2(i+vec2(0.,1.)),dh2(i+vec2(1.,1.)),f.x),f.y);}

      float capS(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;pa-=sunD*dot(pa,sunD);vec3 bq=ba-sunD*dot(ba,sunD);float h=clamp(dot(pa,bq)/max(dot(bq,bq),1e-5),0.,1.);return dot(mix(a,b,h)-p,sunD)>.03?smoothstep(r-.02,r+.03,length(pa-bq*h)):1.;}
      float youSh(vec3 p){vec3 F=youF,U=vec3(0.,1.,0.),Rr=vec3(youR.x,0.,youR.y);if(distance(p.xz,F.xz)>14.)return 1.;
        return capS(p,F+U*1.6,F+U*1.61,.115)*capS(p,F+U*.92,F+U*1.3,.19)*capS(p,F+U*1.38-Rr*.16,F+U*1.38+Rr*.16,.09)*capS(p,F-Rr*.1+U*.08,F-Rr*.11+U*.85,.085)*capS(p,F+Rr*.1+U*.08,F+Rr*.11+U*.85,.085)*capS(p,F-Rr*.22+U*1.33,F-Rr*.21+U*.86,.06)*capS(p,F+Rr*.22+U*1.33,F+Rr*.21+U*.86,.06);}
      void strokeSetup(){vec3 n=normalize(vWn);vec2 uv,ub;float sc=sscale/8.;                   // one sheet covers 8 m of ground; things wear it smaller
        if(abs(n.y)>.7){vec2 p=vWp.xz;int best=-1;float bd=1e9;for(int i=0;i<4;i++){if(i>=nl||dot(along,along)>0.)break;float d=distance(p,lampP[i].xz);if(d<lampP[i].w&&d<bd){bd=d;best=i;}}
          if(best>=0){vec2 r=p-lampP[best].xz;uv=vec2(log(max(bd,.05)),atan(r.y,r.x))*(6./6.2832)*max(1.,sscale*.5);ub=uv*vec2(.4,.5)+.31;gDir=vec3(r.x,0.,r.y)/max(bd,.05);}      // a fixed lamp: strokes laid away from it
          else{vec2 a=dot(along,along)>0.?along:sunA.xz;uv=vec2(dot(p,a),dot(p,vec2(-a.y,a.x)))*sc;ub=uv*.27+.31;gDir=vec3(a.x,0.,a.y);}}                                         // the sun: strokes laid along it
        else{vec3 t=normalize(cross(n,vec3(0.,1.,0.)));float u=dot(vWp,t),w=vWp.y;uv=vec2(u*.97+w*.24,-u*.24+w*.97)*sc;ub=uv*.27+.31;gDir=normalize(t*.97+vec3(0.,.24,0.));}  // walls and things: along the surface, leaning
        if(screenA>.5){uv=gl_FragCoord.xy/res.y*2.4;ub=uv;}                                       // the control for the walk-past test: the same sheet stuck to the screen
        // from far off the same surface wears the sheet nearly four times larger, so a mass seen from the road is still a few big strokes. both sizes are fixed to the world; one gives way to the other between 12 and 32 m
        gK=big>.5?smoothstep(12.,32.,distance(vWp,cameraPosition)):0.;
        gS=mix(texture2D(sheet,uv),texture2D(sheet,ub),gK);gOff=(gS.g-.5)*1.4;gJit=gS.b;}
      float ambK(){vec3 p=vWp;return (p.x>${BX0 + .1}&&p.x<${BX1 - .1}&&-p.z>${FN + .1}&&-p.z<${BN - .1}&&p.y<${BH + .05})?0.:amb;}                       // no sky gets indoors
      ` + sh.fragmentShader.replace('#include <shadowmap_pars_fragment>', SHADOW).replace('void main() {', 'void main() {\nstrokeSetup();')
      .replace('#include <lights_fragment_end>', '#if defined( RE_IndirectDiffuse )\nirradiance*=ambK();\n#endif\n#include <lights_fragment_end>')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float lO=gl_FragColor.r;
        if(drift>.5){float nn=-vWp.z,lot=smoothstep(-18.,-14.,vWp.x)*(1.-smoothstep(12.,16.,vWp.x))*smoothstep(-4.,-2.,nn)*(1.-smoothstep(26.,30.,nn));lO*=mix(1.,.2,smoothstep(.58,.7,dn2(vWp.xz/vec2(14.,6.))*.65+dn2(vWp.xz/3.1+7.)*.35)*(1.-lot)*smoothstep(5.,9.,distance(vWp.xz,vec2(2.6,21.))));}   // the desert floor: drifts of ground that are never quite paper, so dry strokes lie across them
        if(youOn>.5)lO=mix(min(lO,.05),lO,youSh(vWp));
        gl_FragColor=vec4(lO,gS.r,gS.b,drift>.5||dot(along,along)>0.?.18:.25);`);   // a: under .6 is a lit surface, not paint. .18 is the ground and the road, which never get a drawn line           // r: light. g: the stroke sheet here. a: this is a lit surface, not paint
  };
  return m;
}
// round 3, after the owner walked it ("hard to really make out objects ... more detail and variation in the brush stroke size"): ?detail=0 is how it was.
// with detail on, every kind of thing wears the sheet at its own size, and things have a tone of their own: a painted pump is never quite paper, so it is always drawn, in fine strokes
const DETAIL = num('detail', 1);
const Wm = inkMat(DETAIL ? 1.7 : 1), Wg = inkMat(1, 1, 1, null, true), Wt = inkMat(DETAIL ? 3.6 : 3, 1, DETAIL ? .62 : 1), Wd = inkMat(DETAIL ? 5 : 3, 1, DETAIL ? .3 : 1), Wl = inkMat(DETAIL ? 4.2 : 3), Wa = inkMat(2, 0), Wr = inkMat(.5, 1, .2, new T.Vector2(1, 0)), K = new T.MeshBasicMaterial({ color: 0 }), LIT = new T.MeshBasicMaterial({ color: 0xffffff });
const v = (x, n, u) => new T.Vector3(x, u, -n);                         // x east, n north, u up
const things = {};
function box(w, d, h, x, n, u, m = Wm, parent = scene) { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.position.copy(v(x, n, u + h / 2)); o.castShadow = o.receiveShadow = !!m.isInk; parent.add(o); return o; }
function plane(w, h, x, n, u, m = K, parent = scene, ry = 0) { const o = new T.Mesh(new T.PlaneGeometry(w, h), m); o.position.copy(v(x, n, u)); o.rotation.y = ry; parent.add(o); return o; }

function mark(g, x, n, u, w, h, ry = 0) { plane(w, h, x, n, u, LIT, g.userData.marks, ry); }
const rod = (r0, r1, h, x, n, u, m = Wt, parent = scene) => { const p = new T.Mesh(new T.CylinderGeometry(r0, r1, h, 10), m); p.position.copy(v(x, n, u + h / 2)); p.castShadow = p.receiveShadow = true; parent.add(p); return p; };

// the ground is cut into 6 m squares: across one huge triangle a place on the ground is only known to within centimetres, and the strokes creep as you move (found by walk.js)
const ground = new T.Mesh(new T.PlaneGeometry(720, 720, 120, 120), Wg); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// the road: worn blacktop, a band of long dry strokes running east and west between you and the sign
{ const r = new T.Mesh(new T.PlaneGeometry(720, 6.4, 120, 2), Wr); r.rotation.x = -Math.PI / 2; r.position.copy(v(0, -6.6, .006)); r.receiveShadow = true; scene.add(r); }

// ---------------------------------------------------------------- the station
const shell = new T.Group(); scene.add(shell);
const wallPiece = (x0, x1, z0, z1) => box(x1 - x0, WT, z1 - z0, (x0 + x1) / 2, FN + WT / 2, z0, Wm, shell);
// front wall with real holes: west window, door, east window. the garage door is a painted panel
const WW = [-4.6, -2.0], DR = [-.6, .6], EW = [4.0, 6.2], WZ = [.9, 2.5], DZ = 2.25;
wallPiece(BX0, WW[0], 0, BH); wallPiece(WW[0], WW[1], 0, WZ[0]); wallPiece(WW[0], WW[1], WZ[1], BH); wallPiece(WW[1], DR[0], 0, BH); wallPiece(DR[0], DR[1], DZ, BH);
wallPiece(DR[1], EW[0], 0, BH); wallPiece(EW[0], EW[1], 0, .4); wallPiece(EW[0], EW[1], WZ[1], BH); wallPiece(EW[1], BX1, 0, BH);
box(WT, BN - FN, BH, BX0 + WT / 2, (FN + BN) / 2, 0, Wm, shell); box(WT, BN - FN, BH, BX1 - WT / 2, (FN + BN) / 2, 0, Wm, shell);
box(BX1 - BX0 + .3, BN - FN + .3, .25, (BX0 + BX1) / 2, (FN + BN) / 2, BH, Wm, shell);                                  // roof
box(BX1 - BX0 + .5, .95, .12, (BX0 + BX1) / 2, FN - .47, BH + .06, Wm, shell);                                           // an eave along the front: its shade is the one brushed band on the sunlit wall
const AX0 = 4.6, AX1 = 6.4, ALEN = 28;                                                                                   // the aisle opening in the back wall
box(AX0 - BX0, WT, BH, (BX0 + AX0) / 2, BN - WT / 2, 0, Wm, shell); box(BX1 - AX1, WT, BH, (AX1 + BX1) / 2, BN - WT / 2, 0, Wm, shell);
const backPlug = box(AX1 - AX0, WT, BH, (AX0 + AX1) / 2, BN - WT / 2, 0, Wm, shell);                                     // seen from outside, the back wall is whole
plane(3.8, 3.0, -8.6, FN - .02, 1.5); [[BH - .5, .22], [BH - .92, .13]].forEach(([z, h]) => plane(BX1 - BX0, h, (BX0 + BX1) / 2, FN - .02, z));   // garage door, two stripes: paint

{ const hose = plane(9.6, .05, -6.8, 9.2, .012); hose.rotation.x = -Math.PI / 2; }                                         // the bell line, across the forecourt
// the canopy lamp, lit from below at night

{ rod(.14, .14, STOP, 0, 0, 0, Wt, SIGN);
