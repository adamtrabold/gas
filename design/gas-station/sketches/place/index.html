//  2. The light on a surface is a tone from paper to black. The tone is spent on marks: a few broken lines, then every line, then a second family laid across the first,
//     then the lines swell shut. Each line has its own length, load and wander, so a shadow's edge is its lines stopping, each in its own place.
//  3. Lines are spaced by the screen, not the world: walk up to a wall and new lines grow between the ones already there (which stay put). So there is detail at every distance and no shimmer.
