d>\n<td data-label=\"Where you have a shadow\">A faint one from the moon wherever you're in the open, including where you arrive. A clear one under the canopy lamp; one by the lamp post; one toward the door when the arrow flashes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Night, after you've switched things on<\/strong><\/td>\n<td data-label=\"What is lit\">All of that, and the counter, stretches of the aisle, the cooler's patch of floor, the dials. From the road, lit windows, and their light on the slab<\/td>\n<td data-label=\"Where you have a shadow\">Also indoors under each light you lit, and on the slab in front of a lit window<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Everything off<\/strong> (you pulled the main)<\/td>\n<td data-label=\"What is lit\">As the station keeps it. The main doesn't touch the station's own<\/td>\n<td data-label=\"Where you have a shadow\">As the station keeps it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Power really off<\/strong><\/td>\n<td data-label=\"What is lit\">Never happens — [you: \"abandoned can still have power\"]<\/td>\n<td data-label=\"Where you have a shadow\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Not real light, kept on purpose<\/h2>\n<p>For the design director to confirm; they are in the concept and they break your rule knowingly.<\/p>\n<ul>\n<li><strong>A patch of light on the ground with no lamp over it.<\/strong> The alien material. In a place where every light has a source, the one without is the evidence — [concept]<\/li>\n<li><strong>A light that crosses the forecourt after four minutes of standing still,<\/strong> from nothing overhead — [concept]<\/li>\n<li><strong>\"One left on\":<\/strong> a light indoors that you didn't switch on. The light itself is real; that it's on is not yours — [concept]<\/li>\n<li><strong>Lights can't be seen from more than about 100 m off.<\/strong> A real sign would be seen for miles. It hides where the world joins up — [concept]<\/li>\n<li><strong>At dusk the name comes on a letter a second.<\/strong> Real signs come on at dusk; the pace is ours — [concept]<\/li>\n<li><strong>The wall clock moves the sun<\/strong> (and the moon with it) — [concept]<\/li>\n<li><strong>The moon's size, and that it is up every night<\/strong> — [you: \"always epic… exaggerated\"]<\/li>\n<\/ul>\n<h2>Not known<\/h2>\n<ul>\n<li>How bright the arrow really is against the name, and whether its flash reaching the door looks right or reads as lightning.<\/li>\n<li>Whether the name can be read at night from where you arrive, at a phone's size (the sign's own entry on the element list says how it's meant to).<\/li>\n<li>Whether the dark, with only these lights, is a picture you can find your way in. That is the drawing's job now, in dots.<\/li>\n<li>Which canopy lamp works, and where the lamp post stands, until you say.<\/li>\n<\/ul>\n<h2>Answered<\/h2>\n<p><strong>Is there a moon?<\/strong> \"Yes there's a moon and it's always epic.\" Written in above. Its shape (A, B or C) is yours to pick when you like; we'll build B unless you say.<\/p>", "jump": ["The sky", "The station's own lights", "Lights you switch on", "Light that gets from one place into another", "The states", "Not real light, kept on purpose", "Not known", "Answered"]}, "concept": {"title": "Left on", "tab": "the concept", "route": "#how", "html": "<h1>Left on<\/h1>\n<p><strong>You are<\/strong> never drawn. You are a shadow, wherever a real light falls on you: the sun, a lit lamp, a room light you switched on. In the dark there is nothing of you but the lights you left on.\n<strong>The hour<\/strong> decides how much of the place the sun lights, and how much is dark until something is switched on.<\/p>\n<p><em>How it works (systems). Brought in line with <code>owner.md<\/code> sections 24 to 30 and <code>steer-5.md<\/code>: the lamp that followed your view is out; light works as it really would; you move by swipe, pinch and tap (<a href=\"#how-controls\"><code>controls.md<\/code><\/a> is the exact spec). Before that, round 3: <code>score-2.md<\/code> and <code>owner.md<\/code> section 7. This is the one concept: 01 Nobody's here merged into 03 Your light, as <code>score-1.md<\/code> asked. It replaces both files' how-it-works halves. Read <a href=\"#how-place\"><code>00-shared.md<\/code><\/a> for the place itself: the lot, walking, the door, the world's edge, sound, twilight.<\/em><\/p>\n<p>An abandoned station with things left on. It has been empty for years and the power never went off (the owner: \"This is liminal space logic so abandoned can still have power\"). Everything is faded and rusted, and everything still works. One cup on the counter is still warm. Where this file says \"the attendant\", read: Adam. He has said \"it would probably be me squatting\"; see \"Who isn't here\" below, which is a proposal for him to check.<\/p>\n<p>The name is for three things at once: the place was left with things on; you leave lights on; and sometimes one is on that nobody left.<\/p>\n<h2>Where it comes from<\/h2>\n<ul>\n<li><strong>From 03 Your light:<\/strong> you as shadow (and, until <code>owner.md<\/code> section 28, a lamp); every thing indoors is a light with a sound; lights stay as you left them; the main; the fourth light; the sky when you stand still at night.<\/li>\n<li><strong>From 01 Nobody's here:<\/strong> the attendant's things; the aisle that is longer than the building; Call answered by nobody; the place acting when you stop; \"nothing moves while you're looking at it\"; the chart.<\/li>\n<li><strong>From 02 The Arrow<\/strong> (folded): nothing here. Its leftovers are true of the place and live in the shared file.<\/li>\n<li><strong>Draws on, from the jam:<\/strong> ink is where the light isn't; evidence, never the creature; the interior bigger than the outside; self-service; the visitor is the sighting.<\/li>\n<\/ul>\n<h2>The rule for light<\/h2>\n<p>The owner: <strong>\"Lighting should work as in the real world.\"<\/strong> This is the rule for all of it, and it replaces the two marks this file used to have.<\/p>\n<ul>\n<li><strong>A light lights what it really would, and nothing else is lit.<\/strong> The sun; the name; the arrow's bulbs; the canopy lamp; the lamp post; each thing you switch on. Where none reaches, it is dark, and the dark is drawn (\"It should just be darker\").<\/li>\n<li><strong>Nothing follows where you look.<\/strong> He turned the lamp down in so many words: \"The light that follows where I look\". Nothing is carried, and looking lights nothing.<\/li>\n<li><strong>You have one mark: your shadow, cast by whatever light is really there.<\/strong> The sun by day. At night the canopy lamp casts it, the lamp post casts it, the lit window throws it across the forecourt. Indoors the tube you just pulled on casts it on the floor. And the moon: he has said there is one, \"always epic\", so out in the open at night you have a faint shadow from it (<a href=\"#lights\"><code>lights.md<\/code><\/a>). In the moon's shade and in an unlit room you have none.<\/li>\n<li><strong>What you switch on stays on.<\/strong> That was always the title. It is now also what gives you a shadow indoors and at night: turning a light on is how you appear.<\/li>\n<li><strong>A thing in shade is shaded.<\/strong> A pump under the canopy at noon is in shade and looks it.<\/li>\n<\/ul>\n<p>So the day and the night join by themselves. Nothing switches. By day the sun does nearly everything and your shadow is everywhere you walk. At night the place is dark except where something is on, and you exist where the lights are. The hour sets the proportions.<\/p>\n<p>Every real light in the place, with where it is and what it reaches, is listed in <a href=\"#lights\"><code>lights.md<\/code><\/a> (the owner: \"we need to establish proper scene lights\").<\/p>\n<p><strong>The one deliberate exception is the other thing.<\/strong> Its light is the light that doesn't work as in the real world: a patch on the ground with no lamp over it. Because everything else obeys, that is how you know it. (For the director to confirm; the full list of what was checked against the rule is at the end of this half.)<\/p>\n<p>I don't see a second concept that differs in kind and is worth making. The owner described the place closely; what's left are choices inside it (below, \"Choices for the owner\").<\/p>\n<h2>The rule<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Never seen<\/th>\n<th>Seen as<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Who\">Adam, who lives here<\/td>\n<td data-label=\"Never seen\">Him<\/td>\n<td data-label=\"Seen as\">His things, his plans chalked on the ground, and what he left on<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Who\">You<\/td>\n<td data-label=\"Never seen\">You<\/td>\n<td data-label=\"Seen as\">Your shadow, in any real light; the lights you left on<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Who\">The other thing<\/td>\n<td data-label=\"Never seen\">It<\/td>\n<td data-label=\"Seen as\">Light with nothing to cast it<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Every act you can make puts light somewhere or takes it away. There is nothing else to do here, so nothing needs an interface.<\/p>\n<h2>Who isn't here (proposal, for the owner to check)<\/h2>\n<p>The owner: \"Well it would probably be me squatting.\" So the absent person is Adam, living in an abandoned station and making it into something. He is never shown: no figure, no photo, no voice.<\/p>\n<ul>\n<li><strong>It explains what was unexplained:<\/strong> the power (he keeps it on), the warm cup, the jacket, the plans chalked in his hand, his name on the sign, the card in the door.<\/li>\n<li><strong>What a visitor finds of his:<\/strong> on the counter the cup, a camp stove, brushes and ink, a notebook; the jacket on its hook; a made bedroll and an instrument case at the far end of the aisle; his outlines on the ground; the chart, kept in his hand. All proposed; the list is in <a href=\"#elements\"><code>elements.md<\/code><\/a>.<\/li>\n<li><strong>He is out, not hiding.<\/strong> This is the rule that keeps it from being frightening. Nothing on the standing-still list needs anyone present, and nothing is ever at the dark end of the aisle but a bedroll. Asking for someone is asking for him, and he's out.<\/li>\n<li><strong>Coming back:<\/strong> things have changed between visits because he's been there. When Adam really adds something to the site, that is the same event. An outline becomes a thing.<\/li>\n<li><strong>The alien material gets sharper:<\/strong> two hands on the lot, his and another. The chart is his record of what he can't explain. The entry about you, on your second visit, is him writing you down.<\/li>\n<li><strong>Liminal, not funny:<\/strong> no jokes, no self-portrait, no signature but the sign. A visitor who doesn't know the name learns only that someone lives here, draws, and is out.<\/li>\n<li><strong>For the parked jobs<\/strong> (nothing designed): who Adam is → his things; the work → what he's been making here; get in touch → leaving word for someone who's out.<\/li>\n<\/ul>\n<h2>Your mark<\/h2>\n<p><strong>Your shadow.<\/strong> Wherever a real light falls on you. It moves exactly as you move and is cut by the bottom of the screen. It has a person's proportions, a head and shoulders, plain, so it reads as whoever is holding the phone. It falls on what you come up to, and where it lies on a thing, the two join into one mark. That's all it does. It isn't a way of acting on things, and nobody has to come at anything from a particular side. It is how the place shows that you're standing in it.<\/p>\n<ul>\n<li><strong>In the sun:<\/strong> long early and late, almost nothing at noon, away from the sun.<\/li>\n<li><strong>In shade by day<\/strong> (under the canopy, in the building's shadow): none. Shade is shade.<\/li>\n<li><strong>At night under a lamp:<\/strong> away from the lamp, short beneath it and longer as you leave it, gone when you're out of its reach. Crossing the forecourt at night you get one under the canopy lamp, lose it, and get a weaker one by the lamp post.<\/li>\n<li><strong>Indoors:<\/strong> in the patch of sun from the door and windows by day. Otherwise none until you turn a light on; then away from that light.<\/li>\n<li><strong>At night in the open:<\/strong> a faint one from the moon, away from it. Around midnight it lies ahead of you as you arrive, toward the station, as the sun's does at midday.<\/li>\n<li><strong>In the dark<\/strong> (the moon's shade, an unlit room, the aisle): none. There is nothing of you in the picture. What there is of you is whatever you left on.<\/li>\n<li>Two lamps, two shadows, as it would be. (Whether the drawing shows both or only the nearer lamp's is the visual designer's; PROPOSED: the nearer only.)<\/li>\n<\/ul>\n<p>Moving by a pinch changes nothing here: the shadow is cast from where you are, every frame, and slides over the ground with you. You stop 0.9 m short of a thing, which is near enough for your shadow to reach it.<\/p>\n<p><strong>What went with the lamp<\/strong> is listed once, below, in \"What the lamp did, and what does it now\".<\/p>\n<h2>What you can do<\/h2>\n<p>Three acts and standing still. The same everywhere, at every hour. On a phone it is three gestures: <strong>one finger turns you, two fingers move you, a tap goes there or uses the thing.<\/strong> Holding a finger down does nothing. The exact rules, the numbers, the mouse, the keyboard and the phone's own tilt are in <a href=\"#how-controls\"><code>controls.md<\/code><\/a>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Act<\/th>\n<th>How<\/th>\n<th>What it means here<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Act\">Look round<\/td>\n<td data-label=\"How\">Swipe: the picture follows your finger, as when you drag a photo. Or turn the phone<\/td>\n<td data-label=\"What it means here\">Nothing but looking. It lights nothing and it never counts as moving<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Act\">Go up to a thing<\/td>\n<td data-label=\"How\">Pinch out with the thing between your fingers: you're carried toward it and stop just short. Pinch in to back away. Two fingers sideways together drag the picture sideways (you step the other way). Or tap it and you're taken there<\/td>\n<td data-label=\"What it means here\">In a real light your shadow joins it. In the dark you are simply at it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Act\">Use it<\/td>\n<td data-label=\"How\">Tap it when you're at it<\/td>\n<td data-label=\"What it means here\">A light comes on or goes off, with its sound. Or you ask for someone<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Act\">Go through a door<\/td>\n<td data-label=\"How\">Come up to it: you stop at it. Then pinch once more, or tap it<\/td>\n<td data-label=\"What it means here\">By day the daylight comes in with you through the doorway. At night nothing does<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Act\">Stand still<\/td>\n<td data-label=\"How\">Stop<\/td>\n<td data-label=\"What it means here\">The place does what it does when nobody's there<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Pinching is moving, not zooming.<\/strong> The owner: \"Pinch out zooms in pinch in backs up like photos.\" What is between your fingers grows as they part, because you are getting nearer to it; the view itself never narrows. A long way is quick and the last metre is slow, as with a photo. You can pinch on something you can't see in the dark: you still stop at whatever is there.<\/p>\n<p><strong>The door is two beats:<\/strong> you arrive at it and stop; the next pinch or tap takes you through. That is the latch, and it replaces \"keep walking into it for a second\". At midday it is off the latch and one pinch carries through.<\/p>\n<h2>The place, by how light gets to it<\/h2>\n<p><strong>The lot, by day.<\/strong> All the sun's. Whole, still, complete without you. You arrive across the road from the sign, and your shadow lies where the sun puts it. You can go up to anything and use it. Under the canopy is shade, with the pumps standing in it, shaded; you have no shadow there, and everything still answers a tap.<\/p>\n<p><strong>The lot, by night.<\/strong> Moonlit, dimly: there is a moon every night, exaggerated, in the south sky (<a href=\"#lights\"><code>lights.md<\/code><\/a>), so the ground and the station's front can be seen and the moon's shadows lie across the slab. Much darker than day. Beyond that, dark, except what the station itself keeps lit: the name, the arrow's bulbs, the canopy from below. Those are always on at night, so you know where you are before you've done anything. Everything else is there, dark, drawn. Under the canopy lamp and by the lamp post you have a shadow; between them you don't.<\/p>\n<p><strong>The front room.<\/strong> Eight metres deep, the size the outside says. The counter with the register, the bell, the cup, the radio. A jacket on a hook. The wall clock, and the chart under it. Beside them, at the owner's word, a framed EMPLOYEE OF THE MONTH: a portrait of Art Bell, the plaque reading Art (<a href=\"#elements\"><code>elements.md<\/code><\/a>, element 14). The card in the door: BACK IN 5 MINUTES.<\/p>\n<ul>\n<li>By day the sun comes in through the door you opened and through the front windows, as patches on the floor. Where they fall and how deep they reach is the hour and the season: far into the room in winter, barely over the sill in midsummer. The door's patch has your shadow in it.<\/li>\n<li>The rest of the room is dark until you pull the cord.<\/li>\n<li>A pull cord hangs just inside the door, in the door's patch. It's the first switch and it can't be missed by day. It lights the tube over the counter, which lights the counter and little else, and puts your shadow on the floor.<\/li>\n<li><strong>At night there is no patch of sun to hang it in.<\/strong> There is the moon's: the door faces south, so for most of the night a faint patch of moonlight lies inside it, and the cord hangs in that. Also, what really comes through the door glass at night is the sign, 16 m straight in front of it: the arrow's bulbs, in pulses, throw a faint patch on the floor, and the cord hangs in that. PROPOSED, and it has to be seen to be believed; if it isn't enough, the cord needs a real small light of its own.<\/li>\n<\/ul>\n<p><strong>The aisle.<\/strong> Beside the counter, where the back wall should be, an opening with one small light at its mouth that you can see from the door. Through it, one aisle of shelves runs straight back for fourteen bays, about 28 metres, behind a building eight metres deep.<\/p>\n<ul>\n<li><strong>No daylight gets here. It is always night in the aisle.<\/strong><\/li>\n<li>A pull cord every third bay lights that stretch. You light it a stretch at a time, or go down it in the dark toward the payphone's lamp. The light at the mouth and the lamp at the far end carry the walk: one behind you, one ahead. Three pinches on the payphone's lamp take you the length of it.<\/li>\n<li>Stock on the first shelves, with realistic labels and invented brand names (owner: \"realistic labeling with fake brand names\"). Bare shelves further back.<\/li>\n<li><strong>The far end:<\/strong> a payphone with its own small lamp, and the back door, both big enough to be the picture when you get there.<\/li>\n<li><strong>Behind you<\/strong> is the way you came: the aisle runs in line with the front window, so from the far end the daylight is straight back down it. (Round 1 called this view the reason to walk the aisle. It doesn't work as a picture yet, so I've taken the claim out. If the visual designer solves it, it goes back in.)<\/li>\n<li>It ends. One impossible thing, its length, is enough; nobody should be lost in it.<\/li>\n<\/ul>\n<p><strong>Out the back.<\/strong> The back door lets you out behind an ordinary small building. The front is round the corner, eight metres away.<\/p>\n<h2>The lights<\/h2>\n<p>Every thing you can use indoors is a light and a sound. The room's drawing is the sum of the lights that are on. The room's sound is the same sum.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thing<\/th>\n<th>Lights<\/th>\n<th>Sounds<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Thing\">Cord by the door<\/td>\n<td data-label=\"Lights\">The counter<\/td>\n<td data-label=\"Sounds\">A tube: it stutters, then hums<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Aisle cords<\/td>\n<td data-label=\"Lights\">A stretch of aisle each<\/td>\n<td data-label=\"Sounds\">A tube each, a little different<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Cooler<\/td>\n<td data-label=\"Lights\">The floor in front of it<\/td>\n<td data-label=\"Sounds\">Compressor<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Radio<\/td>\n<td data-label=\"Lights\">Its dial, and what's next to it<\/td>\n<td data-label=\"Sounds\">Static; a station that won't come in<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Register<\/td>\n<td data-label=\"Lights\">Its small window<\/td>\n<td data-label=\"Sounds\">The drawer<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Payphone<\/td>\n<td data-label=\"Lights\">Its lamp<\/td>\n<td data-label=\"Sounds\">Dial tone<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Light at the aisle mouth<\/td>\n<td data-label=\"Lights\">The opening<\/td>\n<td data-label=\"Sounds\">— (it's his; it was on when you came)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Switches have their light and their sound and no word in the picture.<\/p>\n<p><strong>What you leave.<\/strong> Lights stay as you left them. Each one lights what it really would and casts your shadow while you're near it. From the road at night the windows you lit are lit. They are still on the next time you come; the browser keeps them.<\/p>\n<p><strong>The main.<\/strong> A knife switch on the wall by the door, in the same patch of light as the cord. One pull and everything you ever turned on goes out, the hum falling away a light at a time, and the room is as he left it. It doesn't touch the name, the arrow or the canopy. Those aren't yours.<\/p>\n<h2>Asking for someone<\/h2>\n<p>Some things aren't lights. They're how you'd call a person. Nobody comes. The place answers.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thing<\/th>\n<th>You<\/th>\n<th>It<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Thing\">Bell line across the forecourt<\/td>\n<td data-label=\"You\">Cross it, however you're moving<\/td>\n<td data-label=\"It\">A bell, from inside the building<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Counter bell<\/td>\n<td data-label=\"You\">Tap<\/td>\n<td data-label=\"It\">DING. The radio slips off its station<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Pump handle<\/td>\n<td data-label=\"You\">Tap<\/td>\n<td data-label=\"It\">The numbers roll and stop<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Payphone receiver<\/td>\n<td data-label=\"You\">Tap, and keep it<\/td>\n<td data-label=\"It\">Dial tone; then something that isn't one<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The counter bell is the only thing in the place that lands a word, and it lands flat and sits there. After any of these the place is quieter for a few seconds.<\/p>\n<h2>Standing still<\/h2>\n<p>One sequence, wherever you are. <strong>Still means you are not being moved and not using anything.<\/strong> Looking round, by finger or by turning the phone, never counts; a hand is never still, and it doesn't have to be. The clock starts the moment you stop.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Since you stopped<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Since you stopped\">10–15 s<\/td>\n<td data-label=\"What happens\">Outdoors at night: the stars, one mark each, with tails as long as the night is old<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">15 s<\/td>\n<td data-label=\"What happens\"><strong>The first small thing<\/strong>, near you and not in the middle of your view. The steam off the cup stops. A pump's numbers tick over once<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">45 s<\/td>\n<td data-label=\"What happens\">One thing further off. The radio finds a station for a few seconds. The bell line rings with nobody on it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">2 min<\/td>\n<td data-label=\"What happens\">The payphone rings at the far end of the aisle. You hear it from anywhere, through the wall if you're outside<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">4 min<\/td>\n<td data-label=\"What happens\">The canopy lamp goes out. A patch of light crosses the forecourt from nothing overhead. The lamp comes back<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Gone from this table: the view levelling at 1 s (the view now stays where you left it; see \"Where this goes against the concept as written\"), and the lamp closing at 4 s and 8 s.<\/p>\n<p>The rules that keep it from being a haunted house:<\/p>\n<ul>\n<li><strong>Nothing moves while you're looking straight at it.<\/strong> You hear it, you turn, it has already happened. The cup is cold.<\/li>\n<li><strong>Turning doesn't restart the list, and doesn't put the stars out.<\/strong> Moving or using something does. Then everything stops at once: the first pinch toward the phone and it stops ringing, every time.<\/li>\n<li><strong>What changed stays changed<\/strong> until you leave.<\/li>\n<li><strong>Each thing on the list happens once a visit.<\/strong> Stand still again and you get the next one you haven't had.<\/li>\n<li>By day the first thing you get is at fifteen seconds. At night the sky comes first and the place second.<\/li>\n<\/ul>\n<h2>The hour<\/h2>\n<p>It sets how much the sun lights. That is all it does, and it's a lot.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>The sun's<\/th>\n<th>Dark, until something is on<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Midday<\/td>\n<td data-label=\"The sun&#x27;s\">The whole lot, shade included; a patch inside the door<\/td>\n<td data-label=\"Dark, until something is on\">Most of the room; the aisle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Morning, evening<\/td>\n<td data-label=\"The sun&#x27;s\">The lot, with long shadows; sun deep into the room<\/td>\n<td data-label=\"Dark, until something is on\">Less of the room; the aisle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Twilight<\/td>\n<td data-label=\"The sun&#x27;s\">Nothing: no sun, and the sky still light. No shadows anywhere, yours included, as on any evening<\/td>\n<td data-label=\"Dark, until something is on\">Indoors<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Night<\/td>\n<td data-label=\"The sun&#x27;s\">Nothing. The moon lights the open ground and the station's front, dimly<\/td>\n<td data-label=\"Dark, until something is on\">The moon's shade, and indoors, wherever the station doesn't light itself<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The wall clock turns the sun (shared). Turn it at noon to midnight and the lot outside the window goes dark.<\/p>\n<h2>The alien material<\/h2>\n<p>Light with nothing to cast it. Everything else in the place is lit the way it really would be, so this is the one thing that isn't.<\/p>\n<ul>\n<li><strong>The patch.<\/strong> A patch of light on the ground a little way off, with no lamp over it. It closes when you turn toward it. Stand in it, if you ever could, and you'd have no shadow.<\/li>\n<li><strong>One left on.<\/strong> A light in the place that you didn't turn on. From the road, a lit window that wasn't yours.<\/li>\n<li><strong>The light at four minutes,<\/strong> crossing the forecourt from nothing overhead.<\/li>\n<li><strong>The three circles<\/strong> east of the slab, in another hand (shared). Paint: faint in the dark, plain under a light.<\/li>\n<li><strong>The radio<\/strong>, between stations.<\/li>\n<\/ul>\n<p><strong>The chart.<\/strong> A grid under the clock, after the owner's sightings chart: a small drawing, a place, a date. It fills as you see these. On your second visit there's an entry dated the day of your first, with the place you stood longest. No sentence.<\/p>\n<h2>The moments<\/h2>\n<p><strong>Arriving by day.<\/strong> Across the road, 21 metres south of the sign, so the whole name is in the picture on a phone. The road in front of you, the sign with his name and nothing else on it, the arrow at the door, the canopy and pumps to the left, the desert all round. The door is three pinches away, or one tap. Nothing moves until you do.<\/p>\n<p><strong>Arriving at night.<\/strong> The same spot. Ink. The name, the bulbs, the canopy lit from below. Everything else is dark and drawn. You look round and nothing lights; you go toward what's lit.<\/p>\n<p><strong>Arriving at twilight.<\/strong> No shadows. Within three seconds a stroke of ink is laid into the sky and a letter of the name comes on against it (shared).<\/p>\n<p><strong>Crossing the door.<\/strong> You come up to it and stop. One more pinch, or a tap, and it gives. By day a patch of sun opens across a dark floor with your shadow in it, and a cord hangs in it. By night the room is dark: the small light at the aisle mouth, the arrow's flash on the floor behind you, and whatever you left on last time.<\/p>\n<p><strong>Inside, by day.<\/strong> You pull the cord. The counter is there, and your shadow. Past it the cooler and the radio are dark shapes at the edge of the tube's light; you go to them and turn them on. Each thing you turn on stays on and adds its sound. After a few minutes the room is half drawn, by you.<\/p>\n<p><strong>The aisle.<\/strong> Pool to pool, or in the dark toward the lamp at the end. The phone at the end. You turn round and the front window is a long way off.<\/p>\n<p><strong>Doing nothing.<\/strong> You stop. Something small happens behind you.<\/p>\n<p><strong>Leaving.<\/strong> Out the back and round, or back the way you came. From the road, the windows you lit.<\/p>\n<p><strong>Walking off.<\/strong> Into the desert. The station is lost; the sign comes up ahead (shared).<\/p>\n<p><strong>Coming back another day.<\/strong> Your lights are on. One you don't remember. A line on the chart with a date.<\/p>\n<p><strong>A view nobody composed.<\/strong> By day, anywhere: paper, a stripe of building, your shadow if you look down. By night, anywhere: the dark, drawn, and something lit a way off.<\/p>\n<h2>Every state<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What you get<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">First visit<\/td>\n<td data-label=\"What you get\">Every light off except the station's own at night, and the one at the aisle mouth<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Return visit<\/td>\n<td data-label=\"What you get\">Your lights as you left them; the chart with your entry<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Everything on, weeks later<\/td>\n<td data-label=\"What you get\">The room fully drawn and humming. That's your place now. The main is by the door<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">After the main<\/td>\n<td data-label=\"What you get\">As he left it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Noon in midsummer<\/td>\n<td data-label=\"What you get\">Almost no shadow outdoors; the sun barely over the sill indoors. The room is nearly all yours<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Under the canopy by day<\/td>\n<td data-label=\"What you get\">Shade, and the pumps shaded in it. No shadow; things answer a tap<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Under the canopy at night<\/td>\n<td data-label=\"What you get\">The lamp's pool. Your shadow, away from the lamp<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Twilight<\/td>\n<td data-label=\"What you get\">No shadows outdoors; things in reach still answer; indoors as at any hour<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Clock wound<\/td>\n<td data-label=\"What you get\">Marked in the margin; stays wound while you walk; lets go when you touch it again or leave<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You never go in<\/td>\n<td data-label=\"What you get\">The lot is whole: the bell line, the pumps, the phone heard through the wall, and all of the night<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You never stand still<\/td>\n<td data-label=\"What you get\">You never get the list. You still have the lights, the aisle and the night. This is the difference from 01: stillness adds to the concept and doesn't carry it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Sound off or blocked<\/td>\n<td data-label=\"What you get\">Each light that's on has a short repeating stroke beside it. Things heard-first leave a small mark where they happened. The bell has its word<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Motion off<\/td>\n<td data-label=\"What you get\">A pinch or a tap is a cut, not a move. A swipe still turns under the finger. The phone's tilt starts off. The light at four minutes is a held frame<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Keyboard<\/td>\n<td data-label=\"What you get\">Arrows walk and turn. Tab steps thing to thing, nearest first; Enter goes there, and again to use it; Escape puts you outside the last door. The thing in focus needs a mark of its own now that the lamp isn't it (visual; unsolved in the dark)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Phone<\/td>\n<td data-label=\"What you get\">Swipe to turn; pinch to move; tap to go or use; turn the phone to look, if you've allowed it (<a href=\"#how-controls\"><code>controls.md<\/code><\/a>)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Desktop<\/td>\n<td data-label=\"What you get\">Drag to turn; wheel or trackpad pinch to move; click. The same place, wider. Nothing depends on width<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">First seconds, never been<\/td>\n<td data-label=\"What you get\">Two words in the margin, <strong>swipe · pinch<\/strong> (and <strong>tilt<\/strong> on a phone). Each goes when you've done it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">At a wall, or the thing you pinched on<\/td>\n<td data-label=\"What you get\">You stop just short; the view leans a little and comes back<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">No 3D, or a screen reader<\/td>\n<td data-label=\"What you get\">The list of places (shared). Each place says what is lit and what you can hear. \"Look at\" a thing gives it in a line. Every switch is a button, and the main. The list's events arrive as lines. What has no version: the shadow. I'd sooner say so than fake it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Browser memory cleared<\/td>\n<td data-label=\"What you get\">Lights off, chart empty. Nothing needed is lost<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Loading<\/td>\n<td data-label=\"What you get\">The road still for this hour and the name as text; then the world<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Nothing made yet beyond the building<\/td>\n<td data-label=\"What you get\">The sign, the door, one cord, the aisle with bare shelves. It's still the concept<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Sound, here<\/h2>\n<p>The shared plan is this concept's plan: the place's sound is the sum of the lights. Here the visitor plays it. Each cord adds a hum; the main takes them away one at a time. If each lamp has a note (shared), walking through the shop turning things on builds a chord, and leaving them on leaves it sounding for next time.<\/p>\n<h2>Adam makes it into something<\/h2>\n<ul>\n<li><strong>A new light:<\/strong> a shape, what it lights, its sound. One entry.<\/li>\n<li><strong>A new thing to ask at:<\/strong> a shape and what answers.<\/li>\n<li><strong>A new thing the place does:<\/strong> one line on the standing-still list, or one cue at an hour or a date.<\/li>\n<li><strong>A plan:<\/strong> mark it out, a dashed footprint and a word (shared).<\/li>\n<li><strong>More aisle:<\/strong> when the bare shelves are full, a bay is added.<\/li>\n<li><strong>His own:<\/strong> strokes, then models, then paint, then a recording for each sound, one thing at a time and unseen (shared).<\/li>\n<\/ul>\n<h2>Jobs<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>Supported by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Job\">1 Arrive, place first<\/td>\n<td data-label=\"Supported by\">The road; nothing on screen but the place<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">2 Arrow sign, his name, pulled in<\/td>\n<td data-label=\"Supported by\">The sign straight ahead, arrow at the door; lit at night<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">3 Go in<\/td>\n<td data-label=\"Supported by\">Come up to the door, then one more pinch or a tap; off the latch at midday<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">4 Walk around, in and out<\/td>\n<td data-label=\"Supported by\">Pinch, tap, keys or wheel: the lot, the room, the aisle, out the back, round; off into the desert and back<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">5 Each touch means something<\/td>\n<td data-label=\"Supported by\">Every act puts light somewhere or takes it away; or asks for someone who doesn't come. Moving itself is the pinch: you go to what you touched<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">6 Hear it, also when doing nothing<\/td>\n<td data-label=\"Supported by\">The sum of the lights; your steps; the list, heard first<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">7 Different at another hour<\/td>\n<td data-label=\"Supported by\">How much is the sun's; where the patches fall; night; twilight<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">8 Alien things<\/td>\n<td data-label=\"Supported by\">The patch with no lamp over it; one left on; the light at four minutes; the circles; the chart<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">9 Do nothing<\/td>\n<td data-label=\"Supported by\">The sky, then the list<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">10 Find more next time<\/td>\n<td data-label=\"Supported by\">Your lights; the one that isn't; the chart entry; the rest of the list<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">11 Send it<\/td>\n<td data-label=\"Supported by\">They land on the road with everything off<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">12 Phone, desktop, fallbacks<\/td>\n<td data-label=\"Supported by\">The states table; <a href=\"#how-controls\"><code>controls.md<\/code><\/a>, every way in; the list of places<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">13 Add a thing<\/td>\n<td data-label=\"Supported by\">A light, a thing to ask at, a line on the list, a marked-out plan<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">14 Swap in his own<\/td>\n<td data-label=\"Supported by\">Per thing, unseen; sounds too<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">15–19 The work, later<\/td>\n<td data-label=\"Supported by\">A piece of work is a thing you put a light on. The shelves are there. The counter, the phone and the blank price slats are there<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Choices for the owner, inside the one concept<\/h2>\n<p>One is left.<\/p>\n<ol>\n<li><strong>The hums tuned to notes, or just hums.<\/strong><\/li>\n<\/ol>\n<p>Settled since round 2: the canopy (his answer: yes); the sign carries his name and nothing else (\"Gas is unnecessary\"); the shadow has a person's proportions (ruled). Settled since: no lamp (\"The light that follows where I look\"); light as in the real world; swipe, pinch, tap, tilt.<\/p>\n<p>His open question, whether the time of day does something, is answered by the concept: it changes how much of the place the sun lights, and so where you have a shadow and what you have to switch on.<\/p>\n<h2>Not proven<\/h2>\n<ul>\n<li>The look back down the aisle as a picture.<\/li>\n<li>The desert round the station, and brush in the day arrival (score 2, fixes 2 and 3). Not mine to fix.<\/li>\n<li>Any of it in a hand, on a phone. The new controls least of all: they have only been driven by emulated touches (<a href=\"#how-controls\"><code>controls.md<\/code><\/a>, \"Not proven\").<\/li>\n<li>The first minute indoors <strong>at night<\/strong>, with no lamp: whether the sign's light through the glass is enough to find the cord by.<\/li>\n<li>Whether a night with nothing of you in it until you reach a light is right for him. It is what real light does.<\/li>\n<li>Whether the first minute indoors by day is a pleasure. The cord in the door's light and a light at the aisle mouth are meant to make it one, now without a lamp to find the rest by. Nobody has walked it.<\/li>\n<li>Whether fifteen seconds is short enough. If people never stop, the concept still stands; that's the point of the merge.<\/li>\n<\/ul>\n<h2>What the lamp did, and what does it now<\/h2>\n<p>The lamp is out: \"I don't like the light thing at night… The light that follows where I look.\" The director ruled Left on stands (<code>steer-5.md<\/code>). Everything that leaned on it, plainly:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>It did this<\/th>\n<th>What still does it<\/th>\n<th>Left with nothing<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"It did this\"><strong>Showed you were there<\/strong>, indoors and at night<\/td>\n<td data-label=\"What still does it\">Your shadow under any real lamp, and from the moon in the open; the lights you leave on<\/td>\n<td data-label=\"Left with nothing\">In the moon's shade and in unlit rooms, nothing of you. Real, and he asked for it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Found things in the dark<\/strong> (the cooler, the radio, the far shelves, a pump at night away from the canopy)<\/td>\n<td data-label=\"What still does it\">The station's own lights; the cord by the door; the aisle-mouth light; the payphone's lamp; anything already on. You can pinch or tap toward a dark thing and you stop at it<\/td>\n<td data-label=\"Left with nothing\">Seeing a thing nothing lights, unless the dark drawing shows it. That is now the drawing's job (\"more dots, or reversed dots on dark\"), to be shown in the prototype<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>\"Your lamp is on it\"<\/strong> when you came up to a thing<\/td>\n<td data-label=\"What still does it\">In light, your shadow joins it<\/td>\n<td data-label=\"Left with nothing\">In the dark, no sign you've arrived except that you stopped<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Never a black screen<\/strong> (it always landed on something, the ground at your feet if nothing else)<\/td>\n<td data-label=\"What still does it\">—<\/td>\n<td data-label=\"Left with nothing\">The duty stays; the means has to be the dark drawing itself. Not proven<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Closed when you stood still<\/strong> (4 s and 8 s): the first sign that stopping does something<\/td>\n<td data-label=\"What still does it\">—<\/td>\n<td data-label=\"Left with nothing\">Nothing before the stars at 10–15 s at night, and the first small thing at 15 s by day. Whether fifteen seconds with no sign is too long is open<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>\"Turning brings your lamp back and the stars go\"<\/strong><\/td>\n<td data-label=\"What still does it\">Turning does nothing to the list, and nothing to the stars<\/td>\n<td data-label=\"Left with nothing\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Went in ahead of you through the door<\/strong> at night<\/td>\n<td data-label=\"What still does it\">By day the daylight still comes in with you. At night: the aisle-mouth light, the sign through the glass<\/td>\n<td data-label=\"Left with nothing\">A lit way to the first cord at night. PROPOSED above: the arrow's flash through the door glass<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Left two or three strokes on a thing you'd lit<\/strong>, so a dark place filled in as you went<\/td>\n<td data-label=\"What still does it\">What you switch on stays on, and fills the place in<\/td>\n<td data-label=\"Left with nothing\">The trail of where you'd merely looked. Gone, not replaced<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Was the keyboard's focus<\/strong><\/td>\n<td data-label=\"What still does it\">Tab still steps thing to thing<\/td>\n<td data-label=\"Left with nothing\">A visible mark for the thing in focus, above all in the dark<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Reached through the glass<\/strong> when the clock was wound to night<\/td>\n<td data-label=\"What still does it\">The lot outside goes dark<\/td>\n<td data-label=\"Left with nothing\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>Was what the fourth light resembled<\/strong> (\"a disc like yours\")<\/td>\n<td data-label=\"What still does it\">A patch of light with no lamp over it. Plainer, and easier to read now<\/td>\n<td data-label=\"Left with nothing\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>\"Look at\" in the list of places<\/strong> stood in for it<\/td>\n<td data-label=\"What still does it\">\"Look at\" gives the thing in a line; it never needed the lamp<\/td>\n<td data-label=\"Left with nothing\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"It did this\"><strong>The walk down the aisle by lamp alone<\/strong><\/td>\n<td data-label=\"What still does it\">The light at the mouth behind you, the payphone's lamp ahead<\/td>\n<td data-label=\"Left with nothing\">The shelves between cords, unless you pull one<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>In <a href=\"#elements\"><code>elements.md<\/code><\/a>, element 10 (\"Your lamp\") is struck.<\/p>\n<h2>Checked against \"as in the real world\"<\/h2>\n<p>Everything in this half and in <a href=\"#how-place\"><code>00-shared.md<\/code><\/a> that makes or uses light, against his rule. <strong>Square<\/strong> means it is what real light does. <strong>Exception<\/strong> means it isn't, and is kept on purpose, for the director to confirm. <strong>Flag<\/strong> means it isn't, and I don't think it should be kept as it is.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thing<\/th>\n<th>Verdict<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Thing\">Your shadow in the sun, joining what it falls on<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Your shadow under the canopy lamp, the lamp post, a room light, a lit window's spill<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">New. One per lamp really; the drawing may show the nearer only<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">No shadow in shade, at twilight, in the dark<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">What you switch on lights what's near it and stays on<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Sun patches on the floor moving with hour and season<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">Through filthy glass, weaker<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The sign's shadow on the slab, reaching the door on winter middays<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">Worked from a real sun<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">A thing in the canopy's shade is shaded<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">The old line \"near things keep a paper edge in shade\" was a drawing device to keep the pumps visible. How they stay readable while shaded is the visual designer's (dots)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\"><strong>\"Drawn once\" against \"lit by the hour\"<\/strong> (his \"no\" to the light redrawing a thing, section 18)<\/td>\n<td data-label=\"Verdict\">Square, restated<\/td>\n<td data-label=\"Note\">A thing's own marks, its paint, wear and grain, are drawn once and don't change. The shade and shadow that fall on it are real and move. The two no longer compete: one is the thing, the other is the light<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The door: daylight comes in with you<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">\"You take the light with you\" was a figure of speech; a door opening lets the day in. The lamp half is gone<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The arrow's bulbs lighting the forecourt in pulses, throwing your shadow toward the door, and reaching the floor inside through the door glass<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">PROPOSED, new; many bare bulbs really are a strong light. How strong is not known<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The stars appearing after 10–15 s of standing still<\/td>\n<td data-label=\"Verdict\">Square, near enough<\/td>\n<td data-label=\"Note\">Eyes adjust. They should not go out when you look round, and now don't<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The stars' tails, \"as long as the night is old\"<\/td>\n<td data-label=\"Verdict\">Exception, small<\/td>\n<td data-label=\"Note\">Not light; a way of drawing time. Visual's and the director's<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">\"A light that dims gets smaller, not fainter\"; light arriving \"in strokes, nearest first, in four held steps\"<\/td>\n<td data-label=\"Verdict\">Flag, for the visual designer<\/td>\n<td data-label=\"Note\">Drawing rules from the brush rounds. A tube that stutters and then holds is real; a pool that grows outward along a grain is not. With dots and real light these want restating<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Lights lost past 100 m (so the world's join doesn't show)<\/td>\n<td data-label=\"Verdict\">Exception<\/td>\n<td data-label=\"Note\">A lit sign in a desert is seen for miles. Kept, or the edge shows. The dark drawing may hide it some other way<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Twilight: the sky inked in from the top, a letter of the name a second<\/td>\n<td data-label=\"Verdict\">Exception<\/td>\n<td data-label=\"Note\">Staging, not light. A sign coming on at dusk is real; a letter a second is ours<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The wall clock turning the sun<\/td>\n<td data-label=\"Verdict\">Exception<\/td>\n<td data-label=\"Note\">The one control over light that isn't a switch. Once turned, the light obeys<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">At midday the door is off the latch<\/td>\n<td data-label=\"Verdict\">Not light<\/td>\n<td data-label=\"Note\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\"><strong>The patch of light with no lamp over it; the light at four minutes; one left on that nobody left<\/strong><\/td>\n<td data-label=\"Verdict\"><strong>Exception: the alien material<\/strong><\/td>\n<td data-label=\"Note\">This is the point of them. In a place where every light has a source, a light without one is the evidence<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The canopy lamp going out and coming back at four minutes<\/td>\n<td data-label=\"Verdict\">Square<\/td>\n<td data-label=\"Note\">A lamp can fail<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The aisle being 28 m long behind an 8 m building<\/td>\n<td data-label=\"Verdict\">Not light<\/td>\n<td data-label=\"Note\">The place's one impossible thing; untouched by the rule<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">The moon: far bigger than real, and up every night<\/td>\n<td data-label=\"Verdict\">Exception, his<\/td>\n<td data-label=\"Note\">\"Yes there's a moon and it's always epic… should be exaggerated.\" Its light then behaves as real moonlight: one direction, real shadows, through the door and windows. Its phase is open (<a href=\"#lights\"><code>lights.md<\/code><\/a>: always full; real phase always up; fully real)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Where this goes against the concept as written<\/h2>\n<ol>\n<li><strong>\"Walking\" is no longer continuous.<\/strong> You are carried by a pinch: three to the door where there were nine seconds of walking. \"The door is about nine seconds' walk\", \"four metres a second\" and \"half a minute out and back\" described a pace the phone no longer has (the keyboard keeps it). Footsteps as a sound have to be rethought with it.<\/li>\n<li><strong>The view no longer levels when you stop.<\/strong> It was the first row of standing still, and the director's steer keeps it (\"the list starts with the view levelling\"). I've taken it out: with swipe and tilt the view is where your hand put it, and a picture that drifts by itself is not \"like photos\". If you've tilted up to read the name, it should stay read. Director to overrule if wanted.<\/li>\n<li><strong>\"Keep walking into it for a second\" is gone.<\/strong> The door is arrive, then one more pinch or tap.<\/li>\n<li><strong>\"Nothing needs an interface\" has two small exceptions:<\/strong> two or three words in the margin on a first visit, and the word <strong>tilt<\/strong>, which on an iPhone has to be tapped before the phone will share its motion. Both are in the margin, not on the picture.<\/li>\n<li><strong>Looking does nothing.<\/strong> In the concept as approved, where you looked was where your light was. Now a swipe is only a swipe.<\/li>\n<li><strong>The margin has a fourth item<\/strong> on phones (tilt).<\/li>\n<\/ol>\n<h1>Left on — how it looks and feels<\/h1>\n<p><em>Look and feel (visual). Round 3, with the five small fixes the director asked for after scoring it 9 (<code>score-3.md<\/code>). Written after <code>score-2.md<\/code>, the owner's answers in <code>owner.md<\/code> section 7 (\"Canopy over pumps yes.\" \"Gas is unnecessary.\") and his walk of the round-2 prototype on his phone (section 8). Everything shown is a frame of the walked three.js prototype in <code>sketches/place/<\/code>. This half is current for the look; where the round-1 look-and-feel half of <a href=\"#how-place\"><code>00-shared.md<\/code><\/a> differs, this one stands.<\/em><\/p>\n<h2>What the owner said after walking it, and what I did<\/h2>\n<blockquote>\n<p>\"Prototype feels pretty good and fluid. Rendering is pretty high contrast though ... hard to really make out objects. I think there can be slightly more detail and variation in the brush stroke size or something to give more detail to the scene\"<\/p>\n<\/blockquote>\n<p>So the feel and the frame rate are no longer the risk. The look had one fault he saw at once: things were either paper on paper or ink on ink, so they vanished. Three changes, all still two values (\"pure ink for now\") and all still broken and loose (\"readable but not precise or always whole\"). Each is shown as a before and after of the same view; the before frames are the prototype with <code>?detail=0<\/code>, which is the look he walked.<\/p>\n<ol>\n<li><strong>A thing has a tone of its own.<\/strong> Until now everything was white plaster, so anything in the sun was blank. Now a painted thing (a pump, the bench, the phone box, the cooler) is never quite paper: it is always drawn, lightly where the sun is on it and densely where it isn't. The ground and the station's walls stay paper in the sun, so the place is still mostly empty.<\/li>\n<li><strong>More sizes of stroke.<\/strong> Each kind of thing wears the stroke sheet at its own size: the road largest, then the ground, then walls, then things, then small dark things finest. From far off, big surfaces wear it nearly four times larger again (below). A frame now has four or five sizes of mark in it where it had two.<\/li>\n<li><strong>A drawn line where an edge would be lost.<\/strong> (Things and the building only; never the ground.) Where a thing's outline or a corner falls paper against paper it gets a thin ink line; ink against ink in shade, a thin paper line. It has a brush's weight: it swells to about 5 cm and thins away to nothing over a metre or so of its length, is heavier in shade, and is used only for outlines and square corners, not every edge. (The first pass was an even hairline that read as a line render up close and at dusk; the director caught it.) This is Kirby's line (his references 16 and 17) used sparingly: only where a form would otherwise be lost, and only within about 35 m.<\/li>\n<li><strong>Shade is more open<\/strong> by day: more paper between the strokes, so what stands in it shows.<\/li>\n<\/ol>\n<p>All five pairs are set side by side in <code>pairs-05.png<\/code>, made to be judged on a phone. The before frames are today's prototype with the detail turned off, so they also carry this round's other changes (the scrub, the shadow's shape); what differs between left and right is only the detail.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Same view<\/th>\n<th>Before<\/th>\n<th>After<\/th>\n<th>What changed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Same view\">Pumps from the forecourt<\/td>\n<td data-label=\"Before\"><code>lo-pumps-a<\/code><\/td>\n<td data-label=\"After\"><code>lo-pumps-b<\/code><\/td>\n<td data-label=\"What changed\">Pump bodies are hatched boxes with edges; the island exists; the globes are circles<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Same view\">Front wall east of the door<\/td>\n<td data-label=\"Before\"><code>lo-front-a<\/code><\/td>\n<td data-label=\"After\"><code>lo-front-b<\/code><\/td>\n<td data-label=\"What changed\">There is a bench. It could not be seen before<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Same view\">Under the canopy, summer noon<\/td>\n<td data-label=\"Before\"><code>lo-shade-a<\/code><\/td>\n<td data-label=\"After\"><code>lo-shade-b<\/code><\/td>\n<td data-label=\"What changed\">The island's edge and the globe; the pump body is still a slab. The weakest pair<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Same view\">Inside, three lights on<\/td>\n<td data-label=\"Before\"><code>lo-room-a<\/code><\/td>\n<td data-label=\"After\"><code>lo-room-b<\/code><\/td>\n<td data-label=\"What changed\">Stock, counter things and cooler are separate things<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Same view\">A pump at night under the canopy lamp<\/td>\n<td data-label=\"Before\"><code>lo-nightpump-a<\/code><\/td>\n<td data-label=\"After\"><code>lo-nightpump-b<\/code><\/td>\n<td data-label=\"What changed\">The pump is drawn<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What this costs, said plainly.<\/strong> \"A sunlit wall against the sky has no edge\" was the most Ruscha thing in the drawing, and the director ruled to keep it. Near the building it is now gone: within 35 m the wall has a thin broken line against the sky. I think the owner's own eye on his own phone outranks the rule. From the road the building is beyond the line's reach and is still drawn only by its shade. If he misses the edgeless wall, the line can be limited to things and kept off the building; that is one number.<\/p>\n<p><strong>Not proven:<\/strong> that this is <em>enough<\/em> for him. He said \"slightly more\". I have gone one clear step, not three. He needs to see the pairs.<\/p>\n<h2>The first three seconds by day<\/h2>\n<p>The director's two real fixes, and the priority of the round.<\/p>\n<p><strong>The desert is in<\/strong> (<code>lo-arrive-day<\/code>, <code>lo-desert-east<\/code>, <code>lo-anywhere-day<\/code>).<\/p>\n<ul>\n<li><strong>A horizon all the way round:<\/strong> low mesas and hills, each a few long dry strokes, dense along the cap and letting go toward the ground the way distance does. One long mesa stands up behind the station as you arrive, so the building sits in front of something, and a butte stands right of the sign. After his reference 10 (the long blue mesas behind Prada Marfa), drawn the way 14 is drawn.<\/li>\n<li><strong>Scrub:<\/strong> sparse tufts on the open ground, each six to ten flicked strokes, after the dry grass and yucca in 09 and 10.<\/li>\n<li><strong>Drifts:<\/strong> patches of ground that are never quite paper, so loose dry strokes lie across them along the sun. I tried placing one in the foreground of the arrival and took it out: seen that close and end-on, the strokes were a row of dabs that read as paw prints. The arrival's foreground is the road and a tuft.<\/li>\n<li><strong>A fence line<\/strong> along the far side of the road, running out of sight both ways with a gap at the lot. From 10. It gives the road a length.<\/li>\n<li>I did not add the cactus from 09. A prickly pear in the foreground of a site with aliens in it is one wink too many for \"liminal not funny\".<\/li>\n<li><strong>The join at the world's edge does not show.<\/strong> The horizon goes with you like the sky does, so being put down on the far side changes nothing in it. Scrub is lost at about 45 m (small things are lost sooner than big ones), which is nearer than the nearest tuft can be when you are turned round. The fence repeats every 4 m and the turn-round is a whole number of posts. Reasoned and built; <strong>I did not capture the frames either side of the turn-round<\/strong>, so this is not yet proven by a picture.<\/li>\n<\/ul>\n<p><strong>Brush in the day arrival.<\/strong> I tried what the director proposed, and it works: a second, larger size of stroke for surfaces seen from far off. Beyond about 32 m a surface wears the sheet nearly four times larger; between 32 m and 12 m the large strokes give way to the fine ones. Both sizes are fixed to the world; nothing slides. What you see while walking in is the marks on the building changing from few and big to many and fine over about five seconds (<code>lo-arrive-day<\/code>, <code>lo-walk-3s<\/code>, <code>lo-walk-6s<\/code>).<\/p>\n<p>Measured with the walk-past test, same method as last round (third block of <code>walk-test.png<\/code>): watching one 8 m square from 34 m in to 8 m, 15% to 23% of its ink changes on the way, against 0.9% for one frame of walking. That is as much change, over the whole walk, as the control with the sheet stuck to the screen shows. So from one frame to the next it holds still, and over the five seconds of the walk in the marks on the building are redrawn completely. <strong>This is the one place where the ink does not simply stay put. Whether it reads as \"coming into focus\" or as \"crawling\" can only be judged in motion on a screen, and I have not seen it move.<\/strong> If it crawls, the switch is <code>?big=0<\/code> and the desert and the road carry the arrival's brush by themselves, which they now can.<\/p>\n<p>Honest reading of <code>lo-arrive-day<\/code>: the brush in the first frame is, in order, the road, the mesa, the canopy's shade and the scrub. The station's sunlit front is still a small plain shape, on purpose.<\/p>\n<h2>The stroke method (unchanged since round 2, restated briefly)<\/h2>\n<p>Every surface wears one picture, the <em>stroke sheet<\/em>: brush strokes lying side by side, recording how soon each bit of each stroke shows as its place gets darker. The light decides how much of each stroke is there. On the ground the sheet lies along the light (along the sun's shadows by day, outward from a fixed lamp at night); on walls and things it lies along the surface. His own sheet replaces the generated one as one image file (<code>?sheet=his.png<\/code>, tested last round), and a Blender model carries its own sheet in its own texture.<\/p>\n<p><strong>The walk-past test, re-run on this round's prototype<\/strong> (<code>stills/walk-test.png<\/code>, <code>sketches/place/walk.js<\/code>): one 4 m square of ground read from eight stands, against a control with the same sheet stuck to the screen.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ink changed from the first stand<\/th>\n<th>Strokes on the world<\/th>\n<th>Same sheet stuck to the screen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Ink changed from the first stand\">Day, edge of the canopy's shadow<\/td>\n<td data-label=\"Strokes on the world\">0.6% to 3.3% (0.8% after one frame of walking)<\/td>\n<td data-label=\"Same sheet stuck to the screen\">7% to 15% once you turn or move more than a step<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Ink changed from the first stand\">Night, edge of the canopy lamp's pool<\/td>\n<td data-label=\"Strokes on the world\">0.5% to 1.4% (0.5% after one frame)<\/td>\n<td data-label=\"Same sheet stuck to the screen\">20% to 28%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Limits of the method.<\/strong> A stroke has a size in the world and not on the screen (the far size above is the answer to that, within limits). Narrow things are eaten by the brush. The sheet repeats every 8 m. A hard black-and-white drawn sheet converts coarsely. The strokes look generated: even, combed, one family of mark; that is one file to replace, and his.<\/p>\n<h2>The rules of the drawing<\/h2>\n<ol>\n<li><strong>Ink is where the light isn't, and the light decides how much of each stroke shows.<\/strong> Two values. A light that dims gets smaller, not fainter.<\/li>\n<li><strong>Shade is brushed. Dark is whole.<\/strong> By day, strokes with paper between. Where no light reaches (night, indoors), solid.<\/li>\n<li><strong>Two blacks.<\/strong> Shadow is strokes and moves with the light. Paint is flat, sharp and never moves: his name, the arrow, the stripes, the garage door, the card, the marked-out footprints.<\/li>\n<li><strong>The light sets the grain of the ground. A thing keeps its own grain,<\/strong> at its own size.<\/li>\n<li><strong>A thing has a tone.<\/strong> The ground and plaster are paper in the sun. Painted things, the road and the drifts never quite are.<\/li>\n<li><strong>A lost edge gets a line of the other value,<\/strong> thin, wandering and broken, within about 35 m. In full dark there is no line: there the thing is yours to light.<\/li>\n<li><strong>Far things are lost<\/strong> past about 100 m; small things sooner. The horizon is exempt: it is the far thing.<\/li>\n<li><strong>Your shadow is the one mark kept cleaner than the brush.<\/strong><\/li>\n<li><strong>Dots:<\/strong> a regular row is bulbs; a loose cluster is the alien material.<\/li>\n<li><strong>A word that lands is rare:<\/strong> the counter bell only.<\/li>\n<\/ol>\n<h2>The place, state by state<\/h2>\n<p><strong>Built<\/strong> means it is in the prototype and there is a frame from this round. <strong>Words<\/strong> means described and not yet seen.<\/p>\n<h3>Arriving<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">By day<\/td>\n<td data-label=\"How it looks and feels\">You stand across the road, 21 m south of the sign. Paper sky. The sign up the middle: TRABOLD stacked, the black arrow diving at the door. Behind the low strip of station, a mesa in long dry strokes; right of the sign, a butte. The canopy's brushed shade on the left with the pumps drawn in it. The road as one band of long strokes; this side of it a tuft or two. Nothing moves. <code>lo-arrive-day<\/code>, <code>lo-arrive-day-small<\/code>, <code>lo-wide-day<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">At dusk<\/td>\n<td data-label=\"How it looks and feels\">The same frame with no sun: no shadow anywhere, the flattest the place ever is, the horizon at its plainest. The top of the sky has been inked in, in level strokes far bigger than any on the ground, with a ragged lower edge. T, R, A and B are lit against it. O, L and D are dark boxes not yet on. The arrow's bulbs are not on. <code>lo-arrive-dusk<\/code><\/td>\n<td data-label=\"\">Built as one still. The sequence (a stroke and a letter a second) is words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">At night<\/td>\n<td data-label=\"How it looks and feels\">Ink. The name is seven lit boxes, the arrow is its bulbs, the station a lit strip with the canopy's pool raying out of it. <code>lo-arrive-night<\/code>, <code>lo-arrive-night-small<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Loading<\/td>\n<td data-label=\"How it looks and feels\">The arrival still for the hour, with the name as text where the sign's letters will be.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Framing: whole name, arrow, door and both ends of the station inside the frame at 390 × 844 and 360 × 740, from the live first frame. The walk is 4 m a second, so the door is about nine seconds away (<code>lo-walk-3s<\/code>, <code>lo-walk-6s<\/code>).<\/p>\n<h3>Your two marks<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">Your shadow<\/td>\n<td data-label=\"How it looks and feels\">A person: a head, shoulders, a body, two legs cut by the bottom of the screen. No ears, hood or point. It shows only where the sun would otherwise reach, so never under the room's own lights (it used to leave a ragged tuft at your feet indoors that read as an animal). It is laid by its own rule and not by the brush, so its outline is clean and only its inside is brushed. On the slab it runs away from the sun (<code>lo-strokes-day<\/code>); just inside the door it stands in the doorway's light on the floor (<code>lo-door-in<\/code>). At dusk there is none.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Your lamp<\/td>\n<td data-label=\"How it looks and feels\">Only where no daylight reaches: indoors and at night. A disc of paper where you look, its rim breaking along the surface's own strokes, <strong>and a pool on the ground in front of your feet, always.<\/strong> Turn away from the station at night and the bottom of the screen is still lit ground with strokes in it (<code>lo-night-away<\/code>). When you stand still the disc closes and the pool draws in to a small one a few steps ahead, and stays (<code>lo-night-still<\/code>). The dark is never a blank screen, moving or still.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">A thing lit and left<\/td>\n<td data-label=\"How it looks and feels\">Keeps two or three plain strokes of itself for the visit.<\/td>\n<td data-label=\"\">Built in round 1, not re-shot<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Sun to dark and back<\/td>\n<td data-label=\"How it looks and feels\">No fade: one step over the threshold.<\/td>\n<td data-label=\"\">Built (<code>lo-door-in<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>What you can do<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">Walk up to a thing<\/td>\n<td data-label=\"How it looks and feels\">Nothing is added to say you've arrived. The thing's line gets heavier and its strokes finer as you close.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Use it (a light)<\/td>\n<td data-label=\"How it looks and feels\">The light arrives as strokes, nearest first, outward along the grain, in about four held steps over a third of a second. Off is the reverse.<\/td>\n<td data-label=\"\">Words. The lit states are built; the switching is not<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Go through a door<\/td>\n<td data-label=\"How it looks and feels\">One loaded stroke across the screen; it hides the join into the aisle's impossible space.<\/td>\n<td data-label=\"\">Words, and <code>cross-2d.png<\/code> from round 1<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Stand still<\/td>\n<td data-label=\"How it looks and feels\">Below<\/td>\n<td data-label=\"\"><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>The place, by how light gets to it<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">The lot, by day<\/td>\n<td data-label=\"How it looks and feels\">Paper, with every shadow a feathered stack of strokes along the sun, and each thing drawn in its own finer marks with a line where its edge would be lost. <code>lo-pumps-b<\/code>, <code>lo-front-b<\/code>, <code>lo-strokes-day<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Under the canopy by day<\/td>\n<td data-label=\"How it looks and feels\">Open brushed shade; the island, posts, pumps and globes drawn in it. No lamp. <code>lo-shade-b<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">The lot, by night<\/td>\n<td data-label=\"How it looks and feels\">Ink, whole. The name, the bulbs, the canopy pool. Everything else exists in your disc and at your feet. <code>lo-arrive-night<\/code>, <code>lo-strokes-night<\/code>, <code>lo-nightpump-b<\/code>, <code>lo-anywhere-night<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">The desert<\/td>\n<td data-label=\"How it looks and feels\">Above. By night it is not drawn at all except in your light: a tuft is a black mark in your disc.<\/td>\n<td data-label=\"\">Built by day and dusk; night scrub in the lamp not shot<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">The front room, by day, lights off<\/td>\n<td data-label=\"How it looks and feels\">Black; the doorway on the floor with you standing in it; your disc on the back wall. <code>lo-door-in<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">The front room, by day, lights on<\/td>\n<td data-label=\"How it looks and feels\">The tube lights the counter's top, its things and the wall behind; the counter's face stays black. Stock, jacket, register, cup, bell, radio and cooler are separate drawn things. The door's sun lies on the floor. <code>lo-room-b<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">The aisle<\/td>\n<td data-label=\"How it looks and feels\">Always night. Shelves as bars running to a point; a lit stretch is a paper floor. <code>lo-aisle<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">The far end, the look back<\/td>\n<td data-label=\"How it looks and feels\">With your lamp closed and the aisle dark, the front window is the one bright thing: small, a long way off, with the lot in it. <code>lo-aisle-back<\/code><\/td>\n<td data-label=\"\">Built. It holds only while the aisle's own lights are off; with stretches lit, they are the picture<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Out the back<\/td>\n<td data-label=\"How it looks and feels\">An ordinary wall.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>The lights<\/h3>\n<p>Each is a small flat bright shape for the lamp itself, a pool of paper whose rim breaks outward in strokes, and the things in the pool drawn in it.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Light<\/th>\n<th>Its pool<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Light\">Counter tube, aisle cords, cooler, aisle mouth, payphone<\/td>\n<td data-label=\"Its pool\">As last round<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\">Radio, register<\/td>\n<td data-label=\"Its pool\">A dial and a window: paint only<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\">The main<\/td>\n<td data-label=\"Its pool\">Every pool closes in turn, far strokes first.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\">What you leave, from the road<\/td>\n<td data-label=\"Its pool\">Lit windows as flat paper rectangles in the black strip of the station.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Asking for someone<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thing<\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Thing\">Counter bell<\/td>\n<td data-label=\"How it looks and feels\">DING lands as slab letters known only by the ink they throw, and stays until you move.<\/td>\n<td data-label=\"\">Words; the round-1 2D frame<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Bell line, pump handle, payphone<\/td>\n<td data-label=\"How it looks and feels\">A sound; with sound off, a small mark where it came from. The pump's numbers are paint and they change.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Standing still<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Since you stopped<\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Since you stopped\">4–8 s<\/td>\n<td data-label=\"How it looks and feels\">The disc closes from the rim in and the pool at your feet draws in to a small one that stays, in three or four held steps. Smaller, never fainter.<\/td>\n<td data-label=\"\">Built as a smooth close; the held steps are not<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">10–15 s, outdoors at night<\/td>\n<td data-label=\"How it looks and feels\">Stars, one swelling stroke each, round the still point.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">15 s and after<\/td>\n<td data-label=\"How it looks and feels\">Each event is small, to one side and already over when you turn.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Since you stopped\">4 min<\/td>\n<td data-label=\"How it looks and feels\">The canopy pool closes; a disc with no grain crosses the slab; the pool rays back.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>The hour<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Day<\/td>\n<td data-label=\"How it looks and feels\">Shadows short at midday, long and feathered early and late; the ground's strokes turn to lie along them.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Dusk<\/td>\n<td data-label=\"How it looks and feels\">Above. One still.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Night<\/td>\n<td data-label=\"How it looks and feels\">Above.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Clock wound<\/td>\n<td data-label=\"How it looks and feels\">The shadows swing while you watch through the window. Margin: \"wound\" and the real time, typewritten.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>The alien material<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>How it looks and feels<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">The fourth light<\/td>\n<td data-label=\"How it looks and feels\">A disc like yours, somewhere you aren't looking.<\/td>\n<td data-label=\"\">Built in round 1, not re-shot<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">One left on<\/td>\n<td data-label=\"How it looks and feels\">A lit window you don't remember.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">The three circles<\/td>\n<td data-label=\"How it looks and feels\">Dashed paint on the ground east of the slab.<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">The chart<\/td>\n<td data-label=\"How it looks and feels\">Thin ruled lines and small line drawings after his reference 15, on the wall under the clock.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Every state<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>How it looks<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td
