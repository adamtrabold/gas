<style>
/* The synths-to-go site's look: same tokens, type and components. Only the parts this site uses. */
:root{--bg:#EBEBEB;--cell:#F3F3F3;--paper:#FBFBFB;--rule:#C6C6C6;--ink2:#5A5A5A;--ink:#1A1A1A;--on:#23863F;--m:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:24px}
.tbl{font-variant-numeric:tabular-nums}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* header */
header.band{padding:18px var(--m) 14px}
.hgrid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.name{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}
.sub{font-size:13px;color:var(--ink2)}
nav.filters{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:0;box-shadow:inset 0 -1px 0 var(--rule);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav.filters::-webkit-scrollbar{display:none}
.wrap:has(>nav.filters){margin-bottom:24px;position:sticky;top:0;z-index:5;background:var(--bg)}
@media(min-width:1024px){.wrap:has(>nav.filters){margin-bottom:36px}}
@media(max-width:599px){nav.filters{gap:16px}nav.filters::after{content:"";flex:none;width:8px}nav.filters.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}}
nav.filters a{font-size:15px;color:var(--ink2);padding:6px 0 9px;border-bottom:2px solid transparent;flex:none}
nav.filters a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.brand a{color:var(--ink);text-decoration:none;white-space:nowrap}
@media(min-width:1024px){:root{--m:48px}.name{font-size:26px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips a,.chips button{border:1px solid var(--rule);padding:4px 10px;font-size:13px}

/* docs */

.doc-html blockquote{margin:10px 0;padding:2px 12px;border-left:2px solid var(--ink)}
.doc-html hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.doc-html ul,.doc-html ol{padding-left:22px}
.tbl{overflow-x:auto;margin:10px 0;border-top:1px solid var(--rule)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}

details.jump a{display:block;padding:3px 0}

/* an element you can turn round: the prototype in a frame. Only the one in view runs; touches scroll the page until you tap. */
.embed{margin:12px 0 18px}
.embed .frame{height:clamp(300px,60vh,520px);background:var(--paper);border:1px solid var(--rule);position:relative}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
.embed.live iframe{pointer-events:auto}
.embed.live .frame{border-color:var(--ink)}
.embedbar{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-size:13px;margin:6px 0 0}

.wide{max-width:900px}
.wrap.wide{margin-left:max(0px,calc((100% - 1440px)/2));margin-right:auto}
.purpose{font-size:15px;margin:0 0 20px;max-width:70ch}
main p,main pre{overflow-wrap:anywhere}
.about{margin-top:40px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}.about b{color:var(--ink);font-weight:600}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}

@media(min-width:900px){.drow{grid-template-columns:240px minmax(0,1fr) 260px;align-items:baseline}}
@media(max-width:599px){
 .doc-html .tbl{border-top:0;overflow:visible}
 .doc-html table,.doc-html tbody,.doc-html tr,.doc-html td{display:block;width:100%}
 .doc-html thead{display:none}
 .doc-html tr{border-top:1px solid var(--ink);padding:6px 0 8px}
 .doc-html td{border:0;padding:3px 0 3px 106px;position:relative;min-height:22px}
 .doc-html td::before{content:attr(data-label);position:absolute;left:0;width:96px;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding-top:2px;overflow-wrap:anywhere}
 .doc-html td[data-label=""]{padding-left:0}.doc-html td[data-label=""]::before{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script type="application/json" id="data">{"project": {"name": "gas station", "line": "the prototypes, and how the place works"}, "words": {"try": "try", "elements": "elements", "how": "how it works"}, "note": "<h2>Latest<\/h2>\n<ul>\n<li>The station has the new controls: swipe to look, pinch to move, two fingers to slide, tap to go.<\/li>\n<li>Shade, shadows and night are dots. Night is darker, lit by one canopy lamp and a big moon behind you.<\/li>\n<li>The sky and the land around aren't drawn yet. That's next.<\/li>\n<\/ul>\n<h2>One thing to try<\/h2>\n<p>Open the station. Tap \"night, dark dots\", then \"night, light dots\". Which one is night?<\/p>", "protos": [{"key": "station", "title": "The station", "href": "try/", "line": "The place in 3D. It still has the old controls for now: drag to look, hold to walk.", "views": [{"hash": "together", "line": "with the canopy and a blank wall"}, {"hash": "pump", "line": "alone"}, {"hash": "slab", "line": "slab, island, both pumps, open sun"}], "hours": ["day", "night"]}, {"key": "controls", "title": "The new controls (test page)", "href": "controls-test/", "line": "A test of the new gestures on stand-in shapes, not the station. Best on a phone.", "views": [], "hours": []}], "docs": {"elements": {"title": "Elements — what each thing needs before it's drawn", "tab": "", "route": "#elements", "html": "<h1>Elements — what each thing needs before it's drawn<\/h1>\n<p>Your words: \"before drawing elements let's first establish a list of things they need.\" You've confirmed this is the list you meant.<\/p>\n<p><strong>How to use it:<\/strong> against any line say <em>wrong<\/em>, <em>missing<\/em> or <em>strike<\/em>.<\/p>\n<p><strong>Where each part came from.<\/strong> Your pictures are named, not numbered:<\/p>\n<ul>\n<li><strong>[Abandoned]<\/strong> — your photo of the abandoned desert station with blue pumps and a cactus<\/li>\n<li><strong>[Route 66]<\/strong> — your photo of the white Route 66 station with two yellow-and-orange pumps<\/li>\n<li><strong>[1934]<\/strong> — your photo of the restored 1934 station with red pumps under a canopy<\/li>\n<li><strong>[Marfa]<\/strong> — your photo of Prada Marfa by the road<\/li>\n<li><strong>[Standard]<\/strong> — Ruscha's Standard Station<\/li>\n<li><strong>[Inn]<\/strong> — your photo of the alien inn sign with the saucer on a crane<\/li>\n<li><strong>[Chart]<\/strong> — your chart of UFO shapes<\/li>\n<li><strong>[Article]<\/strong> — the sign article you sent, now read, with its pictures<\/li>\n<li><strong>[Diver]<\/strong> — your photo of the tall MOTEL sign at dusk with the neon diver down the pole<\/li>\n<li><strong>[Palms]<\/strong> — your photo of The Palms Motor Hotel sign at night, with the neon palm trees and the arrow full of bulbs<\/li>\n<li><strong>[Desert Hills]<\/strong> — your photo of the Desert Hills Motel sign on Route 66, with the neon cactus<\/li>\n<li><strong>[you]<\/strong> — your words<\/li>\n<li><strong>[concept]<\/strong> — Left on needs it to do something<\/li>\n<li><strong>PROPOSED<\/strong> — we made it up, and you haven't said yes yet<\/li>\n<li><strong>ACCEPTED<\/strong> — we made it up, and you said yes<\/li>\n<\/ul>\n<p>Each element ends with an empty slot for the visual designer. I've left those empty on purpose.<\/p>\n<h2>Settled so far<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>You said<\/th>\n<th>So<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"You said\">\"abandoned\"<\/td>\n<td data-label=\"So\">Abandoned, not kept up<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"This is liminal space logic so abandoned can still have power\"<\/td>\n<td data-label=\"So\">Abandoned for years and the power never went off. Faded and rusted, and everything still works. One cup on the counter is still warm<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"Proposal sounds good\"<\/td>\n<td data-label=\"So\">Glass stays in the door and the two front windows, filthy and cracked. Garage door panes broken. One side window boarded<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"realistic labeling with fake brand names\" / \"I'll deal with that just mock for now\"<\/td>\n<td data-label=\"So\">Labels as real ones were, with invented brands. <strong>You will supply the names.<\/strong> Until then the ones below are placeholders<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"joined\"<\/td>\n<td data-label=\"So\">The canopy is part of the building<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"stucco over brick\"<\/td>\n<td data-label=\"So\">The wall<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"sounds good\"<\/td>\n<td data-label=\"So\">Bell line, road centre line, bench, phone box, air hose on its own post: all in. (The three sign items you also accepted are reopened by what you said next; see the sign)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"lettering yes utility poles yes lamp post yes clouds boulders mountains and brush in the distance yes\"<\/td>\n<td data-label=\"So\">All added, each in its element below<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"not yet\"<\/td>\n<td data-label=\"So\">No picture for the inside. It stays proposed<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"neon and historically accurate… maybe some of the letters could flicker\"<\/td>\n<td data-label=\"So\">The sign entry is rewritten from your article<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"I want the best amalgamation?\" / \"Here are the additional images I think you still need\"<\/td>\n<td data-label=\"So\">The three photos arrived. The sign is now written as one sign made from them and the article: element 5<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"The light that follows where I look\" (the light you don't like at night)<\/td>\n<td data-label=\"So\">Your lamp is gone. Element 10 is struck. Looking lights nothing<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"I want an employee of the month on the wall in a frame… a portrait of art bell with the name \"art\" on the frame name plaque\"<\/td>\n<td data-label=\"So\">Added to the front room: element 14<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"Lighting should work as in the real world\"<\/td>\n<td data-label=\"So\">Every light lights what it really would; you cast a shadow wherever a real light falls on you, the sun or a lamp, and none in the dark; a thing in shade is shaded. Elements 8 and 9<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"I dislike press and hold… pinch… swiping should rotate camera\"; \"like photos\"; \"phone gyro\"<\/td>\n<td data-label=\"So\">One finger turns you, two fingers move you, a tap goes there or uses the thing; turning the phone turns the view. Not an element; written in <a href=\"#how-controls\"><code>concepts/controls.md<\/code><\/a><\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"don't care\" (which arrow; the starburst)<\/td>\n<td data-label=\"So\">The designers decide both<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">\"Well it would probably be me squatting\"<\/td>\n<td data-label=\"So\">The person who isn't there is you. Written up below as a proposal for you to check<\/td>\n<\/tr>\n<tr>\n<td data-label=\"You said\">Your picks on the pump: \"A1 b3 d no e2\"<\/td>\n<td data-label=\"So\">Short flat-topped pump; drawn in dots; a scanned paper on each part. \"No\" to the light redrawing it is read as: drawn once. See element 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Not mentioned, so left out unless you say:<\/strong> awnings over the windows, opening hours on the door, the small windmill on the roof.<\/p>\n<p><strong>The three places abandoned and left-on pulled against each other are closed<\/strong> by your answers: the power is on, the cup stays, the front glass stays.<\/p>\n<h2>It's you squatting — a proposal for you to check<\/h2>\n<p>Your words: \"Well it would probably be me squatting.\" So the person who isn't there is not an attendant. It's you, living in an abandoned station and making it into something. You are never shown: no figure, no photo, no voice.<\/p>\n<p><strong>What it explains, with nothing added<\/strong><\/p>\n<ul>\n<li>The power: you keep it on.<\/li>\n<li>The warm cup and the jacket: yours.<\/li>\n<li>The chalked outlines in your handwriting: your plans for the place.<\/li>\n<li>Your name on the sign.<\/li>\n<li>BACK IN 5 MINUTES: you wrote it.<\/li>\n<\/ul>\n<p><strong>What a visitor can find of yours, and where<\/strong> (all PROPOSED; question 1)<\/p>\n<ul>\n<li>On the counter: the cup, a camp stove, brushes and a bottle of ink, a notebook.<\/li>\n<li>On the hook: the jacket.<\/li>\n<li>At the far end of the aisle: a bedroll, made, and an instrument case.<\/li>\n<li>On the ground outside: your outlines.<\/li>\n<li>Under the clock: the chart of odd things, kept in your hand.<\/li>\n<\/ul>\n<p><strong>What it does to standing still.<\/strong> Nothing on that list needs anyone present: a cup goes cold, a phone rings for someone who's out. And that is the rule that keeps this from being frightening: <strong>you are out, not hiding.<\/strong> The card says so. Nobody is in the dark at the end of the aisle. The visitor is alone in the place of someone who'll be back.<\/p>\n<p><strong>What it does to coming back.<\/strong> Between a visitor's visits, things have changed because you've been there: the cup has moved, an outline has become a thing. This is true as well as told. When you really add something to the site, that is you making the place into something.<\/p>\n<p><strong>What it does to the alien material.<\/strong> It sharpens it. There are now two hands on the lot: yours, and the one that drew the three circles. The chart is your own record of things you can't explain either. On a visitor's second visit there's an entry about <em>them<\/em>, in your hand: to you, they were the odd thing that turned up.<\/p>\n<p><strong>How it stays liminal.<\/strong> No jokes, no self-portrait, no signature anywhere but the sign. Your things are ordinary and few. Nothing says who you are; a visitor who doesn't know the name learns only that someone lives here, draws, and is out.<\/p>\n<p><strong>What it opens for later<\/strong> (parked; nothing designed): \"who Adam is\" becomes the things on the counter; \"the work\" becomes what you've been making in the place; \"get in touch\" becomes leaving word for someone who's out.<\/p>\n<h2>Brand names: placeholders<\/h2>\n<p>You've said you'll supply these yourself (\"just mock for now\"). The names below are stand-ins so that labels can be drawn at the right size and shape. They will be replaced by yours and should not be treated as chosen.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>For<\/th>\n<th>Proposed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"For\">Gasoline (pump globes, the oil drum)<\/td>\n<td data-label=\"Proposed\">LLANO · DRY LAKE · TEX-O-NEV · ALKALI<\/td>\n<\/tr>\n<tr>\n<td data-label=\"For\">Motor oil (cans, the rack)<\/td>\n<td data-label=\"Proposed\">IRONWOOD · CALICHE<\/td>\n<\/tr>\n<tr>\n<td data-label=\"For\">Ice and soda (the ice box, the cooler)<\/td>\n<td data-label=\"Proposed\">BLUE MESA ICE · ARROYO COLA<\/td>\n<\/tr>\n<tr>\n<td data-label=\"For\">Cash register<\/td>\n<td data-label=\"Proposed\">PECOS<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Grades on the pumps: REGULAR and HI-TEST. (Your Route 66 photo says ETHYL, which was a real company's name, so it's out.)<\/p>\n<h2>The order to build in, and why<\/h2>\n<ol>\n<li><strong>Pump<\/strong> — already under your eye, and the smallest thing with steel, glass, rubber and lettering.<\/li>\n<li><strong>Slab and island<\/strong> — everything stands on it and every shadow lands on it.<\/li>\n<li><strong>Canopy<\/strong> — makes the shade the pumps stand in.<\/li>\n<li><strong>Station front<\/strong> — wall, door, windows, garage door.<\/li>\n<li><strong>Sign<\/strong> — your name. Waits on the photos you're sending.<\/li>\n<li><strong>Road<\/strong><\/li>\n<li>\n<p><strong>Desert, horizon, sky<\/strong>\n   <em>— first whole picture: arriving by day —<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Your shadow<\/strong><\/p>\n<\/li>\n<li><strong>The station's own lights<\/strong><\/li>\n<li><strong>Your lamp<\/strong>\n    <em>— second whole picture: arriving at night —<\/em><\/li>\n<li><strong>Small things on the lot<\/strong><\/li>\n<li><strong>Marks on the ground<\/strong><\/li>\n<li><strong>The door, and the front room<\/strong><\/li>\n<li><strong>Things on the counter and walls<\/strong><\/li>\n<li><strong>The aisle<\/strong><\/li>\n<li><strong>Round the back<\/strong><\/li>\n<\/ol>\n<p>Outside before inside, day before night. The inside is last, so nothing waits on a picture for it.<\/p>\n<hr />\n<h2>1. Pump (two of them)<\/h2><div class=\"embed\" data-src=\"try/#view-pump\"><div class=\"frame\"><\/div><p class=\"embedbar\"><button type=\"button\">Tap to turn it and zoom<\/button><a class=\"u\" href=\"try/#view-pump\">open full screen<\/a><\/p><\/div>\n<p><strong>Where:<\/strong> on the island under the canopy, west of the door.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>Glass globe on top with the gasoline brand on it — SETTLED [you]. The brand name is a placeholder until you supply it<\/li>\n<li>Face window with rolling numbers: this sale, gallons, price per gallon — SETTLED [you] [Route 66]<\/li>\n<li>No clock dial — SETTLED [you]<\/li>\n<li>Grade plate: REGULAR on one, HI-TEST on the other — [Route 66], wording PROPOSED<\/li>\n<li><strong>Short, flat-topped steel cabinet on a dark base, after the yellow-and-orange pumps in your Route 66 photo<\/strong> — SETTLED [you: your pick, A1]. Two the same or one of each is not answered (question 2)<\/li>\n<li>Hose down the side, nozzle in a holder — [Route 66] [1934]<\/li>\n<li>Badges and small printed notices on the body — [1934]<\/li>\n<\/ul>\n<p><strong>Your picks on the pump<\/strong> (recorded here; the detail is the visual designer's, below)<\/p>\n<ul>\n<li>Drawn in dots, packed closer where it's darker — [you: B3]<\/li>\n<li>A scanned paper on each part, with real grey in the paper; the ink stays black — [you: E2]<\/li>\n<li>\"Does the light redraw it?\" — \"no\". Read as: the pump is drawn once and keeps its own shading at every hour; shadows and night are laid on top. <strong>This reading isn't confirmed<\/strong> (question 3)<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Paint faded and chalky, rust at the base and seams — [Abandoned]<\/li>\n<li>Number window dusty; one globe cracked — PROPOSED<\/li>\n<li>Hose perished and stiff — PROPOSED<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>Tap the handle: the numbers roll and stop. No fuel — [concept]<\/li>\n<li>Stand still nearby: the numbers tick over once — [concept]<\/li>\n<li>Metal ticks in the heat — [concept]<\/li>\n<li>The globe is lit at night: the power never went off — [you]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>(settled in your picks: the short pump, dots, drawn once, a paper on each part)<\/em><\/p>\n<ul>\n<li><em>Shape:<\/em> the short flat-topped pump after your Route 66 photo. Rounded in plan, a nearly flat top with a soft edge, a dark base, a disc globe on a short neck.<\/li>\n<li><em>Made of:<\/em> painted steel cabinet and base; glass globe face and number window; rubber hose; cast metal nozzle; enamel or decal lettering.<\/li>\n<li><em>Paper, one per part:<\/em> steel paper (smooth, faint streaks one way) under the cabinet, base, rim and nozzle; rubber paper (fine, crazed, much darker) under the hose. Each shows as real grey under the ink. Glass and lettering have no paper: they are flat paint. Stand-in papers for now; your scans replace them file for file.<\/li>\n<li><em>Kinds of mark:<\/em> a fine contour; then dots, packed closer for dark, round on the screen, each with a place on the pump that it keeps as you walk. Pits on the steel. Rust as packed dots rising from the base. Cracks across the hose. The print itself worn (ink dropping out in the paper's low places).<\/li>\n<li><em>Where tone turns:<\/em> across the cabinet's rounded corners, round the globe's rim, round the hose. Lightest on the side toward the upper left. This shading is the pump's own and is the same at every hour.<\/li>\n<li><em>Hose and nozzle:<\/em> the hose leaves the side high up through a small fitting, hangs in one long loop nearly to the island, and comes back up to the nozzle. The nozzle hangs by its hooked spout in a boot on the side: a grip, a thin trigger guard, a spout.<\/li>\n<li><em>Two pumps:<\/em> the same model twice, mirror images, both facing the road with their hoses toward each other, as in your Route 66 photo. <strong>Settled by you: same pump, worn separately.<\/strong> Each has its own wear: the west one (HI-TEST) is rustier, the rust has climbed higher, it is stained and its globe is cracked; the east one (REGULAR) is paler and more faded, with less rust. Their dots, rust patches, pits and the flecks out of their lettering all fall in different places. Not done yet: different dents, a different hang to each hose.<\/li>\n<li><em>Flat paint (hard, like lettering):<\/em> the globe's face with the brand, grade plate, number window and its digits, notice, knob, the two seam lines. All worn.<\/li>\n<li><em>What light does to it:<\/em> light works as it does in the real world, and it is all drawn in dots. The pump keeps its own loose dots at every hour. In the canopy's shade or in your shadow it is shaded, as it would be: a fine, even screen of small dots is laid over its own, lighter than the shade on the wall behind. So that it never sinks into that shade, the shade behind stops just short of the pump's outline and leaves a thin edge of bare paper round it, and its outline is heavier in shade. At night under the canopy lamp it is lit on the lamp's side; away from any light its own dots pack closer (or, in the reversed night, it is drawn in paper dots on black). The globe's face is lit all night. With no light on them, the plates and number window go dark with pale lettering.<\/li>\n<li><em>Its own ground:<\/em> its cast shadow, in the same fine screen of dots as all shade: heavier close to the pump's foot, lighter toward the far end, with an edge made of whole dots.<\/li>\n<li><em>Open:<\/em> lettering is set type until someone draws it. LLANO is a stand-in name; you are supplying the brands.<\/li>\n<\/ul>\n<hr />\n<h2>2. Slab and pump island<\/h2><div class=\"embed\" data-src=\"try/#view-slab\"><div class=\"frame\"><\/div><p class=\"embedbar\"><button type=\"button\">Tap to turn it and zoom<\/button><a class=\"u\" href=\"try/#view-slab\">open full screen<\/a><\/p><\/div>\n<p><strong>Where:<\/strong> the forecourt, from the road edge to the front wall, 16 m deep.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>Concrete forecourt — [1934] [Route 66]<\/li>\n<li>Raised island with a kerb — [1934] [Route 66] [Abandoned]<\/li>\n<li>Joints between the slabs — [1934]<\/li>\n<li>Bell line: a rubber hose across the forecourt that rings a bell inside — ACCEPTED<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Cracked and broken at the edges, giving way to dirt — [Abandoned]<\/li>\n<li>Scrub in the joints; sand drifted against the kerb and the wall — [Abandoned]<\/li>\n<li>Old stains<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>The bell line rings — [concept]<\/li>\n<li>Takes every shadow: the canopy's, the sign's, yours — [concept]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong><\/p>\n<ul>\n<li><em>Made of:<\/em> poured concrete, in slabs about 3 m by 4 m; a rubber hose (the bell line).<\/li>\n<li><em>Paper:<\/em> concrete paper (fine, pitted), a little greyer than the bare sheet, so the slab reads as a floor laid on the desert. The island has the same paper. The bell line has the rubber paper.<\/li>\n<li><em>Kinds of mark:<\/em> it has no shading of its own. Its drawing is what it is made of and what has happened to it: thin broken lines for the joints; straight, angular cracks, more of them toward the edges; pits; stains as patches of closer dots (heaviest where cars stood by the island); sand as a bare patch that covers joints and cracks, with a scatter of fine dots along its edge; a few flicked tufts of scrub on the joint lines.<\/li>\n<li><em>Edge:<\/em> ragged, drawn as a broken line, with dirt beyond it. The edge against the building is hidden by the wall.<\/li>\n<li><em>The island:<\/em> a raised block 14 cm high with a contour, and a line set in from its edge for the kerb stones. Drips and stains on top. Sand drifted against its foot.<\/li>\n<li><em>The bell line:<\/em> a thin dark hose that wanders across the forecourt south of the island and turns in to the wall beside the door.<\/li>\n<li><em>What light does to it:<\/em> everything, and in dots. Shade and shadows are a screen: small dots, all one size, evenly spaced (a kind of halftone), so they can't be mistaken for the slab's own pits and stains, which are loose and of every size. Each dot is whole or absent, so a shadow's edge is a clean line of dots. Shade is heavier close under what casts it. Your shadow is the closest screen on the lot, a figure with a head and shoulders. On the ground the dots lie flat, so further off they are ovals, as dots printed on a floor would be. At night the slab is lit where a real lamp reaches (the one canopy lamp), with your shadow and the pumps' in that light; where no light reaches it is a close dark screen, never blank (or, reversed, black with a thin scatter of paper dots).<\/li>\n<li><em>Open:<\/em> cracks, stains and sand are generated, not placed by hand. Up close the joints are plain rules. Sand against the wall is hard to see. Beyond about 15 m the screen on the ground thins to faint dashes: far shade needs another answer (solid shapes), which the road and desert will force. Every octave of distance the screen drops every other dot; on the ground that shows as a faint band. Not yet seen with the road beside it.<\/li>\n<\/ul>\n<hr />\n<h2>3. Canopy<\/h2><div class=\"embed\" data-src=\"try/#view-canopy\"><div class=\"frame\"><\/div><p class=\"embedbar\"><button type=\"button\">Tap to turn it and zoom<\/button><a class=\"u\" href=\"try/#view-canopy\">open full screen<\/a><\/p><\/div>\n<p><strong>Where:<\/strong> over the island, joined to the front of the building west of the door. The door is clear of it.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>A canopy over the pumps, joined to the building — SETTLED [you]<\/li>\n<li>Flat roof slab — [Abandoned] [1934]<\/li>\n<li>Fascia band round the edge, striped — [Abandoned] [1934]<\/li>\n<li>Two thin posts — [Abandoned]<\/li>\n<li>Lamps underneath — [1934]<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Stripes faded almost to nothing; fascia peeling — [Abandoned]<\/li>\n<li>Posts rusted; underside stained — PROPOSED<\/li>\n<li>One lamp working, the others dead or missing — PROPOSED<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>Day: the biggest shade on the lot — [concept]<\/li>\n<li>Night: one lamp lights it from below — [concept]<\/li>\n<li>After four minutes of standing still: that lamp goes out, a disc of light crosses the forecourt, the lamp comes back — [concept]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong><\/p>\n<ul>\n<li><em>Made of:<\/em> a flat slab with a plastered fascia 46 cm deep; two thin steel posts; three lamp fittings (a ceiling plate, a stem, an enamel shade, a bulb).<\/li>\n<li><em>Paper:<\/em> plaster paper under the fascia and the underside; steel paper under the posts and shades.<\/li>\n<li><em>Kinds of mark:<\/em> dots. The underside is in shade by nature, so its dark is the same even screen as all shade (it was loose dots, and read as a speckled ceiling); its stains stay loose dots on top. On the fascia, two stripes of which only broken bands of packed dots are left, and patches of close dots where paint has peeled. Posts: rust rising from the foot.<\/li>\n<li><em>Lamps:<\/em> west, dead (shade and stem, no bulb). Middle, the one that works. East, gone (a plate and a stub of flex). PROPOSED, as on the list.<\/li>\n<li><em>What light does to it:<\/em> by day it makes the biggest shade on the lot: a screen of dots on the slab, the island and the wall behind, heaviest on the wall right under it, with a clean edge. The pumps under it are shaded too and stand clear by a paper edge. At night the one working lamp is a real light: its bulb is paper-white, the forecourt, the wall and the pumps are lit from it and fall off into the dark, and things under it (you too) throw shadows away from it.<\/li>\n<li><em>Joined:<\/em> it runs into the front wall. The wall is element 4 and is not drawn yet; for now it is an outline that takes the canopy's shade.<\/li>\n<li><em>Open:<\/em> the posts in your abandoned-station photo are square and one has a painted band; ours are round and plain. The fascia has no lettering. Which lamp works is ours to choose until you say.<\/li>\n<\/ul>\n<hr />\n<h2>4. Station front<\/h2>\n<p><strong>Where:<\/strong> north side of the forecourt, facing the road, about 8 m deep. Left to right: garage door, canopy and pumps in front, window, door, window, bench.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>Stucco over brick — SETTLED [you]<\/li>\n<li>Plain one-storey box — [Abandoned] [Route 66] [Marfa]<\/li>\n<li>Door with a glass pane — [Route 66]<\/li>\n<li>Card in the door: BACK IN 5 MINUTES — [concept]<\/li>\n<li>Shop windows either side of the door, glass in — SETTLED [you]<\/li>\n<li><strong>Lettering on the window glass<\/strong> — SETTLED [you] [1934]. What it says is PROPOSED: TIRES · BATTERIES · OIL on one window, ICE · COLD DRINKS on the other. (Your 1934 photo has the proprietor's name on the glass. I've kept your name to the sign only.)<\/li>\n<li>Garage door of many small panes, shut — [Route 66]<\/li>\n<li>Two painted stripes along the front — [Route 66]<\/li>\n<li>A step at the door — [Marfa]<\/li>\n<li>One side window, boarded — SETTLED [you] [Abandoned]<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Stucco fallen in patches, brick showing — [Abandoned]<\/li>\n<li>Stripes and window lettering faded, letters part gone<\/li>\n<li>Front glass filthy and cracked; garage panes broken; garage door rusted shut — SETTLED [you]<\/li>\n<li>Card yellowed<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>Lean on the door for a second and it gives. At midday it's already off the latch — [concept]<\/li>\n<li>Night: the windows you lit are lit, seen from the road — [concept]<\/li>\n<li>Winter midday: the sign's shadow reaches the door — [concept]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>5. Sign<\/h2>\n<p><strong>Where:<\/strong> at the road, straight in front of the door, 16 m from it. About 12 m tall.<\/p>\n<p><strong>What you've said:<\/strong> a Googie arrow sign; your name on it and nothing else; \"neon and historically accurate\"; \"maybe some of the letters could flicker\"; \"I want the best amalgamation?\", with three photos; which arrow and whether a starburst, \"don't care\".<\/p>\n<p><strong>The sign, as one thing made from your three photos and the article.<\/strong> No drawing yet; this is the list to draw from.<\/p>\n<p><strong>The story it tells:<\/strong> a neon name put up in the late 1940s or early 50s, with a bulb arrow bolted on about ten years later, and a plastic board added last. That is the order the article gives: neon until the early 1950s, the bolt-on arrow from 1958, lit plastic after. Nobody has touched it since.<\/p>\n<p><strong>Your name<\/strong><\/p>\n<ul>\n<li>TRABOLD, one letter to a box, seven boxes stacked down one side of the pole — [Diver] (MOTEL is done exactly this way). ACCEPTED earlier as \"one letter to a box, stacked\"; your photo makes it neon, which settles the neon-or-plastic question: <strong>neon letters, in boxes<\/strong><\/li>\n<li>Each box is dark painted sheet metal, a little taller than wide, with a small gap between boxes — [Diver]<\/li>\n<li>Each letter is painted on the box face in a pale colour, block capitals, and a neon tube follows the painted shape — [Desert Hills] (MOTEL there is painted letters with the tube laid over them). So the name reads by day from the paint, with the tubes off<\/li>\n<li>The tube runs round each letter twice, an outer line and an inner line — [Diver]<\/li>\n<li>At night the tube lights the box face round it, so from a distance each letter is a glowing letter shape on a dark box, not a thin line — [Diver] (the glow is plain on the box faces in your photo)<\/li>\n<li>Nothing else is written on the sign — [you]<\/li>\n<\/ul>\n<p><strong>The arrow<\/strong><\/p>\n<ul>\n<li>A steel arrow filled with bulbs, in rows — [Palms] [Article]<\/li>\n<li>Bolted on later, to the other side of the pole from the name; it runs down beside the name and turns in at the bottom to a triangular head pointing at the door — [Article] (the 1961 hooked arrow). It takes the place the diver has in [Diver]. Designers' call, since you don't mind which<\/li>\n<li>The bulbs light a few at a time down the arrow and then all flash — PROPOSED. The article only says \"flashing\". Your [Diver] photo is a sign that moves in steps (the diver in three positions, lit in turn), which is the same idea<\/li>\n<\/ul>\n<p><strong>What holds it up<\/strong><\/p>\n<ul>\n<li>One steel pole, the boxes hung off it on short arms — [Diver]. ACCEPTED<\/li>\n<li>A low base of long thin stone round the foot of the pole — [Desert Hills]. PROPOSED for ours<\/li>\n<li>The slanted posts in [Desert Hills] are the most Googie thing in your three photos. Ours has one upright pole, as accepted. Left out so far<\/li>\n<\/ul>\n<p><strong>A plastic board under the name<\/strong> — PROPOSED, and it needs your yes<\/p>\n<ul>\n<li>A lit plastic panel with rails for stick-on letters, hung low on the pole — [Palms] [Desert Hills]. Both photos have one. It is the plastic in \"neon and plastic\"<\/li>\n<li><strong>Ours is blank.<\/strong> The letters have fallen off; a few rails hang loose. You said the sign carries your name and nothing else, and a blank board keeps that<\/li>\n<li>Why have it: it is lit, low down, at the road. So it is the one light near where you arrive at night, and light now works as it really would: the ground by the sign's foot is lit, and you'd have a shadow there. Later it is somewhere for words to go<\/li>\n<li>If you'd sooner not, strike it and nothing else changes<\/li>\n<\/ul>\n<p><strong>The starburst<\/strong> — dropped. None of your three photos has one, and you don't mind.<\/p>\n<p><strong>In all three of your photos, left out so far<\/strong><\/p>\n<ul>\n<li><strong>A neon picture.<\/strong> The diver, the palm trees, the cactus. Every one of your three signs has one; ours has none, because you said your name and nothing else, and because the obvious pictures for this place would be a joke. If you want one, it's yours to name<\/li>\n<li>Small neon words (Welcome, Enter, Free TV, Vacancy) — [Palms]. Left out: nothing else is written<\/li>\n<li>A script name — [Palms] [Desert Hills]. Ours is block capitals so it reads from across the road<\/li>\n<\/ul>\n<p><strong>Kept on purpose, though a real one differed:<\/strong> the sign faces you across the road. A real roadside sign faces up and down the road, for drivers. Ours has to be read from where you arrive.<\/p>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>The boxes' paint faded and chalky; rust running down from every bolt and down the pole — PROPOSED<\/li>\n<li>The painted letters faded but whole — PROPOSED<\/li>\n<li>On one or two letters, a stretch of tube is dead — [Palms] (the P of Palms has dark gaps in it). Only ever the inner line or the outer, never both, so the letter still reads<\/li>\n<li>About a third of the arrow's bulbs dead, in no pattern — PROPOSED<\/li>\n<li>The plastic board yellowed and cracked, lit unevenly — PROPOSED<\/li>\n<li>Wires from the nearest utility pole — [Desert Hills] [you]<\/li>\n<\/ul>\n<p><strong>Still works (left on)<\/strong><\/p>\n<ul>\n<li>All seven letters light, every night — [concept]<\/li>\n<li>The arrow runs — [concept]<\/li>\n<li>It buzzes — neon's own sound<\/li>\n<\/ul>\n<p><strong>The flicker rule<\/strong> (you: \"maybe some of the letters could flicker\")<\/p>\n<p>TRABOLD with letters out spells other things: lose the first three and it says BOLD; lose the B and it says TRA OLD. So:<\/p>\n<ul>\n<li>A letter may stutter. It is never dark for longer than a blink.<\/li>\n<li>One letter at a time.<\/li>\n<li>For the first few seconds after you arrive at night, all seven are steady. You read the name, then it starts.<\/li>\n<li>With motion turned off on the phone, no flicker.<\/li>\n<li>By day it doesn't matter: the letters are painted.<\/li>\n<\/ul>\n<p><strong>What the sign does<\/strong><\/p>\n<ul>\n<li><strong>Day:<\/strong> read from across the road, from the paint. Its shadow lies on the slab and moves through the day: seven blocks with gaps between, and the arrow's hook at the near end — [concept]<\/li>\n<li><strong>Dusk:<\/strong> the letters come on one at a time as the sky goes dark — [concept]<\/li>\n<li><strong>Night:<\/strong> lit, buzzing, the arrow running. Never yours to switch off — [concept]<\/li>\n<\/ul>\n<p><strong>Reading your name when you arrive at night<\/strong><\/p>\n<p>Night is now simply dark, with no light of your own. So when you arrive at night the sign is nearly all there is, and it has to do the whole job of telling you where you are and whose place it is.<\/p>\n<ul>\n<li>You stand 21 m from it. On a phone each letter is about 30 pixels tall from there. A real neon tube at that size would be thinner than one pixel. What reads is the glow on the box face, which is how it looks in [Diver], and the double line makes each letter's stroke wide.<\/li>\n<li>The name lights what it really would: the box faces, the pole, a little of the road at its foot. The arrow's bulbs are the strong light: when they flash they reach across the forecourt toward the door. Neither reaches you: where you arrive is dark, and there is nothing of you in the picture until you come to a light. (Every light is listed in <a href=\"#lights\"><code>lights.md<\/code><\/a>.)<\/li>\n<li><strong>This is the thing to test before anything else of the sign is promised:<\/strong> the name at night, from the arrival spot, at a phone's size, in dots. If it can't be read there, the letters get bigger before anything else changes.<\/li>\n<li>The stutter must never start until the name has been read once (the rule above).<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>6. Road<\/h2>\n<p><strong>Where:<\/strong> east–west, between where you arrive and the sign.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>Two-lane blacktop, painted edge line, gravel shoulder — [Marfa]<\/li>\n<li>Centre line — ACCEPTED<\/li>\n<li>Wire fence along the far side — [Marfa]<\/li>\n<li><strong>Utility poles and wires along the road<\/strong> — SETTLED [you] [Route 66] [Inn]. Which side, and whether a wire runs to the station, is PROPOSED: far side, one wire in to the building. It's where the power comes from<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Cracked, patched, lines worn thin, sand creeping in — PROPOSED<\/li>\n<li>Fence sagging; a pole leaning, a wire down — PROPOSED<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>You cross it to reach the place. Walk off along it and you arrive again — [concept]<\/li>\n<\/ul>\n<p><strong>For the build:<\/strong> poles repeat along the road, so they have to line up where the world wraps round.<\/p>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>7. Desert, horizon, sky<\/h2>\n<p><strong>Where:<\/strong> everywhere else. [you: \"set in the desert\"; \"nowhere in particular. Middle of the desert\"]<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>Flat dirt and gravel — [Abandoned] [Marfa] [Inn]<\/li>\n<li>Sparse low scrub near the lot — [Marfa] [Abandoned]<\/li>\n<li><strong>Boulders<\/strong> — SETTLED [you] [Inn]. A few, near the edge of the lot — placing PROPOSED<\/li>\n<li><strong>Mountains and brush in the distance<\/strong>, all the way round — SETTLED [you] [Marfa] [Inn]<\/li>\n<li><strong>Clouds<\/strong> — SETTLED [you] [Marfa] [Abandoned]. Few, low, by day; not moving, or barely — PROPOSED<\/li>\n<li>Stars at night, each a stroke with a tail — [concept]<\/li>\n<li>Sky going dark from the top at dusk — [concept]<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>The desert is coming in: scrub up to the slab and through its cracks — [Abandoned]<\/li>\n<\/ul>\n<p><strong>Not known<\/strong><\/p>\n<ul>\n<li>Whether clouds are there at night. They'd hide stars, and the stars are what standing still gives you. I'd keep the night clear.<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>8. Your shadow<\/h2>\n<p><strong>Where:<\/strong> on the ground, wherever a real light falls on you. You: \"Lighting should work as in the real world.\"<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>A plain head and shoulders, cut off by the bottom of the screen — [concept]<\/li>\n<li>No hat, no hood, nothing pointed — [you: \"liminal not funny\"]<\/li>\n<li>Drawn in dots, like all shade — [you]<\/li>\n<\/ul>\n<p><strong>Does<\/strong><\/p>\n<ul>\n<li>Moves as you move — [concept]<\/li>\n<li>In the sun: long early and late, almost nothing at noon, away from the sun — [concept]<\/li>\n<li>At night under a lit lamp (the canopy lamp, the lamp post, the light spilling from a lit window, the board on the sign if you keep it): away from the lamp, longer as you leave it, gone beyond its reach — [you]<\/li>\n<li>Indoors: in the sun that comes through the door and windows; and under any light you've switched on — [you]<\/li>\n<li>None in shade, at dusk, or in the dark — [you]<\/li>\n<li>It is the only mark of you there is. The light that followed where you looked is gone — [you]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>9. The station's own lights<\/h2>\n<p><strong>Where:<\/strong> on the sign, under the canopy, on the forecourt, and one inside.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>The lit letters of the name — [concept]<\/li>\n<li>The arrow's bulbs — [Article]<\/li>\n<li>One working canopy lamp — [1934] [concept]<\/li>\n<li><strong>A lamp post: a pole with an enamel dome shade<\/strong> — SETTLED [you] [Route 66]. Where it stands is PROPOSED: at the east end of the slab, in the open. (In your photo they stand by the pumps; ours have a canopy over them.) Whether it still lights is PROPOSED: yes, weakly<\/li>\n<li>A small light at the aisle mouth, on when you arrive — [concept]. Yours: you left it on<\/li>\n<li>A small lamp on the payphone at the far end of the aisle — [concept]<\/li>\n<li>The blank plastic board on the sign, if you keep it — PROPOSED (element 5)<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>The power never went off — SETTLED [you]. Fewer lights than there were, weaker, some bulbs gone<\/li>\n<\/ul>\n<p><strong>Does<\/strong><\/p>\n<ul>\n<li>On from dusk to dawn, whatever you do. Each has a hum, a buzz or a click — [concept]<\/li>\n<li>Each lights what it really would and nothing more, and casts a shadow from anything standing near it, you included — [you]<\/li>\n<li>With your own lamp gone these, and whatever you switch on, are the only light at night. The walk down the aisle is from the light at its mouth to the lamp on the payphone<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>10. ~~Your lamp~~ — struck<\/h2>\n<p>You: \"I don't like the light thing at night… The light that follows where I look.\" It is gone, and nothing follows your view. What it used to do, and what does each of those things now, is listed in <a href=\"#how\"><code>concepts/05-left-on.md<\/code><\/a> (\"What the lamp did, and what does it now\"). The number is kept so the others don't move.<\/p>\n<hr />\n<h2>11. Small things on the lot<\/h2>\n<p><strong>Where:<\/strong> around the forecourt. None is needed to get in.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thing<\/th>\n<th>Where<\/th>\n<th>Status<\/th>\n<th>Abandoned means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Thing\">Oil can rack<\/td>\n<td data-label=\"Where\">By the island<\/td>\n<td data-label=\"Status\">[1934]<\/td>\n<td data-label=\"Abandoned means\">Rusted, a few cans left (placeholder names)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Ice box (chest cooler)<\/td>\n<td data-label=\"Where\">By the front wall; today only chalked out<\/td>\n<td data-label=\"Status\">[1934]<\/td>\n<td data-label=\"Abandoned means\">Lid rusted, brand faded<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Oil drum<\/td>\n<td data-label=\"Where\">By the island<\/td>\n<td data-label=\"Status\">[1934]<\/td>\n<td data-label=\"Abandoned means\">Rusted, dented<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Tyre on the ground<\/td>\n<td data-label=\"Where\">By the wall<\/td>\n<td data-label=\"Status\">[Abandoned]<\/td>\n<td data-label=\"Abandoned means\">Belongs<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Air hose on its own post<\/td>\n<td data-label=\"Where\">Edge of the canopy<\/td>\n<td data-label=\"Status\">ACCEPTED<\/td>\n<td data-label=\"Abandoned means\">Perished<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Bench<\/td>\n<td data-label=\"Where\">Under the east window<\/td>\n<td data-label=\"Status\">ACCEPTED<\/td>\n<td data-label=\"Abandoned means\">Weathered, a slat missing<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Phone box, standing alone<\/td>\n<td data-label=\"Where\">Off the slab to the east<\/td>\n<td data-label=\"Status\">ACCEPTED<\/td>\n<td data-label=\"Abandoned means\">Glass gone<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>12. Marks on the ground<\/h2>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>A dashed outline and one word in your handwriting, where something is planned and not made yet — [concept]<\/li>\n<li>Three dashed circles east of the slab, in a different hand, never explained — [concept; alien]<\/li>\n<li>A disc of light on the ground that isn't yours — [concept; alien]<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Your outlines are your plans for a place you're living in and making over. The circles are in another hand, and fresher than anything else on the lot.<\/li>\n<\/ul>\n<p><strong>Left out on purpose:<\/strong> the saucer [Inn] and the saucer shapes [Chart]. Evidence only, never the craft.<\/p>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>Inside<\/h2>\n<p>You said \"not yet\" to a picture for the inside, and none of yours shows one. So everything below stays <strong>PROPOSED as a whole<\/strong>, apart from what the concept needs. It's last in the build order.<\/p>\n<h2>13. The door, and the front room<\/h2>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>The doorway as a patch of daylight on the floor, with your shadow in it — [concept]<\/li>\n<li>A pull cord just inside the door, and a tube light over the counter — [concept]<\/li>\n<li>A big knife switch by the door that puts out everything you turned on — [concept]<\/li>\n<li>A counter across the back — [concept]<\/li>\n<li>The front windows, with the lot in them, and the lettering seen backwards from inside — [concept] [you]<\/li>\n<li>Floor, walls, ceiling of a small shop — PROPOSED<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Dust, sand blown in under the door, a ceiling panel down — PROPOSED<\/li>\n<li>Sun through filthy glass: dim, streaked patches<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>The cord, the tube, the switch — [concept]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>14. Things on the counter and walls<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thing<\/th>\n<th>What it does<\/th>\n<th>Source<\/th>\n<th>Now<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Thing\">Cash register (placeholder name)<\/td>\n<td data-label=\"What it does\">Lights its little window; the drawer<\/td>\n<td data-label=\"Source\">[concept]<\/td>\n<td data-label=\"Now\">Dusty<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Counter bell<\/td>\n<td data-label=\"What it does\">The one thing that puts a word in the picture: DING<\/td>\n<td data-label=\"Source\">[concept]; the word after your HONK picture<\/td>\n<td data-label=\"Now\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Cup, still warm<\/td>\n<td data-label=\"What it does\">The steam stops when you've stood still<\/td>\n<td data-label=\"Source\">[concept]<\/td>\n<td data-label=\"Now\">SETTLED [you]: it stays. Yours<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Camp stove beside the cup<\/td>\n<td data-label=\"What it does\">Nothing<\/td>\n<td data-label=\"Source\">PROPOSED, from \"it would probably be me squatting\"<\/td>\n<td data-label=\"Now\">Yours<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Brushes and a bottle of ink; a notebook<\/td>\n<td data-label=\"What it does\">Nothing<\/td>\n<td data-label=\"Source\">PROPOSED, same<\/td>\n<td data-label=\"Now\">Yours. The only hint of what you do<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Radio<\/td>\n<td data-label=\"What it does\">Its dial lights; static, a station that won't come in<\/td>\n<td data-label=\"Source\">[concept]<\/td>\n<td data-label=\"Now\">Works<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Jacket on a hook<\/td>\n<td data-label=\"What it does\">Nothing<\/td>\n<td data-label=\"Source\">[concept]<\/td>\n<td data-label=\"Now\">Stays. Yours<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Wall clock<\/td>\n<td data-label=\"What it does\">Turn it and the sun moves<\/td>\n<td data-label=\"Source\">[concept]<\/td>\n<td data-label=\"Now\">Running<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Sightings chart, pinned under the clock<\/td>\n<td data-label=\"What it does\">Fills in as you see odd things<\/td>\n<td data-label=\"Source\">[Chart]<\/td>\n<td data-label=\"Now\">Kept in your hand<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Thing\">Cooler (placeholder name)<\/td>\n<td data-label=\"What it does\">Lights the floor when open; a compressor<\/td>\n<td data-label=\"Source\">[concept]; chest cooler in [1934]<\/td>\n<td data-label=\"Now\">Running, nearly empty<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Employee of the month<\/h3>\n<p>You: \"I want an employee of the month on the wall in a frame and it should be a portrait of art bell with the name \"art\" on the frame name plaque.\"<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>A frame on the wall — [you]<\/li>\n<li>The heading EMPLOYEE OF THE MONTH — [you]<\/li>\n<li>A portrait of Art Bell in it — [you]. Drawn fresh in the place's own hand, in dots like everything else; not traced from a photograph<\/li>\n<li>A small name plaque on the frame that reads Art — [you]. Capitals or not, engraved brass or a typed card: PROPOSED engraved brass, ART<\/li>\n<li>Where: on the wall behind the counter, beside the wall clock and the chart, at eye height — PROPOSED<\/li>\n<li>The heading printed on a card inside the frame, above the portrait — PROPOSED<\/li>\n<li>No month, no year, no surname, nothing else written on it — PROPOSED<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Glass dusty, the card yellowed, the frame hanging a little off level — PROPOSED<\/li>\n<\/ul>\n<p><strong>Light<\/strong><\/p>\n<ul>\n<li>It has no light of its own. It hangs where the counter tube reaches, so it is dark until you pull the first cord, and then it is one of the first things you see — PROPOSED (<a href=\"#lights\"><code>lights.md<\/code><\/a>)<\/li>\n<\/ul>\n<p><strong>How it sits with the room.<\/strong> Art Bell hosted Coast to Coast AM, late-night radio from the Nevada desert, with callers on UFOs and the unexplained. So it belongs with the radio on the counter that won't quite find a station, and with the chart of sightings beside it. And the only person at this station is you, squatting: an employee of the month in a place with no staff. Nothing else is built on it; the radio does not play him.<\/p>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>15. The aisle<\/h2>\n<p><strong>Where:<\/strong> through an opening beside the counter. 28 m long, behind a building 8 m deep.<\/p>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>One straight aisle of shelves, fourteen bays — [concept]<\/li>\n<li>Cans and boxes on the first shelves, realistic labels, invented brands — SETTLED [you]<\/li>\n<li>Bare shelves further back — [concept]<\/li>\n<li>A pull cord and tube light every third bay — [concept]<\/li>\n<li>A payphone at the far end with its own small lamp — [concept]<\/li>\n<li>The back door beside it — [concept]<\/li>\n<li>A bedroll near the far end, made, and an instrument case beside it — PROPOSED, from \"it would probably be me squatting\". Yours<\/li>\n<\/ul>\n<p><strong>Abandoned means<\/strong><\/p>\n<ul>\n<li>Stock thin, dusty, some fallen.<\/li>\n<\/ul>\n<p><strong>Still works<\/strong><\/p>\n<ul>\n<li>The lights. The payphone rings after two minutes of standing still, and stops as you reach it — [concept]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>16. Round the back<\/h2>\n<p><strong>Parts<\/strong><\/p>\n<ul>\n<li>The plain back wall, stucco gone in places — [concept] [Abandoned]<\/li>\n<li>The back of the sign over the roof, your name reversed — [concept]<\/li>\n<li>Tyres, a drum, junk — [Abandoned] [1934]<\/li>\n<\/ul>\n<p><strong>Drawing needs (visual designer):<\/strong> <em>empty<\/em><\/p>\n<hr />\n<h2>Questions only you can answer<\/h2>\n<p><strong>1. What would you really have with you, living there?<\/strong> We've guessed: a cup, a camp stove, a jacket, brushes and a bottle of ink, a notebook, a bedroll, an instrument case. Strike what's wrong and add what's missing. And say if \"you're out, not hiding — the card on the door is yours\" is the right idea.<\/p>\n<p><strong>2. The two pumps: both the same, or one of each?<\/strong> You picked the short flat-topped one. One says REGULAR and the other HI-TEST; should they otherwise be twins?<\/p>\n<p><strong>3. \"Does the light redraw it?\" — you said no; then: \"Lighting should work as in the real world.\"<\/strong> Read together as: a thing's own marks, its paint and wear, are drawn once and stay; the shade and shadows on it are real and move with the light. Say if that's wrong.<\/p>\n<p><strong>4. On the sign (element 5):<\/strong> the blank plastic board under your name, yes or no; and whether you want a neon picture, as all three of your photos have.<\/p>\n<p><strong>Waiting on you, not questions:<\/strong> the brand names when you're ready. (The sign photos came.)<\/p>", "jump": ["Settled so far", "It's you squatting — a proposal for you to check", "Brand names: placeholders", "The order to build in, and why", "1. Pump (two of them)", "2. Slab and pump island", "3. Canopy", "4. Station front", "5. Sign", "6. Road", "7. Desert, horizon, sky", "8. Your shadow", "9. The station's own lights", "10. ~~Your lamp~~ — struck", "11. Small things on the lot", "12. Marks on the ground", "Inside", "13. The door, and the front room", "14. Things on the counter and walls", "15. The aisle", "16. Round the back", "Questions only you can answer"]}, "lights": {"title": "Lights — every real light in the place", "tab": "", "route": "#lights", "html": "<h1>Lights — every real light in the place<\/h1>\n<p>Your words: \"Lighting should work as in the real world\", and \"The lighting thing means we need to establish proper scene lights.\"<\/p>\n<p>This is the list of them, made the way the element list was. <strong>Against any line say <em>wrong<\/em>, <em>missing<\/em> or <em>strike<\/em>.<\/strong><\/p>\n<p><strong>The rule.<\/strong> These are all the lights there are. Each lights what it really would. A thing, or you, throws a shadow from it if it's the kind of light that makes one. Where none of them reaches, it is dark. Nothing follows where you look.<\/p>\n<p><strong>Tags:<\/strong> [you] your words · a photo by name, as in <a href=\"#elements\"><code>elements.md<\/code><\/a> · [el. 5] an element on that list · [concept] Left on needs it · [director] the design director's list in <code>concepts/steer-5.md<\/code> · PROPOSED we made it up.<\/p>\n<p><strong>Where things are.<\/strong> Measured in metres from the foot of the sign: <em>east<\/em> (right, as you arrive), <em>north<\/em> (toward the station), <em>up<\/em>. You arrive 21 m south of the sign, facing north. The station's front wall is 16 m north; the building runs from 13 m west to 7 m east and is 8 m deep and 3.8 m high. The door is straight north of the sign.<\/p>\n<h2>The sky<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Light<\/th>\n<th>Where<\/th>\n<th>What kind<\/th>\n<th>Reach<\/th>\n<th>Shadows<\/th>\n<th>On<\/th>\n<th>Your shadow<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Light\"><strong>The sun<\/strong> — [you] [concept]<\/td>\n<td data-label=\"Where\">Rises in the east (your right as you arrive), crosses the <strong>south<\/strong> sky (behind you as you arrive), sets in the west (your left). A desert at about 35° north: at midday it stands 78° up in midsummer, 55° in spring and autumn, 31° in midwinter<\/td>\n<td data-label=\"What kind\">One hard light from very far off<\/td>\n<td data-label=\"Reach\">Everything outdoors; indoors only through the door and the front windows<\/td>\n<td data-label=\"Shadows\">Yes: hard, the same direction everywhere<\/td>\n<td data-label=\"On\">By your own clock (below)<\/td>\n<td data-label=\"Your shadow\">Away from the sun. On arrival at midday it lies ahead of you, toward the station. 0.4 m long at midsummer noon, 1.2 m in spring, 2.8 m at midwinter noon; many metres early and late<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>The sky's own light<\/strong> — PROPOSED (it is what makes shade shade, not black)<\/td>\n<td data-label=\"Where\">All round, from above<\/td>\n<td data-label=\"What kind\">Soft, from everywhere<\/td>\n<td data-label=\"Reach\">Everything outdoors; a little way in at the door and windows<\/td>\n<td data-label=\"Shadows\">None<\/td>\n<td data-label=\"On\">Whenever the sun is up, and through twilight<\/td>\n<td data-label=\"Your shadow\">None from it. In the canopy's shade you have no shadow<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Twilight<\/strong> — [concept]<\/td>\n<td data-label=\"Where\">The sky after sunset and before sunrise, about half an hour each<\/td>\n<td data-label=\"What kind\">The sky alone, fading<\/td>\n<td data-label=\"Reach\">Outdoors<\/td>\n<td data-label=\"Shadows\">None, anywhere<\/td>\n<td data-label=\"On\">Half an hour at each end of the day<\/td>\n<td data-label=\"Your shadow\">None<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>The moon<\/strong> — [you: \"Yes there's a moon and it's always epic… should be exaggerated\"]<\/td>\n<td data-label=\"Where\">Up all night, every night: rises in the east (your right as you arrive) as the sun sets, stands high in the <strong>south<\/strong> at midnight (behind you as you arrive), sets in the west at dawn. That is a full moon's real path — PROPOSED<\/td>\n<td data-label=\"What kind\">One light from very far off, like a weak sun<\/td>\n<td data-label=\"Reach\">Everything outdoors that isn't in something's shadow; indoors through the door and the front windows<\/td>\n<td data-label=\"Shadows\">Yes: the building, the sign, the canopy and the poles all throw them, long at dusk and dawn, short at midnight<\/td>\n<td data-label=\"On\">Every night, dusk to dawn<\/td>\n<td data-label=\"Your shadow\">Out in the open at night: yes, away from the moon, fainter than by day. At midnight it lies ahead of you as you arrive, toward the station<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>The stars<\/strong> — [concept]<\/td>\n<td data-label=\"Where\">Overhead at night, turning round a still point in the north, above the station<\/td>\n<td data-label=\"What kind\">Points. They light nothing<\/td>\n<td data-label=\"Reach\">Nothing<\/td>\n<td data-label=\"Shadows\">None<\/td>\n<td data-label=\"On\">At night; you see them once you've stood still ten seconds or so<\/td>\n<td data-label=\"Your shadow\">None<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>The clock.<\/strong> The hour is the hour on your own clock and the date is your date — [concept]. No time zones: your noon is the sun due south. Sunrise and sunset, roughly: 5 am and 7 pm at midsummer, 6 and 6 in spring and autumn, 7 am and 5 pm at midwinter — PROPOSED (a plain 35° north; you said \"nowhere in particular\"). The wall clock indoors turns it by hand — [concept].<\/p>\n<h3>The moon, worked out<\/h3>\n<p>You: \"Yes there's a moon and it's always epic (though it could also be cool to match real moon cycle... either way should be exaggerated)\".<\/p>\n<p><strong>What its light does<\/strong><\/p>\n<ul>\n<li>The desert at night is there: dim, but you can see the ground, the scrub, the hills. Night is still much darker than day; the moon makes it a dark you can walk in.<\/li>\n<li>The station's front faces south, so the moon lights it for most of the night. Behind the building, under the canopy and in the sign's shadow it is fully dark.<\/li>\n<li>You have a faint shadow anywhere in the open. In the moon's shade you have none. Under the canopy lamp or the lamp post, the lamp's shadow is the one you see.<\/li>\n<li>Indoors it comes through the door and the front windows as faint patches on the floor, the way the sun does by day. Around midnight the first pull cord hangs in the moon's patch.<\/li>\n<li>The stars are fewer near it.<\/li>\n<\/ul>\n<p><strong>\"Exaggerated\", as rules<\/strong> — PROPOSED<\/p>\n<ul>\n<li><strong>Size:<\/strong> about fifteen times its real width in the sky. On a phone that is roughly a quarter of the screen's width. (The real moon would be six pixels.)<\/li>\n<li><strong>Brightness:<\/strong> enough to see the ground by and throw a shadow you can make out. A real full moon does both, barely; ours does both plainly.<\/li>\n<li><strong>Always up at night.<\/strong> It never sets before dawn and there is never a night without it.<\/li>\n<li><strong>Where it is when you arrive:<\/strong> behind you or to your right, never over the station. You see its light on the station first, and your own shadow; you turn round and it's there. Hanging it over the station would put it in the first picture, and would break \"as in the real world\": a moon is never in the north there. Your call; we'd keep it real.<\/li>\n<\/ul>\n<p><strong>Its shape: three ways<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>What you get<\/th>\n<th>What it costs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>A. Always full<\/strong><\/td>\n<td data-label=\"What you get\">The same epic moon every night. Its path above is exactly a full moon's, so everything is real<\/td>\n<td data-label=\"What it costs\">Nothing changes from one night to the next<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>B. The real phase, always up<\/strong> — our lean<\/td>\n<td data-label=\"What you get\">Tonight's real shape: full when the real moon is full, a crescent when it is. Never thinner than a clear crescent; its light is weaker when it's thin, never gone. Something different each time you come back, and a real full moon becomes a night worth coming for<\/td>\n<td data-label=\"What it costs\">A crescent that is up all night isn't real (real crescents set early). Few would know. Needs the date, nothing more<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>C. The real phase and the real rising and setting<\/strong><\/td>\n<td data-label=\"What you get\">Fully true to the sky<\/td>\n<td data-label=\"What it costs\">Some nights it isn't up when you visit, and at new moon there's none. Against \"always epic\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What it looks like is the visual designer's:<\/strong> how a huge moon is drawn in dots, and how moonlit ground differs from unlit ground.<\/p>\n<h2>The station's own lights<\/h2>\n<p>On from dusk to dawn whatever you do. None is yours to switch off. The power never went off — [you].<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Light<\/th>\n<th>Where (east, north, up)<\/th>\n<th>What kind<\/th>\n<th>Reach<\/th>\n<th>Shadows<\/th>\n<th>State<\/th>\n<th>Your shadow<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Light\"><strong>Your name in neon<\/strong> — [el. 5] [Diver] [Desert Hills]<\/td>\n<td data-label=\"Where (east, north, up)\">On the sign: seven boxes down the west side of the pole, from about 4 m to 11.5 m up<\/td>\n<td data-label=\"What kind\">A glow. Neon lights the face of its own box and little else<\/td>\n<td data-label=\"Reach\">The boxes, the pole; a faint wash on the ground within about 4 m of the foot<\/td>\n<td data-label=\"Shadows\">None worth drawing<\/td>\n<td data-label=\"State\">On. One letter at a time may stutter, never in your first few seconds — [you]<\/td>\n<td data-label=\"Your shadow\">None<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>The arrow's bulbs<\/strong> — [el. 5] [Palms] [Article]<\/td>\n<td data-label=\"Where (east, north, up)\">On the sign: down the east side of the pole, turning in at about 3 m up to point at the door<\/td>\n<td data-label=\"What kind\">Many bare bulbs. Together a strong light, coming and going<\/td>\n<td data-label=\"Reach\">The road at the sign's foot and the forecourt, reaching the front wall 16 m off weakly. Through the door glass, a faint patch on the floor inside — PROPOSED<\/td>\n<td data-label=\"Shadows\">Yes, in pulses: long, thrown away from the sign, so toward the door<\/td>\n<td data-label=\"State\">On. Runs down the arrow and flashes; about a third of the bulbs are dead — PROPOSED<\/td>\n<td data-label=\"Your shadow\">Between the sign and the door at night: a long faint one, toward the door, each time the arrow flashes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>The blank board on the sign<\/strong> — PROPOSED, needs your yes [el. 5] [Palms] [Desert Hills]<\/td>\n<td data-label=\"Where (east, north, up)\">On the pole, 2 to 3 m up<\/td>\n<td data-label=\"What kind\">A lit plastic panel: a soft spread<\/td>\n<td data-label=\"Reach\">About 5 m round the foot of the sign, road included<\/td>\n<td data-label=\"Shadows\">Soft<\/td>\n<td data-label=\"State\">On, uneven<\/td>\n<td data-label=\"Your shadow\">A soft one near the sign<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Canopy lamp, middle<\/strong> — [el. 3] [1934] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">Under the canopy at 7 m west, 12 m north, 3.4 m up. (The canopy covers 11.6 to 2.2 m west, 8.4 m north back to the wall, 3.9 m up)<\/td>\n<td data-label=\"What kind\">A bulb under an enamel shade: a spread downward<\/td>\n<td data-label=\"Reach\">The slab under the canopy, both pumps, the island; spills about 2 m beyond the canopy's edge. Strongest light on the lot<\/td>\n<td data-label=\"Shadows\">Yes: hard. The pumps and posts throw shadows outward from it<\/td>\n<td data-label=\"State\">On. The west lamp is dead and the east one missing — PROPOSED. After four minutes of standing still it goes out and comes back — [concept]<\/td>\n<td data-label=\"Your shadow\">Yes, clear: short under it, longer toward the edge, away from the lamp<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Pump globes<\/strong> — [director]; the globes themselves [Route 66] [you]<\/td>\n<td data-label=\"Where (east, north, up)\">On top of each pump: 8.2 and 5.4 m west, 11.5 m north, about 1.6 m up<\/td>\n<td data-label=\"What kind\">A glow<\/td>\n<td data-label=\"Reach\">Themselves only<\/td>\n<td data-label=\"Shadows\">None<\/td>\n<td data-label=\"State\">West one lit, east one dead — PROPOSED (you: the same pump \"worn naturally separately\")<\/td>\n<td data-label=\"Your shadow\">None<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Lamp post<\/strong> — [el. 9] [Route 66] [you]<\/td>\n<td data-label=\"Where (east, north, up)\">East end of the slab: about 9 m east, 10 m north, 4 m up — PROPOSED placing<\/td>\n<td data-label=\"What kind\">A weak bulb under an enamel dome: a spread downward<\/td>\n<td data-label=\"Reach\">A pool about 4 m across round its foot<\/td>\n<td data-label=\"Shadows\">Yes, weak<\/td>\n<td data-label=\"State\">On, weakly — PROPOSED<\/td>\n<td data-label=\"Your shadow\">A faint one inside its pool<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Light at the aisle mouth<\/strong> — [el. 9] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">Indoors, over the opening in the back wall: about 5.5 m east, 24 m north, 2.2 m up<\/td>\n<td data-label=\"What kind\">A small bare bulb<\/td>\n<td data-label=\"Reach\">The opening and about 2 m of floor each side<\/td>\n<td data-label=\"Shadows\">Yes, small<\/td>\n<td data-label=\"State\">On when you arrive. It's yours: you left it on<\/td>\n<td data-label=\"Your shadow\">Yes, as you pass under it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Payphone lamp<\/strong> — [el. 15] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">Far end of the aisle: about 5.5 m east, 51.5 m north, 1.8 m up<\/td>\n<td data-label=\"What kind\">A small shaded lamp<\/td>\n<td data-label=\"Reach\">The phone, the back door beside it, about 1.5 m of floor<\/td>\n<td data-label=\"Shadows\">Barely<\/td>\n<td data-label=\"State\">On. It is the thing you walk the dark aisle toward<\/td>\n<td data-label=\"Your shadow\">A faint one at the very end<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\">Wall lamps; a lamp over the door<\/td>\n<td data-label=\"Where (east, north, up)\">—<\/td>\n<td data-label=\"What kind\">—<\/td>\n<td data-label=\"Reach\">—<\/td>\n<td data-label=\"Shadows\">—<\/td>\n<td data-label=\"State\"><strong>None<\/strong> — PROPOSED. Nothing of yours shows one<\/td>\n<td data-label=\"Your shadow\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\">Phone box, east of the slab<\/td>\n<td data-label=\"Where (east, north, up)\">12 m east, 6 m north<\/td>\n<td data-label=\"What kind\">—<\/td>\n<td data-label=\"Reach\">—<\/td>\n<td data-label=\"Shadows\">—<\/td>\n<td data-label=\"State\"><strong>Dark<\/strong> — PROPOSED (the glass is gone; so is its light)<\/td>\n<td data-label=\"Your shadow\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Lights you switch on<\/h2>\n<p>Off the first time you come. Each stays as you leave it, and is still on next visit — [concept]. You did not object to this when the lamp went.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Light<\/th>\n<th>Where (east, north, up)<\/th>\n<th>What kind<\/th>\n<th>Reach<\/th>\n<th>Shadows<\/th>\n<th>Your shadow<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Light\"><strong>Counter tube<\/strong> (the cord by the door) — [el. 13] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">Cord just inside the door, about 0.6 m east, 17 m north. Tube over the counter, about 0 m east, 21 m north, 2.6 m up<\/td>\n<td data-label=\"What kind\">A fluorescent tube: a long soft spread<\/td>\n<td data-label=\"Reach\">The counter top and what's on it, the wall behind, the floor back to the door, weakly. Not the corners<\/td>\n<td data-label=\"Shadows\">Soft<\/td>\n<td data-label=\"Your shadow\">Yes, soft, on the floor behind you as you face the counter<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><em>Lit by the counter tube, no light of its own:<\/em> the framed Employee of the Month — [you]; placing PROPOSED<\/td>\n<td data-label=\"Where (east, north, up)\">On the wall behind the counter, at eye height<\/td>\n<td data-label=\"What kind\">—<\/td>\n<td data-label=\"Reach\">—<\/td>\n<td data-label=\"Shadows\">Its glass may catch the tube as a glare; visual's<\/td>\n<td data-label=\"Your shadow\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Aisle tubes<\/strong>, one cord every third bay — [el. 15] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">Down the aisle (4.6 to 6.4 m east), at about 27, 33, 39 and 45 m north, 2.4 m up<\/td>\n<td data-label=\"What kind\">A tube each<\/td>\n<td data-label=\"Reach\">Three bays, 6 m, each<\/td>\n<td data-label=\"Shadows\">Soft; the shelves throw them<\/td>\n<td data-label=\"Your shadow\">Yes, under each one you've lit<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Cooler<\/strong> — [el. 14] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">West wall of the front room, about 4.3 m west, 18.6 m north<\/td>\n<td data-label=\"What kind\">A small lamp under the lid<\/td>\n<td data-label=\"Reach\">The floor in front of it, about 1.5 m<\/td>\n<td data-label=\"Shadows\">Barely<\/td>\n<td data-label=\"Your shadow\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Radio dial<\/strong> — [el. 14] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">On the counter<\/td>\n<td data-label=\"What kind\">A glow<\/td>\n<td data-label=\"Reach\">The dial, and what's beside it on the counter<\/td>\n<td data-label=\"Shadows\">None<\/td>\n<td data-label=\"Your shadow\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Register window<\/strong> — [el. 14] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">On the counter<\/td>\n<td data-label=\"What kind\">A glow<\/td>\n<td data-label=\"Reach\">Itself<\/td>\n<td data-label=\"Shadows\">None<\/td>\n<td data-label=\"Your shadow\">No<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>Payphone<\/strong> — [el. 15] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">As above<\/td>\n<td data-label=\"What kind\">Its lamp is already on; using it lights nothing more<\/td>\n<td data-label=\"Reach\">—<\/td>\n<td data-label=\"Shadows\">—<\/td>\n<td data-label=\"Your shadow\">—<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Light\"><strong>The main switch<\/strong> — [el. 13] [concept]<\/td>\n<td data-label=\"Where (east, north, up)\">On the wall by the door, beside the cord<\/td>\n<td data-label=\"What kind\">Not a light. One pull puts out every light in this table, one at a time<\/td>\n<td data-label=\"Reach\">—<\/td>\n<td data-label=\"Shadows\">—<\/td>\n<td data-label=\"Your shadow\">—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Light that gets from one place into another<\/h2>\n<p>Not lamps; what real light does with a door and a window.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>From<\/th>\n<th>Into<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>Sun through the door and front windows<\/strong> — [el. 13] [concept]<\/td>\n<td data-label=\"From\">The sun<\/td>\n<td data-label=\"Into\">The front room<\/td>\n<td data-label=\"What it is\">Patches on the floor. Deep into the room in winter and early or late; barely over the sill at midsummer noon. Dim and streaked: the glass is filthy. Your shadow stands in the door's patch<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Lit windows, seen from outside<\/strong> — [concept]<\/td>\n<td data-label=\"From\">The counter tube, or anything else on inside<\/td>\n<td data-label=\"Into\">The forecourt<\/td>\n<td data-label=\"What it is\">The windows and the door glass show lit from the road. Their light falls 3 or 4 m onto the slab in front of them. Crossing it at night you throw a shadow away from the building<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Daylight down the aisle<\/strong> — [el. 15]<\/td>\n<td data-label=\"From\">The front window<\/td>\n<td data-label=\"Into\">The aisle<\/td>\n<td data-label=\"What it is\">None reaches it. The aisle is in line with the front window, so from its far end the window is a small bright shape a long way off, and lights nothing<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>The states<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What is lit<\/th>\n<th>Where you have a shadow<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\"><strong>Day<\/strong><\/td>\n<td data-label=\"What is lit\">Everything outdoors, by the sun and sky. Indoors: sun patches, the aisle-mouth light, the payphone lamp, and whatever you've switched on. The neon and the bulbs are off or can't be seen<\/td>\n<td data-label=\"Where you have a shadow\">Outdoors wherever you're in sun; not in shade. Indoors in the sun patches and under lights you've switched on<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Dusk and dawn<\/strong><\/td>\n<td data-label=\"What is lit\">The sky only, fading. The name comes on a letter at a time, then the arrow, then the lamps (at dawn they go out in turn)<\/td>\n<td data-label=\"Where you have a shadow\">Nowhere outdoors until the lamps are on and the sky has gone<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Night, as the station keeps it<\/strong><\/td>\n<td data-label=\"What is lit\">The moon over all of it, dimly. Then the name, the arrow, the middle canopy lamp, one pump globe, the lamp post; indoors the aisle-mouth light, the payphone lamp, and faint moon patches at the door and windows. The moon's shade and the insides are dark, and drawn dark<\/t
