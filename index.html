 data-label=\"State\">First visit; after the main<\/td>\n<td data-label=\"How it looks\">Inside: black, the doorway on the floor, one small pool at the aisle mouth<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Return visit; everything on<\/td>\n<td data-label=\"How it looks\">The room mostly paper, the things drawn in it; from the road a row of lit windows<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Under the canopy by day<\/td>\n<td data-label=\"How it looks\">Open shade, things drawn, no lamp<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Dusk<\/td>\n<td data-label=\"How it looks\">Outdoors you leave no mark: no shadow, no lamp<\/td>\n<td data-label=\"\">Built (one still)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You never go in; you never stand still<\/td>\n<td data-label=\"How it looks\">Nothing is missing from any frame<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Sound off or blocked<\/td>\n<td data-label=\"How it looks\">Beside each light that is on, one short stroke that redraws itself about once a second. A heard-first event leaves a small loose cluster of dots.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Motion off<\/td>\n<td data-label=\"How it looks\">Cuts. A light arrives whole.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Keyboard<\/td>\n<td data-label=\"How it looks\">The disc is the focus ring. By day outdoors the focused thing takes a heavier line for as long as it has focus.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Phone<\/td>\n<td data-label=\"How it looks\">These frames. The owner has walked the round-2 version on his: \"pretty good and fluid\".<\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">A slow phone<\/td>\n<td data-label=\"How it looks\">The drawing gets coarser, a step at a time, until it moves smoothly. The strokes get softer; nothing else changes.<\/td>\n<td data-label=\"\">Built; the steps are untested on a real slow phone<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Desktop<\/td>\n<td data-label=\"How it looks\">The same world through a longer lens. <code>lo-wide-day<\/code><\/td>\n<td data-label=\"\">Built<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">No 3D, screen reader<\/td>\n<td data-label=\"How it looks\">The list of places, typewritten on paper, the arrival still at the top.<\/td>\n<td data-label=\"\">Words<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Motion and feel<\/h2>\n<ul>\n<li>The view moves at the screen's full rate. The ink does not move by itself except when a light changes.<\/li>\n<li>On the way in from the road the building's marks go from few and large to many and fine. That is the only thing in the drawing that changes because you moved, and it is slow.<\/li>\n<li>Anything that happens (a light arriving, the disc closing, a word landing, a star) happens in three or four held steps, like drawn animation.<\/li>\n<li>Nothing eases. A stroke is there or it isn't.<\/li>\n<\/ul>\n<h2>The prototype as handed to the owner<\/h2>\n<ul>\n<li><code>#day<\/code>, <code>#dusk<\/code> or <code>#night<\/code> after the address picks the hour; changing it reloads. With none, the visitor's own clock picks one of the three (7 to 5:15 day; an hour of dusk at each end; otherwise night). Query strings still work for the stills.<\/li>\n<li>The caption is gone from the picture. At the bottom, small and grey: <strong>day · dusk · night<\/strong>, and \"drag to look · hold to walk\", which goes once you have walked.<\/li>\n<li>If frames take longer than about 30 ms the drawing's resolution drops by a quarter, and again if needed, down to under half. It never goes back up in a visit.<\/li>\n<li>Still true of it: crude boxes, generated strokes, no sound, nothing answers a tap, no door stroke, system-font lettering.<\/li>\n<\/ul>\n<h2>The director's nine fixes<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fix<\/th>\n<th>Status<\/th>\n<th>Frame<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Fix\">1 Remove the GAS blade<\/td>\n<td data-label=\"Status\">Done<\/td>\n<td data-label=\"Frame\"><code>lo-arrive-day<\/code>, <code>lo-sign-side<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">2 Put the desert in<\/td>\n<td data-label=\"Status\">Done: horizon, scrub, drifts, fence. No cactus (above)<\/td>\n<td data-label=\"Frame\"><code>lo-arrive-day<\/code>, <code>lo-desert-east<\/code>, <code>lo-anywhere-day<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">3 Brush in the day arrival<\/td>\n<td data-label=\"Status\">Done as proposed (a larger stroke size from far off), measured, <strong>not seen in motion<\/strong><\/td>\n<td data-label=\"Frame\"><code>lo-arrive-day<\/code>, <code>lo-walk-3s<\/code>, <code>lo-walk-6s<\/code>, <code>walk-test.png<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">4 Never a black screen at night<\/td>\n<td data-label=\"Status\">Done: a pool at your feet, which never fully closes<\/td>\n<td data-label=\"Frame\"><code>lo-night-away<\/code>, <code>lo-night-still<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">5 The shadow: head and shoulders, no ears<\/td>\n<td data-label=\"Status\">Done: laid by its own rule, clean outline<\/td>\n<td data-label=\"Frame\"><code>lo-door-in<\/code>, <code>lo-strokes-day<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">6 Twilight, one frame<\/td>\n<td data-label=\"Status\">Done<\/td>\n<td data-label=\"Frame\"><code>lo-arrive-dusk<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">7 Update the how-it-works half<\/td>\n<td data-label=\"Status\">The systems designer's; not mine<\/td>\n<td data-label=\"Frame\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">8 The look back down the aisle<\/td>\n<td data-label=\"Status\">Solved for the dark aisle; said plainly that lit stretches take the picture<\/td>\n<td data-label=\"Frame\"><code>lo-aisle-back<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">9 Safe to hand him<\/td>\n<td data-label=\"Status\">Done: resolution fallback, caption off the picture, hour by <code>#name<\/code><\/td>\n<td data-label=\"Frame\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">The owner's own: hard to make out objects<\/td>\n<td data-label=\"Status\">Done, one clear step<\/td>\n<td data-label=\"Frame\">the five pairs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>The five small fixes after the score<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fix<\/th>\n<th>What I did<\/th>\n<th>Frame<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Fix\">1 A brush's weight on the edge line, and fewer<\/td>\n<td data-label=\"What I did\">The line swells and thins along its length, heavier in shade; outlines and square corners only<\/td>\n<td data-label=\"Frame\"><code>lo-front-b<\/code>, <code>lo-pumps-b<\/code>, <code>lo-walk-6s<\/code>, <code>lo-arrive-dusk<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">2 The ladder on the sign pole at dusk<\/td>\n<td data-label=\"What I did\">It was the pole's own strokes lying across it like rungs. Posts now wear their strokes up and down<\/td>\n<td data-label=\"Frame\"><code>lo-arrive-dusk<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">3 Can't walk into the sign<\/td>\n<td data-label=\"What I did\">The pole, the canopy posts, the pumps, the air post, the phone box and the bench are solid. Checked live: walking straight at the pole stops 0.62 m from it, and after a turn the frame is 7% ink<\/td>\n<td data-label=\"Frame\"><code>lo-sign-foot-live<\/code> (the live frame), <code>lo-sign-foot<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">4 The tuft at your feet indoors<\/td>\n<td data-label=\"What I did\">Your shadow now shows only where the sun would otherwise reach<\/td>\n<td data-label=\"Frame\"><code>lo-room-b<\/code>, <code>lo-aisle<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Fix\">5 Standing still at night is never black<\/td>\n<td data-label=\"What I did\">The pool draws in to a small one ahead of you and stays<\/td>\n<td data-label=\"Frame\"><code>lo-night-still<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Still true at dusk: the pumps are small dark boxes in fine hatching and the place is carried mostly by line. It is the plainest hour, on purpose.<\/p>\n<h2>Where I disagree, or went further<\/h2>\n<ul>\n<li><strong>The edgeless wall.<\/strong> The director ruled to keep \"a sunlit wall against the sky has no edge\". After the owner's walk I broke it within 35 m. Above.<\/li>\n<li><strong>No cactus,<\/strong> though the fix allowed one.<\/li>\n<li><strong>Fix 5 asked for the shadow to be \"less ragged than the rest\".<\/strong> I went further and took it out of the brush altogether: its outline is exact. It is the one mark in the place that is precise, and it is you. I think that is right; it is also a second rule, and he may prefer it brushed.<\/li>\n<li><strong>With no hash, the prototype follows the visitor's clock.<\/strong> Nobody asked for it. It is what the concept says (\"the hour is your real hour\"), and the owner opening the link at night will get night. The day preset is one fixed morning, not his real sun; the real sun is still words.<\/li>\n<\/ul>\n<h2>The stills<\/h2>\n<p>All in <code>concepts/stills/<\/code>. <code>sheet-05-left-on.png<\/code> is the one sheet, two frames across, for a phone. Tall frames are 390 × 844 unless named <code>-small<\/code> (360 × 740); <code>lo-wide-day<\/code> is 1440 × 810; all at double density, straight from the prototype at the positions in <code>sketches/place/shots.js<\/code>. Saved in sixteen greys to keep the folder small, so the paper looks neutral; in the prototype it is a warm off-white.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Still<\/th>\n<th>Proves<\/th>\n<th>Does not prove<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Still\"><code>lo-arrive-day<\/code>, <code>-small<\/code>, <code>lo-arrive-night<\/code>, <code>-small<\/code><\/td>\n<td data-label=\"Proves\">The live first frame: whole name, no GAS, a desert, brush from the road<\/td>\n<td data-label=\"Does not prove\">That he reads the day building as finished<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-arrive-dusk<\/code><\/td>\n<td data-label=\"Proves\">What dusk looks like, once<\/td>\n<td data-label=\"Does not prove\">The sequence; dawn<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-walk-3s<\/code>, <code>lo-walk-6s<\/code><\/td>\n<td data-label=\"Proves\">What the first six seconds of walking show<\/td>\n<td data-label=\"Does not prove\">How the change of stroke size feels in motion<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-desert-east<\/code>, <code>lo-anywhere-day<\/code><\/td>\n<td data-label=\"Proves\">A desert with nothing in it is now a picture<\/td>\n<td data-label=\"Does not prove\">The world's edge from either side<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\">The five <code>-a<\/code> / <code>-b<\/code> pairs<\/td>\n<td data-label=\"Proves\">Things can be made out where they couldn't<\/td>\n<td data-label=\"Does not prove\">That it is enough for him<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-strokes-day<\/code>, <code>lo-strokes-night<\/code>, <code>walk-test.png<\/code><\/td>\n<td data-label=\"Proves\">Strokes in the walked world that stay on it<\/td>\n<td data-label=\"Does not prove\">His hand<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-door-in<\/code>, <code>lo-night-away<\/code>, <code>lo-night-still<\/code>, <code>lo-night-lamp<\/code><\/td>\n<td data-label=\"Proves\">The shadow is a person; the dark is never blank, moving or stopped<\/td>\n<td data-label=\"Does not prove\">The lamp closing in steps<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-sign-foot-live<\/code>, <code>lo-sign-foot<\/code><\/td>\n<td data-label=\"Proves\">You can't walk into the sign<\/td>\n<td data-label=\"Does not prove\">Every other solid thing; I checked the pole<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>pairs-05.png<\/code><\/td>\n<td data-label=\"Proves\">The five before/after pairs on one page<\/td>\n<td data-label=\"Does not prove\"><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>lo-aisle<\/code>, <code>lo-aisle-back<\/code>, <code>lo-sign-side<\/code>, <code>lo-anywhere-night<\/code>, <code>lo-wide-day<\/code><\/td>\n<td data-label=\"Proves\">As named<\/td>\n<td data-label=\"Does not prove\">A desktop composition anyone designed; the sign against his references<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Still\"><code>cross-2d.png<\/code><\/td>\n<td data-label=\"Proves\">Round 1's 2D door stroke and landed word<\/td>\n<td data-label=\"Does not prove\">That either works in the walked world<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Not proven<\/h2>\n<ul>\n<li>The new look on his phone: the lines, the tones, the larger far strokes in motion, the frame rate with them. The round-2 version was \"fluid\"; this one does a little more work per pixel (four more depth reads near things, one more sheet read).<\/li>\n<li>That \"slightly more detail\" has been met and not overshot.<\/li>\n<li>The world's edge with the desert in, by picture.<\/li>\n<li>The resolution fallback on a real slow phone.<\/li>\n<li>Dusk as a sequence; dawn; the real sun for the real hour.<\/li>\n<li>Lights arriving in strokes; the lamp closing in steps; the door stroke and DING in the walked world; sound.<\/li>\n<li>His own strokes on the sheet.<\/li>\n<li>The sign against his saved article and photo pool.<\/li>\n<\/ul>", "jump": ["Where it comes from", "The rule for light", "The rule", "Who isn't here (proposal, for the owner to check)", "Your mark", "What you can do", "The place, by how light gets to it", "The lights", "Asking for someone", "Standing still", "The hour", "The alien material", "The moments", "Every state", "Sound, here", "Adam makes it into something", "Jobs", "Choices for the owner, inside the one concept", "Not proven", "What the lamp did, and what does it now", "Checked against \"as in the real world\"", "Where this goes against the concept as written", "What the owner said after walking it, and what I did", "The first three seconds by day", "The stroke method (unchanged since round 2, restated briefly)", "The rules of the drawing", "The place, state by state", "Motion and feel", "The prototype as handed to the owner", "The director's nine fixes", "The five small fixes after the score", "Where I disagree, or went further", "The stills", "Not proven"]}, "controls": {"title": "Controls — how you move and look", "tab": "moving and looking", "route": "#how-controls", "html": "<h1>Controls — how you move and look<\/h1>\n<p><em>Systems. Written from <code>owner.md<\/code> sections 24, 27, 28 and 30. This is the spec to change the prototype from. A working copy of every rule below, on crude boxes, is <code>sketches/controls-test/index.html<\/code> (serve <code>sketches/<\/code>, open <code>controls-test/<\/code>); take the code from it. It replaces \"drag to look, hold to walk\".<\/em><\/p>\n<p>His words:<\/p>\n<blockquote>\n<p>\"I dislike press and hold. It should do pinch to zoom in and out and swiping should rotate camera\"\n\"Pinch out zooms in pinch in backs up like photos\"\n\"It would be cool for phone gyro to move me around camera wise\"\n\"Also two finger swipe should track left and right\"<\/p>\n<\/blockquote>\n<h2>The whole of it<\/h2>\n<p><strong>The rule: the picture follows your fingers. You drag the world, as you drag a photo.<\/strong> Wherever your fingers go, the thing under them goes too. Confirmed on his iPhone (Safari): \"Left and right are still backwards… as is the tracking but otherwise is great\", said of the version where left–right and tracking went against the finger.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Your fingers<\/th>\n<th>The picture<\/th>\n<th>So you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Your fingers\">One finger to the right<\/td>\n<td data-label=\"The picture\">moves right<\/td>\n<td data-label=\"So you\">turn left<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Your fingers\">One finger down<\/td>\n<td data-label=\"The picture\">moves down<\/td>\n<td data-label=\"So you\">look up<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Your fingers\">Two fingers together to the right<\/td>\n<td data-label=\"The picture\">moves right<\/td>\n<td data-label=\"So you\">step to the left, facing the same way<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Your fingers\">Two fingers apart<\/td>\n<td data-label=\"The picture\">grows from between them<\/td>\n<td data-label=\"So you\">go toward what is between them<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Your fingers\">Two fingers closing<\/td>\n<td data-label=\"The picture\">shrinks toward between them<\/td>\n<td data-label=\"So you\">back away from it<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>One finger turns you. Two fingers move you: parting or closing, in and out; sideways together, sideways. A tap goes there, or uses the thing. Holding a finger down does nothing.<\/strong><\/p>\n<ul>\n<li><strong>Swipe:<\/strong> the picture follows your finger, both ways. You turn; you never move.<\/li>\n<li><strong>Pinch:<\/strong> you move along a straight line toward whatever was between your fingers when they landed, or back away from it. You never turn.<\/li>\n<li><strong>Two-finger swipe:<\/strong> two fingers moved sideways together slide you sideways. You never turn.<\/li>\n<li><strong>Tap:<\/strong> a thing you're standing at answers. Anything further off, you're taken there.<\/li>\n<li><strong>Tilt (phones):<\/strong> turning the phone turns the view by the same angle.<\/li>\n<\/ul>\n<p>There is no walking speed on a touch screen any more. You are moved as far as your fingers say, while they say it.<\/p>\n<h2>The curve: faster goes further<\/h2>\n<p>His words, with the directions confirmed (\"Yes controls feel great now\"): \"Tracking feels a little slow and I feel like all moves could have curves, like, if I [swipe] faster it should shift more in space.\"<\/p>\n<p>Then, of the first set of numbers: \"Slightly slightly slightly too intense pull back a LITTLE.\" Eased by about a fifth; the shape is unchanged.<\/p>\n<p><strong>THE CURVE'S NUMBERS — all of them, in this one block. Build from these.<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Now<\/th>\n<th>Before (<code>#curve=before<\/code>)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Finger speed below which nothing is added<\/td>\n<td data-label=\"Now\">300 px a second<\/td>\n<td data-label=\"Before (#curve=before)\">300<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Finger speed at which the most is added<\/td>\n<td data-label=\"Now\">1,500 px a second<\/td>\n<td data-label=\"Before (#curve=before)\">1,500<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">The most a move is multiplied by<\/td>\n<td data-label=\"Now\"><strong>×1.8<\/strong><\/td>\n<td data-label=\"Before (#curve=before)\">×2<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">In between<\/td>\n<td data-label=\"Now\">a straight line<\/td>\n<td data-label=\"Before (#curve=before)\">the same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Finger speed is measured over<\/td>\n<td data-label=\"Now\">the last 80 ms of travel<\/td>\n<td data-label=\"Before (#curve=before)\">the same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Carry-on after a flick: its speed halves every<\/td>\n<td data-label=\"Now\"><strong>0.10 s<\/strong><\/td>\n<td data-label=\"Before (#curve=before)\">0.12 s<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Carry-on may add, to a turn<\/td>\n<td data-label=\"Now\">at most <strong>50°<\/strong><\/td>\n<td data-label=\"Before (#curve=before)\">60°<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Carry-on may add, to a track<\/td>\n<td data-label=\"Now\">at most <strong>80 px'<\/strong> worth<\/td>\n<td data-label=\"Before (#curve=before)\">100 px<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Carry-on may add, to a pinch<\/td>\n<td data-label=\"Now\">at most <strong>×1.33<\/strong><\/td>\n<td data-label=\"Before (#curve=before)\">×1.4<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Tracking, before the curve<\/td>\n<td data-label=\"Now\">×1.5 of exact following<\/td>\n<td data-label=\"Before (#curve=before)\">the same<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>One curve, the same for turning, tracking and the pinch:<\/p>\n<ul>\n<li><strong>Slowly, the picture follows your fingers exactly.<\/strong> Below the lower speed nothing is added. This is where you are being careful, and it stays precise.<\/li>\n<li><strong>Faster, the same travel carries further,<\/strong> up to the top figure and no higher. A quick swipe is about 1,000 to 1,500 px a second.<\/li>\n<li>The fingers' speed is measured over a short window, not from one touch event to the next (phones deliver them in uneven bursts).<\/li>\n<li>For a pinch the curve is applied to the <em>ratio<\/em>: parting the fingers quickly counts as parting them further.<\/li>\n<li><strong>Lift while still moving and the move carries on and settles.<\/strong> Fingers that stop before lifting leave you exactly where you are.<\/li>\n<li><strong>Limits.<\/strong> The carry-on is the same move continuing, so it stops where the move would: 0.9 m short of a thing, at a wall, and <strong>at a doorway. A flick can't carry you through the door<\/strong>; the second beat still has to be made. Any touch stops it.<\/li>\n<li><strong>Motion turned off: no curve and no carry-on.<\/strong><\/li>\n<li>To compare on the test page: <code>#curve=before<\/code> (the stronger first set), <code>#curve=off<\/code> (no curve, tracking at ×1, only the turn carries on).<\/li>\n<\/ul>\n<p>Measured (touch events timed inside the page, phone-sized window, from the arrival spot; the fast figures wobble by a few percent from run to run with the timing):<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>The same finger travel<\/th>\n<th>Slow, fingers stop<\/th>\n<th>Fast, fingers stop<\/th>\n<th>Fast, flicked<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"The same finger travel\">One finger, 200 px<\/td>\n<td data-label=\"Slow, fingers stop\">43.7°<\/td>\n<td data-label=\"Fast, fingers stop\">65.9° (was 76.7°)<\/td>\n<td data-label=\"Fast, flicked\">121.5° (was 137.6°)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"The same finger travel\">Two fingers together, 150 px (the station 37 m off)<\/td>\n<td data-label=\"Slow, fingers stop\">12.2 m<\/td>\n<td data-label=\"Fast, fingers stop\">15.1 m (was 17.1 m)<\/td>\n<td data-label=\"Fast, flicked\">24.4 m (was 26.3 m)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"The same finger travel\">Fingers parting 120 → 240 px (the door 37 m off)<\/td>\n<td data-label=\"Slow, fingers stop\">12.3 m<\/td>\n<td data-label=\"Fast, fingers stop\">13.6 m (was 14.0 m)<\/td>\n<td data-label=\"Fast, flicked\">16.3 m (was 17.0 m)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A fast flicked pinch at the door from 6 m still stops at the door.<\/p>\n<h2>Pinch<\/h2>\n<p>What it is: <strong>moving you, not narrowing the view.<\/strong> The thing between your fingers grows as your fingers part, the way a photo does, because you are getting closer to it. The lens never changes.<\/p>\n<p><strong>The anchor.<\/strong> When the second finger lands, take the point halfway between the two fingers and find what is under it:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Under the point<\/th>\n<th>Anchor distance <code>d<\/code><\/th>\n<th>You stop<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Under the point\">A thing, a wall, a door<\/td>\n<td data-label=\"Anchor distance d\">Level distance from you to that point on it<\/td>\n<td data-label=\"You stop\">0.9 m short of it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Under the point\">The ground, within 100 m<\/td>\n<td data-label=\"Anchor distance d\">Level distance to that spot<\/td>\n<td data-label=\"You stop\">Nowhere: you can stand on it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Under the point\">Sky, horizon, or ground further than 100 m<\/td>\n<td data-label=\"Anchor distance d\">40 m, straight out in that direction<\/td>\n<td data-label=\"You stop\">Nowhere<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The line you move on is the level line from where you stood to the anchor. It is fixed for the whole pinch. The anchor does not change if the fingers drift.<\/p>\n<p><strong>How far.<\/strong> <code>s<\/code> = finger spread now ÷ finger spread when the pinch began. <code>D<\/code> = <code>d<\/code> held between 3 m and 40 m.<\/p>\n<ul>\n<li>Pinch out (<code>s<\/code> &gt; 1): forward by <code>D × (1 − 1/s^1.5)<\/code>.<\/li>\n<li>Pinch in (<code>s<\/code> &lt; 1): back by <code>D × (1/s − 1)<\/code>, never more than 30 m.<\/li>\n<li>Live under the fingers. Part them and close them again at the same pace and you are back where you were.<\/li>\n<\/ul>\n<p>In hand: an easy pinch out (fingers 120 px apart to 330 px) covers about three quarters of the way to the thing. A small one covers a third. Far things come fast and the last metre is slow, as zooming a photo is. Pinching in on a thing 5 m away puts it about 14 m away.<\/p>\n<p><strong>Feel.<\/strong><\/p>\n<ul>\n<li>Nothing happens until the spread has changed by 4%; then it counts from there, with no jump.<\/li>\n<li>If the fingers land less than 60 px apart, treat the start as 60 px.<\/li>\n<li>The view follows the fingers with a very short lag (it closes two thirds of the gap every 60 ms). Faster goes further, and a pinch let go while moving carries on a little (the curve, above). Fingers that stop, stop you.<\/li>\n<li>The view does not turn or tilt during a pinch. The phone's tilt is ignored for as long as two fingers are down.<\/li>\n<li>When one of the two fingers lifts, the other does nothing until it lifts too.<\/li>\n<\/ul>\n<p><strong>What stops you.<\/strong><\/p>\n<ul>\n<li>The thing you pinched on, 0.9 m short. Keep spreading and the view leans in up to 25 cm more and comes back when you let go. That is the end of it, like a photo at full size.<\/li>\n<li>Anything else in the way going forward: you slide round it as walking does now; if you can't, you stop.<\/li>\n<li>Anything behind you going back: you stop dead. No sliding backward.<\/li>\n<li>A doorway on the line: you stop at it, 0.9 m short, whatever you pinched on. See the door.<\/li>\n<\/ul>\n<p><strong>Chained.<\/strong> Each new pinch takes a new anchor from wherever the fingers land. Measured on the test page, with easy pinches: road to the door, 3 pinches and one more to go in. A pump from 15 m, 2. The 28 m aisle, 3. Out into the desert, over the edge and back to the station, 8.<\/p>\n<p><strong>Rejected<\/strong><\/p>\n<ul>\n<li><strong>Narrowing the view<\/strong> (a true zoom, standing still). It is the literal photo, and you could never get through the door.<\/li>\n<li><strong>A mix<\/strong> (move, and narrow a little). Two things changing at once; the dots are sized to the screen, so the drawing would re-dot every pinch.<\/li>\n<li><strong>Moving along the centre of the view.<\/strong> A photo zooms on your fingers, not on its middle. You would have to turn to face a thing before every pinch.<\/li>\n<li><strong>A fixed distance per pinch.<\/strong> Six pinches to the door and forty to walk off and back.<\/li>\n<li><strong>Stepping between set spots.<\/strong> He said \"walk around\".<\/li>\n<li><strong>Two fingers also turning.<\/strong> Nearly every pinch is lopsided (a still thumb, a moving finger), so the midpoint moves and you'd turn by accident. (Two fingers moving sideways <em>together<\/em> now slide you sideways; that is told apart from a pinch at the start of the gesture and never mixed with one. See the two-finger swipe.)<\/li>\n<li><strong>Tilting to keep the thing under your fingers.<\/strong> Pinch on the ground and you would arrive staring at your feet.<\/li>\n<\/ul>\n<h2>Two-finger swipe: tracking sideways<\/h2>\n<p>His words: \"two finger swipe should track left and right\". Tracking in the camera's sense: you slide sideways and keep facing the way you were.<\/p>\n<ul>\n<li><strong>Two fingers to the right → the picture moves right with them, so you step to the left.<\/strong> (His first try had it the other way: \"backwards\".)<\/li>\n<li><strong>How far:<\/strong> half as far again as it takes to keep the thing between your fingers between them. He tried exact following and said \"Tracking feels a little slow\"; ×1.5 is the smallest step up that is plainly felt while the picture still stays near the fingers. That works out as: a slow drag the full width of a phone slides you about 0.9 × <code>D<\/code>, where <code>D<\/code> is the distance to what was between the fingers, held between 3 m and 40 m as for a pinch. Beside a pump, a full drag is about 3 m; out on the road, about 30 m. Faster goes further (the curve, above).<\/li>\n<li><strong>Telling it from a pinch.<\/strong> Two fingers do one thing per gesture, and it is settled once, in the first 12 px: compare how far the middle of the two fingers has moved sideways with how much the gap between them has changed. <strong>Gap changed more: pinch. Middle moved more: track.<\/strong> A lopsided pinch (a still thumb, a moving finger) moves its middle only half as far as its gap changes, so it stays a pinch. After that the other measure is ignored until the fingers lift. Not both at once, as on a map: a 3D place can't keep both fingers on their spots, and a pinch that also slid you would undo the reason two fingers never turn.<\/li>\n<li><strong>What stops you:<\/strong> walls and things, as walking sideways would. You stop; you don't slide round. Tracking never takes you through a doorway.<\/li>\n<li><strong>Two fingers moved up or down together: nothing.<\/strong> He asked for left and right only, and up and down already has a meaning for two fingers when they part.<\/li>\n<li>It counts as moving, so it ends standing still.<\/li>\n<li><strong>Motion turned off:<\/strong> one cut of 0.3 × <code>D<\/code> to that side per gesture, once the fingers have gone 40 px.<\/li>\n<\/ul>\n<h2>Swipe<\/h2>\n<ul>\n<li>One finger. Starts after 10 px of travel; counts from there.<\/li>\n<li><strong>The picture follows the finger.<\/strong><\/li>\n<li><strong>Drag your finger to the right → the thing you touched moves right with it; the view turns to the left.<\/strong><\/li>\n<li><strong>Drag your finger down → the thing you touched moves down with it; the view tilts up.<\/strong><\/li>\n<li><strong>How we got here, so nobody flips it again.<\/strong> Version 1 of the test page did this and he said \"Swiping is backwards\"; later: \"I think I answered wrong earlier\". Version 2 (finger right turns right, finger up looks up) and version 3 (finger right turns right, finger down looks up) were each tried on his iPhone; of version 3 he said left–right was \"still backwards\" and the rest \"great\". So: follow the finger, both axes. <strong>The station prototype's left–right is the wrong way round by this rule<\/strong> and has to change when the controls go in there.<\/li>\n<li>Switches on the test page, to compare. Each makes the picture go against the fingers for one gesture: <code>leftright=against<\/code>, <code>updown=against<\/code>, <code>track=against<\/code>.<\/li>\n<li><strong>A swipe the full width of the screen turns you a quarter turn (90°). A swipe the full height tilts you 60°.<\/strong><\/li>\n<li>Tilt limits: 75° up (the top of the sign from its foot), 60° down (your feet). No limit round.<\/li>\n<li><strong>Let go while moving and the turn carries on briefly:<\/strong> it starts at the finger's speed and dies away quickly, within a set limit (the curve's block, above). Any touch stops it. Faster swipes turn further (the curve, above).<\/li>\n<li><strong>The view stays where you leave it.<\/strong> It does not level itself. (This removes \"stop, and the view levels\"; see contradictions.)<\/li>\n<\/ul>\n<h2>Tap<\/h2>\n<ul>\n<li>A tap is one finger down and up within half a second, having moved less than 10 px. A finger held longer, then lifted, is nothing.<\/li>\n<li><strong>On a thing within 2.5 m:<\/strong> use it.<\/li>\n<li><strong>On a thing further off, up to 40 m:<\/strong> you're taken to 0.9 m short of it, along the straight line, sliding round what's in the way. (In the real build: to its standing spot, turned to face it.)<\/li>\n<li><strong>On the ground within 40 m:<\/strong> you're taken to that spot.<\/li>\n<li><strong>On the sky, or anything past 40 m:<\/strong> nothing.<\/li>\n<li>The move takes distance ÷ 10 seconds, never under 0.3 s or over 2.5 s, starting and ending gently. Any touch stops it where you are.<\/li>\n<li>Tapping is the one-handed way to move. Pinch needs two fingers; nobody should need two hands.<\/li>\n<\/ul>\n<h2>The door<\/h2>\n<p>\"Keep walking into it for a second\" had a hold behind it. Now:<\/p>\n<ol>\n<li><strong>Anything that would carry you through a doorway stops at it,<\/strong> 0.9 m short: a pinch, a tap, a key held down. You are at the door.<\/li>\n<li><strong>The next thing you do toward it takes you through:<\/strong> a new pinch out (as soon as it passes ×1.15), a tap on the door, Enter, or the forward key held for half a second.<\/li>\n<li>The stroke crosses the screen (about a third of a second), and you are put 1.5 m inside, facing as you were. Going out is the same.<\/li>\n<\/ol>\n<ul>\n<li>One pinch never goes through. A pinch that stopped at the door has to be let go first. (So a trackpad's coasting scroll can't blow through it either.)<\/li>\n<li><strong>At midday the door is off the latch:<\/strong> rule 1 is skipped and a pinch or a tap carries straight through, stroke and all.<\/li>\n<li>Pinching in never takes you backward through a doorway. You stop with your back to it.<\/li>\n<li>The opening into the aisle has no door and no stop.<\/li>\n<li>Each crossing adds one step to the browser's history. Back, and Escape, put you 1.5 m outside the last door you came through, facing out.<\/li>\n<\/ul>\n<h2>Tilt: the phone turns the view<\/h2>\n<ul>\n<li>Turn the phone left or right and the view turns by the same angle. Tip its top toward or away from you and the view tilts by the same angle. Rolling it does nothing; the horizon stays level.<\/li>\n<li><strong>Tilt is not dragging a picture; it is looking through a window,<\/strong> so it keeps a window's sense: turn the phone to the right and you look right; tip its top back and you look up. A finger drags the world; the phone points at it. They are different acts and both feel right by themselves; they add, and don't fight.<\/li>\n<li><strong>Keys are a third thing:<\/strong> they move you the way the key points.<\/li>\n<li><strong>It is added to the swipe; neither wins.<\/strong> There is one direction you face, and both push it. It is relative: wherever the phone points when tilt starts is where you were already looking. So a swipe is how you re-centre: turn the view with a finger and the phone's \"ahead\" has moved with it. Nothing to reset.<\/li>\n<li><strong>Slack:<\/strong> the view ignores the phone until it has turned 0.75° from where the view last followed it, then follows exactly. A hand's tremor does nothing; a slow drift in the sensor does nothing you'd see.<\/li>\n<li>Same limits as the swipe. At a limit, tipping further does nothing, and tipping back answers at once.<\/li>\n<li>Ignored while two fingers are down, and re-based when they lift, so a pinch can't jerk the view.<\/li>\n<li><strong>Lying down, on a train, walking round a room:<\/strong> it still works, because nothing is measured against north or level. Your steps don't move you; only turning counts. If the phone points nearly straight up or down (within 10°) tilt waits until it doesn't.<\/li>\n<\/ul>\n<p><strong>Asking.<\/strong> An iPhone will not give a page the motion sensor until the visitor taps and says yes.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Device<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Device\">iPhone<\/td>\n<td data-label=\"What happens\">The word <strong>tilt<\/strong> sits in the margin beside the other two words. Tapping it is the ask (the phone's own dialog). Yes: it is on, underlined. No: the word goes and does not come back this visit. Nothing is asked on arrival; the place comes first<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Device\">Android phone<\/td>\n<td data-label=\"What happens\">On from the first frame, if the sensor answers within a second. <strong>tilt<\/strong> sits in the margin, underlined, and a tap turns it off<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Device\">No sensor, or a desktop<\/td>\n<td data-label=\"What happens\">No word. Nothing is missing<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Device\">Motion turned off on the device<\/td>\n<td data-label=\"What happens\">Off to begin with, on any phone. The word is there if they want it<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>On or off is remembered. The margin now holds four things: sound, the hour, the list of places, tilt (phones only).<\/p>\n<h2>Standing still<\/h2>\n<p>The place acts when you've stopped, so \"stopped\" has to be exact, and a hand is never still.<\/p>\n<ul>\n<li><strong>Still = you are not being moved and you have not used anything.<\/strong> Moved means a pinch, a tap that takes you somewhere, a walking key, a wheel.<\/li>\n<li><strong>Turning never counts,<\/strong> by finger or by phone. So tremor, the slack, a glance round: none of it matters to the clock. This was already the rule (\"turning to look does not restart it\"); tilt makes it necessary.<\/li>\n<li>The clock starts the moment the move ends. There is no levelling to wait for.<\/li>\n<li>A pinch that goes nowhere (you're at the wall) still counts as moving. So does a tap on a thing.<\/li>\n<li>\"Nothing moves while you're looking straight at it\" is worked from where the view points, however it got there.<\/li>\n<\/ul>\n<h2>Every other way in<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Turn<\/th>\n<th>Move<\/th>\n<th>Use<\/th>\n<th>Door<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\"><strong>Mouse<\/strong><\/td>\n<td data-label=\"Turn\">Drag: the picture follows the pointer, same amounts<\/td>\n<td data-label=\"Move\">Wheel: each notch is a pinch of ×1.25, anchored on the pointer. A new anchor after a quarter second without scrolling. Shift + wheel (a sideways wheel) tracks: 1 m a notch<\/td>\n<td data-label=\"Use\">Click<\/td>\n<td data-label=\"Door\">Click it, or scroll again after stopping<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Trackpad<\/strong><\/td>\n<td data-label=\"Turn\">Drag<\/td>\n<td data-label=\"Move\">Pinch (anchored on the pointer), or two-finger scroll up and down. <strong>Two fingers sideways tracks,<\/strong> as on the phone: the picture goes the way the fingers go<\/td>\n<td data-label=\"Use\">Click<\/td>\n<td data-label=\"Door\">The same<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Keyboard<\/strong><\/td>\n<td data-label=\"Turn\">Left and right arrows: 90° a second, the way the key points (left arrow, you turn left)<\/td>\n<td data-label=\"Move\">Up, down, W, S: 4 m a second, held. <strong>A and D step<\/strong> you left and right at 3 m a second, the way the key points. Holding a key is not what he disliked<\/td>\n<td data-label=\"Use\">Tab steps through what you can see, nearest first. Enter goes to it; Enter again uses it<\/td>\n<td data-label=\"Door\">Enter, or hold forward half a second. Escape: outside<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\"><strong>Screen reader, no pointer, no 3D<\/strong><\/td>\n<td data-label=\"Turn\">—<\/td>\n<td data-label=\"Move\">The list of places (<a href=\"#how-place\"><code>00-shared.md<\/code><\/a>). Unchanged<\/td>\n<td data-label=\"Use\">Buttons<\/td>\n<td data-label=\"Door\">\"The door\" is a place<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Gone: holding the mouse button to walk; turning by pushing the pointer to the edge.<\/p>\n<p><strong>Motion turned off.<\/strong> Nothing travels across the screen:<\/p>\n<ul>\n<li>A pinch is a cut. Past ×1.25 you are put half-way to the anchor (or at its stop if that is nearer); under ×0.8 you are put as far back again as the anchor is. One cut per pinch.<\/li>\n<li>A tap that takes you somewhere is a cut. The door is a cut with the stroke as one held frame.<\/li>\n<li>A swipe still turns under the finger, because it only moves while you do; it does not carry on after. Tilt starts off.<\/li>\n<\/ul>\n<p>Every job in <code>jobs.md<\/code> can be done by each column: arriving, reading the sign, going in, walking round and out, using things, standing still, walking off and back.<\/p>\n<h2>What the page takes over, and what it leaves alone<\/h2>\n<p><strong>On the picture (the canvas) only:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>The browser would<\/th>\n<th>The page<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"The browser would\">Pinch-zoom the page<\/td>\n<td data-label=\"The page\">Takes it. <code>touch-action: none<\/code> on the canvas, and <code>preventDefault()<\/code> on <code>touchstart<\/code>/<code>touchmove<\/code>/<code>touchend<\/code> there (not passive). Safari's <code>gesturestart<\/code>/<code>gesturechange<\/code>/<code>gestureend<\/code>: prevented<\/td>\n<\/tr>\n<tr>\n<td data-label=\"The browser would\">Double-tap to zoom<\/td>\n<td data-label=\"The page\">Takes it (the same two lines). The margin's words get <code>touch-action: manipulation<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"The browser would\">Ctrl + wheel / trackpad pinch zoom<\/td>\n<td data-label=\"The page\">Takes it: <code>preventDefault()<\/code> on <code>wheel<\/code> over the canvas (not passive)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"The browser would\">Pull to refresh; rubber-band scrolling<\/td>\n<td data-label=\"The page\">Takes it: <code>overscroll-behavior: none<\/code> on <code>html<\/code> and <code>body<\/code>; the page never scrolls<\/td>\n<\/tr>\n<tr>\n<td data-label=\"The browser would\">Long press: callout, selection, magnifier, context menu<\/td>\n<td data-label=\"The page\">Refused, as now. A long press does nothing at all<\/td>\n<\/tr>\n<tr>\n<td data-label=\"The browser would\">Two-finger sideways scroll going back (desktop)<\/td>\n<td data-label=\"The page\">Takes it over the canvas (it tracks you sideways)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Left alone, always:<\/strong><\/p>\n<ul>\n<li><strong>The edge swipe for back<\/strong> (iPhone, Android gestures). A page can't stop it and shouldn't try. Instead: a touch that starts within 20 px of the left or right edge is not ours, so nothing half-turns. And back is safe by design: it puts you outside the last door, or leaves the site if you never went in. No fake history entries.<\/li>\n<li>The bottom edge (home bar). Nothing of ours within 40 px of it.<\/li>\n<li>Keyboard zoom (Ctrl/Cmd + − 0), and every other shortcut with Ctrl, Cmd or Alt.<\/li>\n<li>The phone's own accessibility zoom.<\/li>\n<li><strong>The list of places, the loading screen and the no-3D page take over nothing.<\/strong> Pinch zooms the page there as anywhere. Do not set <code>user-scalable=no<\/code> or <code>maximum-scale<\/code>.<\/li>\n<li>Viewport: <code>width=device-width, initial-scale=1, viewport-fit=cover<\/code>.<\/li>\n<\/ul>\n<p><strong>Fingers: touch events, not pointer events.<\/strong> The first version read fingers from pointer events and counted downs and ups. Swipe worked on his iPhone (Safari); pinch did not. So:<\/p>\n<ul>\n<li>On a touch screen, work the gesture out <strong>from <code>e.touches<\/code>, the whole list of fingers down, on every <code>touchstart<\/code>, <code>touchmove<\/code>, <code>touchend<\/code> and <code>touchcancel<\/code>.<\/strong> Two or more in the list: pinch (start it there if it hasn't started). One: swipe. None: end. Never keep your own count. iOS Safari is known to swallow a second finger's start when it suspects a double tap, and to deliver pointer events in odd orders during a pinch (WebKit bugs 246313, 211521, 203237); a list that is re-read every event can't go stale.<\/li>\n<li>Pointer events are for the mouse and pen only (<code>pointerType !== 'touch'<\/code>).<\/li>\n<li>Safari's own <code>gesturestart<\/code> / <code>gesturechange<\/code> / <code>gestureend<\/code> are always prevented. They also carry the spread as <code>e.scale<\/code>: use it to drive the same pinch <strong>only<\/strong> when the touch list is not showing two fingers.<\/li>\n<li><strong>The page, not just the canvas, refuses the browser's zoom:<\/strong> <code>touch-action: none<\/code> on <code>html<\/code> and <code>body<\/code> as well; a non-passive, capturing <code>touchmove<\/code> listener on <code>document<\/code> that prevents default; the same on <code>touchstart<\/code> when more than one finger is down; <code>dblclick<\/code> prevented. (The list of places and the no-3D page are other pages and keep their zoom.)<\/li>\n<li>A third finger is ignored. <code>touchcancel<\/code> ends the gesture as if the fingers lifted.<\/li>\n<li><strong><code>#debug<\/code><\/strong> on the test page shows, top left: fingers the page sees, the gesture, the last events, page zoom, whether motion is reduced. One screenshot of it says why something failed. Keep it in the prototype.<\/li>\n<\/ul>\n<h2>States<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\"><strong>First arrival<\/strong><\/td>\n<td data-label=\"What happens\">The place, and in the margin two words: <strong>swipe · pinch<\/strong> (and <strong>tilt<\/strong> on a phone). Each word goes when you've done it. A mouse sees <strong>drag · scroll<\/strong>; the first key press swaps them for <strong>arrows · tab · enter<\/strong>. Nobody is stuck without them: the first thing anyone tries is a tap or a drag, and both work. A tap on the station from the road takes you to the door<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>At a wall or a thing<\/strong><\/td>\n<td data-label=\"What happens\">The pinch ends 0.9 m short, leans, comes back. Pinch in to back off, swipe to turn<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>At the door<\/strong><\/td>\n<td data-label=\"What happens\">Above<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>At the world's edge<\/strong><\/td>\n<td data-label=\"What happens\">Nothing to see. A pinch that crosses 130 m carries on from the far side. Backing over it works too: you keep backing, and the station comes past you from behind<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Indoors<\/strong><\/td>\n<td data-label=\"What happens\">The same. Things are nearer, so pinches are shorter by themselves<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>In the dark<\/strong><\/td>\n<td data-label=\"What happens\">The same. You can pinch or tap on something you can't see; you still stop at what is there<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Looking straight down or up<\/strong><\/td>\n<td data-label=\"What happens\">A pinch moves you the way you face<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>Two fingers, then a third<\/strong><\/td>\n<td data-label=\"What happens\">Ignored<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\"><strong>The page is hidden mid-gesture<\/strong><\/td>\n<td data-label=\"What happens\">The gesture ends; you stay where you were<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>What used to lean on the lamp<\/h2>\n<p>The lamp is out (<code>owner.md<\/code> 28, <code>steer-5.md<\/code>). <strong>Nothing above depends on it.<\/strong> For the record, what in the controls did:<\/p>\n<ul>\n<li>\"Drag to look <em>and aim<\/em>\": on a phone the lamp sat under the finger. A swipe now only turns.<\/li>\n<li>On a desktop the lamp followed the pointer. The pointer now does nothing until pressed.<\/li>\n<li>Keyboard: \"the lamp is the focus\". The focused thing needs its own mark now, at every hour (visual: a heavier outline; unsolved in the dark).<\/li>\n<li>Standing still: the lamp closing was the first sign. Stillness now shows only from the stars on.<\/li>\n<\/ul>\n<p>What the controls do touch is <strong>your shadow<\/strong>, now cast by any real light (<a href=\"#lights\"><code>lights.md<\/code><\/a>): it is worked from where you stand each frame, so it slides with a pinch and needs nothing from the controls. A swipe or a tilt doesn't move it on the ground; it moves in the picture as the picture turns.<\/p>\n<h2>Numbers in one place<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Stop short of a thing<\/td>\n<td data-label=\"\">0.9 m<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Lean past the stop<\/td>\n<td data-label=\"\">up to 0.25 m<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Anchor held between<\/td>\n<td data-label=\"\">3 m and 40 m<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Pinch out<\/td>\n<td data-label=\"\"><code>D × (1 − 1/s^1.5)<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Pinch in<\/td>\n<td data-label=\"\"><code>D × (1/s − 1)<\/code>, at most 30 m<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Pinch dead zone; smallest start spread<\/td>\n<td data-label=\"\">4%; 60 px<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Two fingers: pinch or track<\/td>\n<td data-label=\"\">settled in the first 12 px: gap change against sideways move of the middle<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Track<\/td>\n<td data-label=\"\">×1.5 of exact following: full width ≈ 0.9 × <code>D<\/code>; keys 3 m/s; wheel 1 m a notch<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">The curve and the carry-on<\/td>\n<td data-label=\"\">see the one block under \"The curve\"<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Follow lag<\/td>\n<td data-label=\"\">60 ms<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Swipe<\/td>\n<td data-label=\"\">width = 90°, height = 60°; starts at 10 px<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Tilt limits<\/td>\n<td data-label=\"\">75° up, 60° down<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Tap<\/td>\n<td data-label=\"\">under 0.5 s, under 10 px; use within 2.5 m; go within 40 m<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Tap travel<\/td>\n<td data-label=\"\">10 m/s, 0.3 s to 2.5 s<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Door<\/td>\n<td data-label=\"\">stop 0.9 m short; ×1.15 on a new pinch; land 1.5 m in<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Phone tilt<\/td>\n<td data-label=\"\">1 : 1, slack 0.75°<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Keys<\/td>\n<td data-label=\"\">4 m/s; 90°/s; door after 0.5 s<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Wheel<\/td>\n<td data-label=\"\">×1.25 a notch; new anchor after 0.25 s<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tune first, on his phone, in this order:<\/strong> the curve's top and the tracking amount (×1.5), then the pinch-out power (1.5; 1 is exactly a photo and feels slower), the swipe amount (90° a width), nothing else about direction; it is settled. The test page takes <code>#k=1<\/code>, and <code>#leftright=against<\/code>, <code>#updown=against<\/code>, <code>#track=against<\/code> to compare.<\/p>\n<h2>Not proven<\/h2>\n<ul>\n<li><strong>The curve, the faster tracking and the carry-on have not been in his hand.<\/strong> The figures in the table are from touch events built and timed inside a desktop browser page (the browser's debugging channel can't send them fast enough to be a flick). They show the sums. He has had the first set in his hand (\"slightly too intense\"); the eased set has not been back.<\/li>\n<li><strong>Directions are settled by his hand<\/strong> (iPhone, Safari): up–down and pinch \"great\"; left–right and tracking flipped at his word to follow the finger. The flipped two have not been back in his hand yet. <strong>Pinch works on his iPhone<\/strong> (\"pinch works there\"), on the touch-events version. Whether the first, pointer-events version ever really failed is not known: his \"pinching doesn't work yet\" was said in the station, which has no pinch. Keep the touch-events version regardless; it is the sturdier one. The rebuilt version was checked in desktop Chromium three ways: real multi-touch TouchEvents sent through the browser's debugging channel, with the two fingers landing one after the other; a second finger whose start never arrives (only moves listing two fingers); and Safari's gesture events alone with no touches. All three move you as the sums say. None of that is iOS Safari. Only his phone can confirm it, and say anything about how it feels.<\/li>\n<li><strong>Two-finger tracking has not been in his hand.<\/strong> Checked with real multi-touch TouchEvents in desktop Chromium: two fingers right slide you right and left slide you left with the heading unchanged; two fingers up do nothing; a symmetric pinch, a lopsided pinch out and a lopsided pinch in all stay pinches; tracking stops at a pump and at the building's corner. Whether 12 px is the right moment to decide, for a real hand, only his iPhone can say.<\/li>\n<li>Tilt has not run on any phone. Emulation has no sensor.<\/li>\n<li>The test page leaves out: the 20 px edge rule, the mouse and keyboard hint words, standing spots and facings for taps, Tab, and everything that isn't moving. Its things are boxes and \"use\" just flips one black or white.<\/li>\n<li>How the drawing takes being crossed at this speed. A pinch covers 25 m in the time it takes to part two fingers, and can be rocked in and out. The dots that change with distance will all change in that time. Visual to judge.<\/li>\n<li>Footsteps: twenty metres in half a second can't be twenty-five steps. A sound question, not started.<\/li>\n<\/ul>", "jump": ["The whole of it", "The curve: faster goes further", "Pinch", "Two-finger swipe: tracking sideways", "Swipe", "Tap", "The door", "Tilt: the phone turns the view", "Standing still", "Every other way in", "What the page takes over, and what it leaves alone", "States", "What used to lean on the lamp", "Numbers in one place", "Not proven"]}, "place": {"title": "Shared by every concept — how it works", "tab": "the shared place", "route": "#how-place", "html": "<h1>Shared by every concept — how it works<\/h1>\n<p><em>How it works (systems). Current to <code>owner.md<\/code> section 30 and <code>steer-5.md<\/code>: moving is swipe, pinch and tap (<a href=\"#how-controls\"><code>controls.md<\/code><\/a>); the lamp that followed the view is out; light works as in the real world. Before that, round 3, after <code>score-2.md<\/code> and <code>owner.md<\/code> section 7. One concept is built on this place: <a href=\"#how\"><code>05-left-on.md<\/code><\/a>. The look-and-feel half below is the visual designer's.<\/em><\/p>\n<h2>One place, one concept<\/h2>\n<p>After two rounds there is one concept, <a href=\"#how\"><code>05-left-on.md<\/code><\/a>. 01 and 03 are merged into it; 02 and 04 are folded into this file. Everything here is true of the place whatever is built on it.<\/p>\n<h2>Where the owner's answers overruled the jam<\/h2>\n<p>Kept: ink is where the light isn't; a latch at the door, never a puzzle; the real hour is the hour; evidence, never the creature; nothing needed is hidden behind a time, a wait or a secret.<\/p>\n<p>Changed: composed stops became one walked world (\"walk around\"). One plain Route 66 station with one Googie arrow sign and his name (\"Route 66 but there's gotta be a googie arrow sign\"; \"Me\"). Five gestures became four: <strong>Look, Cross, Call, Wait.<\/strong> How the hand makes them changed with <code>owner.md<\/code> section 24 (below, \"Moving\"). Pick up is dropped until there is something to hold. The moments the concept shows: arriving by day; arriving at night; crossing the door; inside; doing nothing; a view nobody composed.<\/p>\n<p>Dropped: the timetable, the piece of the hour, the receipt, the office-hours order, a real latitude, the streamlined station, the raking beam, The board, and any note of whose it is beyond the sign (\"yes but no\").<\/p>\n<h2>The lot<\/h2>\n<p>One layout. It comes from where the sign's shadow really falls (a 12 m sign, a generic desert sun), because in a world where ink is shadow that shadow is there whether wanted or not.<\/p>\n<pre><code>                               N\n   [ ---------------- station, front faces south ---------------- ]\n        garage door       window        DOOR      bench\n   +--------------------+\n   |  canopy            |                 |\n   |  W pump    E pump  | air post        |  16 m, open slab\n   +--------------------+                 |\n                                        [SIGN]                      phone box\n   ============================ road, east–west ============================\n\n                    you arrive here, 21 m south of the sign\n<\/code><\/pre>\n<ul>\n<li><strong>The sign stands at the road, straight in front of the door.<\/strong> It carries his name and nothing else (\"Gas is unnecessary\"). He wants it <strong>neon and historically accurate<\/strong> to the article he sent, which is now read (<code>inspo/sign-article/<\/code>): a bulb-studded steel arrow bolted to an older sign. Whether the name is neon or plastic letter boxes, and which arrow, are out with him (<a href=\"#elements\"><code>elements.md<\/code><\/a>, element 5). The arrow points down beside the name; \"dives at the door\" no longer describes it.<\/li>\n<li><strong>You arrive across the road, 21 m south of the sign,<\/strong> facing it. From there the whole name is in the picture on a phone, and the road lies between you and the place.<\/li>\n<li><strong>The canopy and pumps are to the west; the door is clear of them.<\/strong> This is the director's \"door at the edge of the shade\", with a reason he didn't have: a canopy anywhere north of the sign catches the sign's shadow on its roof, where nobody can see it. Put to the west, it only catches the morning shadow, and \"the shadow goes in under the canopy\" is a good thing for a shadow to do.<\/li>\n<li>The owner has confirmed it: \"Canopy over pumps yes.\" And it is <strong>joined to the building<\/strong> (\"joined\"): it comes off the front wall west of the door, as in his abandoned desert station photo.<\/li>\n<li><strong>The station is abandoned<\/strong> (\"abandoned\"), and the wall is <strong>stucco over brick<\/strong>. Labels on things are <strong>realistic, with invented brand names<\/strong>. <strong>The power never went off<\/strong> (\"abandoned can still have power\"). What each of these does to each element is in <a href=\"#elements\"><code>elements.md<\/code><\/a>, which is now the list of what the place contains: it adds utility poles and wires along the road, a lamp post on the forecourt, lettering on the window glass, boulders, clouds, and mountains and brush in the distance, all at his word.<\/li>\n<\/ul>\n<h2>Light<\/h2>\n<p>The owner: <strong>\"Lighting should work as in the real world.\"<\/strong> True of the place whatever is built on it:<\/p>\n<ul>\n<li>A light lights what it really would. The sun; the station's own lamps; anything switched on. Nothing else is lit, and where no light reaches it is dark. The dark is drawn, never blank.<\/li>\n<li>Things, and the visitor, cast shadows from whatever light is really there, and have none where there is no light.<\/li>\n<li>A thing in shade is shaded.<\/li>\n<li>Nothing follows where you look (\"The light that follows where I look\" is what he turned down).<\/li>\n<li>A thing's own marks are drawn once and stay; the light and shade on it are real and move.<\/li>\n<\/ul>\n<p>Every light is listed, with its position and reach, in <a href=\"#lights\"><code>lights.md<\/code><\/a>. The sun rises on your right as you arrive, crosses the south sky behind you, and sets on your left. At night the moon does the same (the owner: \"there's a moon and it's always epic… exaggerated\"): up every night, far bigger than real, lighting the open ground dimly and throwing real shadows.<\/p>\n<p>The exceptions kept on purpose are listed there and in <a href=\"#how\"><code>05-left-on.md<\/code><\/a> (\"Checked against 'as in the real world'\"): the alien material above all.<\/p>\n<h2>Moving<\/h2>\n<p>One world, no stops. The owner walked \"drag to look, hold to walk\" and said: \"I dislike press and hold. It should do pinch to zoom in and out and swiping should rotate camera\"; \"Pinch out zooms in pinch in backs up like photos\"; and \"It would be cool for phone gyro to move me around camera wise\". <strong>The exact spec, with every number, is <a href=\"#how-controls\"><code>controls.md<\/code><\/a>.<\/strong> In short:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Turn<\/th>\n<th>Move<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Phone<\/td>\n<td data-label=\"Turn\">Swipe: the picture follows your finger. Or turn the phone<\/td>\n<td data-label=\"Move\">Pinch: out carries you toward what is between your fingers, in backs you away. Two fingers sideways together: the picture goes with them and you step the other way. Or tap a thing or a spot to be taken there<\/td>\n<td data-label=\"Use\">Tap a thing you're at<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Mouse, trackpad<\/td>\n<td data-label=\"Turn\">Drag<\/td>\n<td data-label=\"Move\">Wheel, or trackpad pinch, toward what's under the pointer. Or click a thing or a spot<\/td>\n<td data-label=\"Use\">Click<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Keyboard<\/td>\n<td data-label=\"Turn\">Left and right arrows<\/td>\n<td data-label=\"Move\">Up and down arrows, held<\/td>\n<td data-label=\"Use\">Tab to a thing; Enter goes, Enter again uses<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Holding a finger down does nothing, anywhere.<\/strong><\/p>\n<p><strong>What a pinch is.<\/strong> It moves you; it does not narrow the view. The point between your fingers is the anchor: you travel the straight level line toward whatever is under it, and that thing grows as your fingers part, as a photo would. A long way goes quickly and the last metre slowly. You stop 0.9 m short of a thing or a wall, and can stand on any spot of ground. A pinch never turns you and a swipe never moves you.<\/p>\n<p><strong>Go to.<\/strong> Tap or click a thing, or a spot on the ground, within 40 m, and you're taken there and stop. Every thing has a standing spot and a facing, so going to a thing by a tap puts you down in front of it with a picture worth having; a pinch brings you to it along your own line instead. This is where the composed views went. It is the one-handed way to move, and the whole of keyboard and screen-reader movement (below), so it isn't an extra.<\/p>\n<p>Rules of moving:<\/p>\n<ul>\n<li>Eye height, always. You can look up to the top of the sign and the sky, and down to your feet. The view stays where you leave it; it does not level itself.<\/li>\n<li>No walking pace on a touch screen: a pinch takes you as far as your fingers say. From where you arrive, the door is 37 m: three easy pinches, or one tap and two and a half seconds. The keyboard walks at four metres a second.<\/li>\n<li>You slide along walls going forward and stop dead going back. You can't get stuck, fall, or be anywhere you can't get out of.<\/li>\n<li>Motion turned off: a pinch, a tap and the door become cuts.<\/li>\n<\/ul>\n<p><strong>Named places<\/strong> are the old stops, kept as standing spots with names: the road, the forecourt, the door, the counter, the aisle, the far end, the back lot. You never have to use the names. They exist so that anyone can jump (see \"Without the picture\").<\/p>\n<h2>The four gestures, as the hand makes them<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Gesture<\/th>\n<th>What you do<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Gesture\">Look<\/td>\n<td data-label=\"What you do\">Be near a thing and face it<\/td>\n<td data-label=\"Note\">No pointing from across the lot. On a phone a pump is 20 pixels wide from the road; anything that matters is worth going up to<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Gesture\">Call<\/td>\n<td data-label=\"What you do\">Tap or click a thing you're at; Enter on the keyboard<\/td>\n<td data-label=\"Note\">Out of reach, the same tap takes you there. So one tap brings you to it and the next one acts<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Gesture\">Cross<\/td>\n<td data-label=\"What you do\">Come up to the door, where you stop. Then one more pinch, or a tap on it, or Enter<\/td>\n<td data-label=\"Note\">Two beats: arrive, open. That is the latch. A single pinch never carries through a doorway, except at midday<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Gesture\">Wait<\/td>\n<td data-label=\"What you do\">Stop<\/td>\n<td data-label=\"Note\">Below<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>The door, and the inside being bigger<\/h2>\n<p>The door is still one act, answered by the stroke across the screen: anything that would carry you through a doorway stops you at it, and the next pinch, tap or Enter takes you through and puts you a step and a half inside. That stroke is also what hides the join between two spaces:<\/p>\n<ul>\n<li><strong>Outside<\/strong> is the lot and the desert. The building is 8 m deep. You can walk all the way round it.<\/li>\n<li><strong>The front room<\/strong> is real and the right size. You see it through the window from the lot, and you see the lot through the window from inside.<\/li>\n<li><strong>Past the front room, the inside keeps going<\/strong> further than the back wall you walked round. In the concept it is one aisle, 28 metres long. Nothing explains it. From no single spot can you see both facts at once; you only know because you walked both.<\/li>\n<li><strong>The back door<\/strong> at the far end lets you out behind the building. Walk round the corner and the front is eight metres away.<\/li>\n<\/ul>\n<p>A link someone sends always lands on the road. Crossing a door is the only thing that adds to the browser's history, so <strong>back puts you outside the last door you came through<\/strong>, and Escape does the same. Moving never fills the history.<\/p>\n<h2>Where the world ends<\/h2>\n<p>The director's proposal, agreed, with a mechanism:<\/p>\n<ul>\n<li>Past about 100 m, things are lost. That's already a rule of the drawing (far things are lost).<\/li>\n<li>At about 130 m from the sign, walking away, you are moved to the same distance on the opposite side, <strong>keeping the direction you're facing.<\/strong> You're now walking toward the sign. Nothing you could see has changed: the ground is bare out there, the hills are at the horizon, and the sun is where it was, so your shadow doesn't jump.<\/li>\n<li>A few seconds later the top of the sign comes up ahead.<\/li>\n<li>The centre of the turn-round is the foot of the sign, which is on the road. So someone walking off down the road comes back up the road; someone walking into the desert behind the station arrives from the front.<\/li>\n<\/ul>\n<p>Any direction, five easy pinches out (about half a minute at the keyboard's pace) and you're arriving again. Backing out over the edge works too: you keep backing, and the station comes past you from behind. Same station, same hour. Nobody can be lost, and \"the road\" is always in the list of places.<\/p>\n<p><strong>The desert has to obey the same join.<\/strong> The far hills are at the horizon and look the same from both sides, so they can stay. Marks on the ground (scrub, a fence line, a cactus) either stop before 100 m, or are laid so that the ground at any spot matches the ground at the opposite spot. Otherwise the scrub at your feet jumps when you're moved.<\/p>\n<p>Also: lights. At night the sign's bulbs would be seen from much further than 100 m, which would show the join. I'd lose lights at the same distance as everything else, and let the bulbs come on as you get near.<\/p>\n<h2>True of the place at any hour<\/h2>\n<p>These came out of the folded concepts and belong to the place.<\/p>\n<ul>\n<li><strong>The sign's shadow lies on the slab and moves through the day.<\/strong> With the sign as the article has it, the shadow is the sign's shape: a tall bar with the arrow's hook at the near end, not a clean arrow. It lies toward the pumps in the morning, toward the door at midday, and away east in the afternoon. In summer it's short. Nothing is done with it. It's there to be found and followed.<\/li>\n<li><strong>On winter middays it reaches the door<\/strong> and comes in over the threshold. On the shortest day the top of the sign is on the door.<\/li>\n<li><strong>The wall clock swings it.<\/strong> Turn the clock indoors and, through the window, the shadows go round.<\/li>\n<li><strong>At midday the door is off the latch.<\/strong> The one hour the place lets you in without asking. An extra; nothing depends on it.<\/li>\n<li><strong>A landed word is rare.<\/strong> The counter bell has one (DING), after the owner's HONK. Nothing else does. Switches, latches and steps have their light or their sound and no word.<\/li>\n<\/ul>\n<h2>Twilight<\/h2>\n<p>For about half an hour at each end of the day there's no sun and not yet dark. Lights can only show against ink, so dusk is the sky being inked in from the top while the sign comes on against it.<\/p>\n<p>No sun and no dark means no shadows, yours included, as on any evening. What someone arriving then sees, so it doesn't look broken:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">0 s<\/td>\n<td data-label=\"\">The road. The station with no shadows on it, the flattest it ever is. Sky still paper<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">3 s<\/td>\n<td data-label=\"\">A stroke of ink is laid into the top of the sky. The first letter of the name is lit against it. A buzz starts<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">4–9 s<\/td>\n<td data-label=\"\">A stroke and a letter about each second, down the name<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">10 s<\/td>\n<td data-label=\"\">The first bulb of the arrow, and a click<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Whenever in the half hour you arrive, the next letter comes at three seconds. At dawn it runs the other way: the ink is lifted and the letters go out. If the odd things happen by themselves at any time, it's now.<\/p>\n<h2>Wait<\/h2>\n<p>Standing still is the gesture. Shared rules:<\/p>\n<ul>\n<li><strong>Still<\/strong> means not being moved (no pinch, no go-to, no walking key) and not acting. The clock for it starts the moment you stop.<\/li>\n<li><strong>Turning to look does not restart it,<\/strong> by finger or by turning the phone. Otherwise you could never watch what the place does; and a hand holding a phone is never still, so with tilt on, nothing else would work.<\/li>\n<li><strong>Moving or acting ends it at once.<\/strong> Anything that was moving by itself stops. Anything that already changed stays changed for the visit: that's the evidence it happened.<\/li>\n<li>If the page is hidden, the clock stops. Nothing happens while you can't see it; that would be a different kind of site.<\/li>\n<\/ul>\n<p>The concept says what Wait gives, second by second.<\/p>\n<h2>Without the picture (job 12, line by line)<\/h2>\n<p>No 3D, or a screen reader, or keyboard only: <strong>the named places as a list.<\/strong> Each place is two or three plain lines of what's there at this hour, then its things as ordinary buttons, then the places you can go from it. Acting on a thing gives its answer in words (\"The bell rings. Nobody comes.\"). The list is also reachable from the margin with the picture running, as one small mark, because some people will want to jump.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>With no 3D / screen reader<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Job\">1 Arrive, place first<\/td>\n<td data-label=\"With no 3D / screen reader\">Opens on \"The road\": a still of the station at this hour (four made ahead) and three lines<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">2 Arrow sign, his name<\/td>\n<td data-label=\"With no 3D / screen reader\">The first line names the sign and what it points at<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">3 Go in<\/td>\n<td data-label=\"With no 3D / screen reader\">\"The door\" is a place; its one button is the latch<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">4 Walk around, in and out<\/td>\n<td data-label=\"With no 3D / screen reader\">Every place lists where you can go from it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">5 Each touch means something<\/td>\n<td data-label=\"With no 3D / screen reader\">Each button gives the thing's answer in words, the same answer<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">6 Hear it<\/td>\n<td data-label=\"With no 3D / screen reader\">Sound runs the same if it's on; every sound also has its word<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">7 Another hour<\/td>\n<td data-label=\"With no 3D / screen reader\">The lines for each place are written per hour; the clock is a button<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">8 Alien things<\/td>\n<td data-label=\"With no 3D / screen reader\">Cues are announced once, plainly, as what was seen<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">9 Do nothing<\/td>\n<td data-label=\"With no 3D / screen reader\">Stay on a place and its cues arrive as lines, on the same timing<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">10 Find more next time<\/td>\n<td data-label=\"With no 3D / screen reader\">The chart is a place with a list<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">11 Send it<\/td>\n<td data-label=\"With no 3D / screen reader\">Same address<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Job\">12 Phone and desktop<\/td>\n<td data-label=\"With no 3D / screen reader\">The list is one column on both<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Honest limit: your shadow has no version without a picture. \"Look at\" a thing gives it in a line. The list says what is lit and lets you switch things on and off, and the room's sound still builds.<\/p>\n<p><strong>Keyboard with the picture:<\/strong> arrows walk and turn; Tab steps through the things and places you can see, nearest first; Enter goes to it, and again to act; Escape puts you outside the last door.<\/p>\n<h2>The margin<\/h2>\n<p>Outside the picture: sound on or off; the hour (and \"wound\" with the real time beside it, when the clock has been turned); the mark that opens the list of places; on a phone, <strong>tilt<\/strong> (the phone turning the view: on, off, and on an iPhone the tap that asks for it). On a first visit, two words that go once you've done them: <strong>swipe · pinch<\/strong>. Nothing else. No name, no credit, no contact (\"yes but no\").<\/p>\n<p>The visual designer wrote that the margin loses the way out, and it does: a walked world has a door. I've added the list of places in its place. That's a disagreement with keeping the margin to two things, and I think job 12 needs it.<\/p>\n<h2>Adding to the place (jobs 13 and 14; 04 folded in here)<\/h2>\n<p><strong>The world is places, things and cues.<\/strong> A thing has a spot, a standing spot, a shape, and its answer to Look and Call as an ink mark and a sound. A cue has a <em>when<\/em> (an hour, a date, how long you've stood still) and a <em>what<\/em>.<\/p>\n<p><strong>Marked out<\/strong> (from 04). A thing Adam plans and hasn't made is a dashed footprint on the ground and one word in his hand. That's the first step of adding anything: one line saying where and what. You can stand inside the outline of something that isn't there yet. When he makes it, the outline is gone and the thing is there.<\/p>\n<p><strong>Marks in another hand<\/strong> (from 04). Among his outlines, a few that aren't his and never get made. Three circles on the back lot. Alien evidence, in every concept.<\/p>\n<p><strong>No in-between look.<\/strong> A generated thing is drawn by the same rules as one he made, and nobody is told which is which. The swap is per thing and unseen: his strokes (one sheet replaces the generated marks everywhere), then his Blender model, then his paint on it.<\/p>\n<p>Dropped from 04: the ledger, WET INK cards, the roughed-in look. <code>04-the-makeover.md<\/code> is kept with a line at the top saying so.<\/p>\n<h2>Sound: where to begin<\/h2>\n<p>The owner: \"yes but idk how to even begin there.\" And earlier: \"we need sound effects at least.\" So this is a beginning he can change, built the way the strokes are.<\/p>\n<p><strong>The principle<\/strong> (the visual designer's, and it's right): every light has a sound, and the place's own sound is the sum of the lights that are on. By day one light, the sun: wind and hot metal. At night the lamps. Under stars alone, almost nothing.<\/p>\n<p><strong>Three kinds of sound, and where each comes from.<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Kind<\/th>\n<th>What<\/th>\n<th>Heard<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Kind\">The bed<\/td>\n<td data-label=\"What\">The lights that are on<\/td>\n<td data-label=\"Heard\">From where each light is. Walk toward the sign and its buzz grows; walk away and it's wind<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Kind\">Your own<\/td>\n<td data-label=\"What\">Footsteps<\/td>\n<td data-label=\"Heard\">Under you. Stop and they stop, so Wait is something you hear yourself begin. (A pinch can cover twenty metres in half a second; what your steps sound like then is open)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Kind\">Answers and events<\/td>\n<td data-label=\"What\">The bell, the latch, a switch; and the things the place does by itself<\/td>\n<td data-label=\"Heard\">From where the thing is, left or right, near or far. You hear it and turn<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>That third line matters more now that you walk. A sound behind you is the plainest reason to turn round, and most of what the place does when you're still should be heard before it's seen.<\/p>\n<p><strong>Day one: eleven sounds.<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Sound<\/th>\n<th>For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Sound\">Wind<\/td>\n<td data-label=\"For\">The sun; the bed by day and the floor under everything<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Heat tick<\/td>\n<td data-label=\"For\">Metal in the sun: pumps, canopy<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Sign buzz<\/td>\n<td data-label=\"For\">The name and the arrow, lit<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Relay click<\/td>\n<td data-label=\"For\">Each bulb as the arrow runs<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Tube hum<\/td>\n<td data-label=\"For\">The canopy lamp; the lights indoors<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Compressor<\/td>\n<td data-label=\"For\">The cooler<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Steps on gravel, on concrete, on lino<\/td>\n<td data-label=\"For\">You, in the desert, on the slab, indoors<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Latch<\/td>\n<td data-label=\"For\">The door giving<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sound\">Bell<\/td>\n<td data-label=\"For\">The door; the counter<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Generate for now.<\/strong> Every one of these can be made in the browser from noise and tone, with no recordings: wind is filtered noise; a buzz or hum is a low tone with its overtones; a click or a step is a short burst; a bell is two tones dying away. So sound starts exactly where the strokes start: generated stand-ins, readable, not precise.<\/p>\n<p><stron
