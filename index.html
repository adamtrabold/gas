g>Then his own, one at a time.<\/strong> Each sound is a named slot. Drop a recording in with that name and it replaces the generated one everywhere it's used; the rest stay generated until he gets to them. Same as the stroke sheet, and as easy.<\/p>\n<p><strong>One thing to offer a musician.<\/strong> A hum has a pitch. If each lamp is tuned to one note, the lights that are on make a chord, and the place's sound at any moment is a chord nobody arranged: the sign alone at dusk, more notes as the lamps come on, one note left when you've put the rest out. He picks the notes. It needs no music written, it follows from the rule we already have, and if he doesn't want it the hums are just hums. (The visual designer's offer of a tone that follows the sun's height is the daytime half of the same idea.)<\/p>\n<p><strong>Rules.<\/strong> Sound starts with your first touch, never before. One switch, in the margin. Nothing depends on hearing: with sound off, a light that's on shows a short repeating stroke where its hum would be, and anything heard-first leaves a small mark where it happened. Only the counter bell lands a word. Music, and whether the radio plays his, is still \"idk yet\"; the radio gives static and a station that won't quite come in.<\/p>\n<h2>States, common to all<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What you get<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"State\">Loading<\/td>\n<td data-label=\"What you get\">The road still for this hour and the sign's name as text, at once. The world arrives behind it and you can start walking when it has<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">No 3D<\/td>\n<td data-label=\"What you get\">The list of places, above<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Motion off<\/td>\n<td data-label=\"What you get\">A pinch, a tap and the door are cuts; a swipe still turns under the finger; tilt starts off<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Sound off or blocked<\/td>\n<td data-label=\"What you get\">Small marks where sounds would be; the bell's word; the switch shows off<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">First visit, nothing remembered<\/td>\n<td data-label=\"What you get\">Complete<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Clock wound<\/td>\n<td data-label=\"What you get\">Marked in the margin. Stays wound while you walk about, so you can go out and see it. Lets go when you touch the clock again or leave the site<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Tall phone<\/td>\n<td data-label=\"What you get\">The main canvas<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">Wide desktop<\/td>\n<td data-label=\"What you get\">The same world, a wider slice of it. Nothing depends on the width<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You walk off into the desert<\/td>\n<td data-label=\"What you get\">You arrive again<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You pinch at a wall, or at the thing itself<\/td>\n<td data-label=\"What you get\">You stop 0.9 m short; the view leans a little and comes back<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You hold a finger down<\/td>\n<td data-label=\"What you get\">Nothing<\/td>\n<\/tr>\n<tr>\n<td data-label=\"State\">You stand inside a wall, a thing, a marked-out footprint<\/td>\n<td data-label=\"What you get\">You can't enter the first two; the third is allowed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>What the browser remembers<\/h2>\n<p>Sound on or off; tilt on or off; the chart; the date of your first visit. Concepts add to it where they say. Clearing it loses nothing you need.<\/p>\n<h1>Shared by every concept — how it looks and feels<\/h1>\n<p><em>Round 2 note (visual): this half is from round 1 and is kept for its reasoning. Where it and the look-and-feel half of <a href=\"#how\"><code>05-left-on.md<\/code><\/a> differ, that file is current: the rules of the drawing, the stroke method and its walk-past test, the sign, the arrival framing. The stills and sheets named below were deleted when they were superseded; the current set is listed in <a href=\"#how\"><code>05-left-on.md<\/code><\/a>. The six questions about the sign at the end still stand.<\/em><\/p>\n<p><em>Visual turn 2 of the concept phase. Rewritten after <code>steer-1.md<\/code> and the systems designer's rewrite for walking. Replaces my first version.<\/em><\/p>\n<h2>The swim test (asked for first)<\/h2>\n<p><strong>Result: the ink sits in the world.<\/strong> Walk past the edge of a shadow or the edge of a lamp's pool and its broken shape stays where it is on the ground, like something painted there. It changes when the light changes and not when you move.<\/p>\n<p>How it was tested. I built a new walked prototype of the whole lot in three.js (<code>sketches/place/<\/code>). The broken edge of every light is made from a pattern that is read at the point in the world each pixel shows, not at the pixel's place on the screen. The pattern is fibres that run the way the light runs: parallel for the sun, outward from a lamp. The test (<code>sketches/place/swim.js<\/code>) follows one fixed spot on the ground through six frames, turning and then walking toward it, cuts the same small square round that spot from each frame, and counts how many pixels changed from one frame to the next. It does this twice: ink fixed to the world, and ink fixed to the screen as in last round's prototype. Picture: <code>stills/swim-test.png<\/code>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Ink fixed to the world<\/th>\n<th>Ink fixed to the screen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"\">Night, edge of the canopy lamp's pool: turning<\/td>\n<td data-label=\"Ink fixed to the world\">0.4% changed<\/td>\n<td data-label=\"Ink fixed to the screen\">4.0%<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Night, same: walking<\/td>\n<td data-label=\"Ink fixed to the world\">1.2%<\/td>\n<td data-label=\"Ink fixed to the screen\">3.5%<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Day, a shadow edge on the slab: turning<\/td>\n<td data-label=\"Ink fixed to the world\">1.8%<\/td>\n<td data-label=\"Ink fixed to the screen\">3.5%<\/td>\n<\/tr>\n<tr>\n<td data-label=\"\">Day, same: walking<\/td>\n<td data-label=\"Ink fixed to the world\">3.7%<\/td>\n<td data-label=\"Ink fixed to the screen\">5.1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>What I saw in the frames. At night the pool's edge has the same tongues and the same islands of light in all six frames; they grow as you approach and do nothing else. With the ink fixed to the screen, the edge is a different shape in every frame. By day the gap is smaller because a sun shadow's edge is nearly a clean line, so there is less to swim; the changes that remain in the world version are the square's perspective changing as you walk.<\/p>\n<p>What it does not prove:<\/p>\n<ul>\n<li><strong>I have not felt it in the hand.<\/strong> The test was run in a browser without a screen. I judged from frames and counts. Someone should walk the prototype on a phone.<\/li>\n<li><strong>These are fibres of noise, not brush strokes.<\/strong> The edge breaks in the right direction and stays put, but it has no swell and taper. The owner's own marks would have to be laid along the same fibres. That is the next test, and it needs a sheet of his strokes.<\/li>\n<li><strong>Cost.<\/strong> One extra full-screen pass and a depth read. Untested on a real phone.<\/li>\n<\/ul>\n<p>One more thing came out of it. To keep paint sharp while light frays, the ink pass has to know which is which. In the prototype, lit surfaces carry a faint tint that paint doesn't have. So \"two blacks\" is now a mechanism: the door card and the letters on the sign are sharp at any distance, and no shadow edge is.<\/p>\n<h2>Camera at full rate, ink held<\/h2>\n<p>Done in the prototype: the view is redrawn every frame. And with the ink fixed to the world there is nothing left to hold while you walk, because nothing swims. \"Held\" now applies only to things that happen: a word landing, the lamp closing in steps, the light moving on. Same caveat as above: I haven't walked it on a device.<\/p>\n<h2>The pictures<\/h2>\n<p>All in <code>concepts/stills/<\/code>. Tall phone first (300 × 650 at double size), one wide frame per concept. Everything except <code>cross-2d.png<\/code> is a frame from the walked prototype at a position and heading given in <code>sketches/place/shots.js<\/code>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Sheet<\/th>\n<th>Frames<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Sheet\"><code>sheet-00-place.png<\/code><\/td>\n<td data-label=\"Frames\"><code>place-day-road<\/code>, <code>place-day-door<\/code>, <code>place-night-road<\/code>, <code>place-night-canopy<\/code>, <code>place-edge<\/code>, <code>place-marked<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sheet\"><code>sheet-01.png<\/code><\/td>\n<td data-label=\"Frames\"><code>cross-2d<\/code>, <code>01-counter<\/code>, <code>01-aisle-near<\/code>, <code>01-aisle-far<\/code>, <code>01-disc<\/code>, <code>01-anywhere<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sheet\"><code>sheet-02.png<\/code><\/td>\n<td data-label=\"Frames\"><code>02-morning-pump<\/code>, <code>02-late-air<\/code>, <code>02-noon-door<\/code>, <code>02-after-bench<\/code>, <code>02-winter-noon<\/code>, <code>02-door-out<\/code>, <code>02-window<\/code>, <code>02-night<\/code> (and <code>02-anywhere<\/code>, not on the sheet)<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sheet\"><code>sheet-03.png<\/code><\/td>\n<td data-label=\"Frames\"><code>03-shadow<\/code>, <code>03-touch<\/code>, <code>03-inside<\/code>, <code>03-night-arrive<\/code>, <code>03-night-aim<\/code>, <code>03-night-kept<\/code>, <code>03-other<\/code>, <code>03-anywhere<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sheet\"><code>sheet-wide.png<\/code><\/td>\n<td data-label=\"Frames\"><code>01-wide<\/code>, <code>02-wide<\/code>, <code>03-wide<\/code><\/td>\n<\/tr>\n<tr>\n<td data-label=\"Sheet\"><code>swim-test.png<\/code><\/td>\n<td data-label=\"Frames\">the test above<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>To walk it: serve the <code>sketches/<\/code> folder with any static server and open <code>place/index.html<\/code>. <code>?c=1<\/code>, <code>2<\/code> or <code>3<\/code> picks the concept; <code>hour=<\/code> and <code>decl=<\/code> set the sun; <code>night=1<\/code> for night. <code>node render.js<\/code> in <code>sketches/place/<\/code> remakes the stills, <code>node sheets.js<\/code> the sheets. Throwaway. Last round's prototype and 2D stills are deleted, except the door-crossing frame.<\/p>\n<p><strong>What the stills prove and don't.<\/strong><\/p>\n<ul>\n<li>They are real-time frames of crude boxes. They prove where ink goes, that it holds from anywhere, and that it stays put. They don't show a hand.<\/li>\n<li>Last round's 2D stills had better brushwork (strokes stacked along the light) and were not walkable. This round's are walkable and have worse brushwork. Nobody has both yet.<\/li>\n<li>The prototype has no crossing stroke, no landed words, no sound, no \"near things get a paper line in shade\", and nothing answers a tap.<\/li>\n<li>Lettering is a system font.<\/li>\n<li>The three views labelled \"anywhere\" were placed by random numbers, to be honest about what an uncomposed view looks like.<\/li>\n<\/ul>\n<h2>The look, from his words<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>His words<\/th>\n<th>On screen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"His words\">\"pure ink for now\"<\/td>\n<td data-label=\"On screen\">Two values. A light that dims gets smaller, not fainter<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"somewhere in the middle. I want them readable but note precise or always whole\"<\/td>\n<td data-label=\"On screen\">Masses are big and plain; their edges break along the light. Not built yet as strokes<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"Route 66 but there's gotta be a googie arrow sign and it should have some elements of that era in places\"<\/td>\n<td data-label=\"On screen\">A plain box with two painted stripes and a canopy; one showpiece, the sign<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"it should feel liminal not funny\"<\/td>\n<td data-label=\"On screen\">Nothing winks. Nothing of the alien is drawn except what it left<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"place first\"<\/td>\n<td data-label=\"On screen\">The first picture is the road, the station, the sign. Nothing on top of it<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"Me\"<\/td>\n<td data-label=\"On screen\">TRABOLD on the sign, one letter to a box, stacked<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"walk around\"<\/td>\n<td data-label=\"On screen\">Everything here is from a walked world<\/td>\n<\/tr>\n<tr>\n<td data-label=\"His words\">\"yes but no\"<\/td>\n<td data-label=\"On screen\">His name is on the sign and nowhere else<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>The rules of the drawing<\/h2>\n<ol>\n<li><strong>Ink is where the light isn't.<\/strong> A sunlit wall against the sky has no edge (<code>place-day-door<\/code>).<\/li>\n<li><strong>Two blacks.<\/strong> Shadow breaks at its edge and moves with the light. Paint is flat and sharp and never moves: stripes, arrow, lettering, the door card, the garage door.<\/li>\n<li><strong>The light sets the grain.<\/strong> Sun: parallel. Lamp: outward. Stars: one stroke each, round the still point.<\/li>\n<li><strong>Far things are lost.<\/strong> Past about 100 m. This is also what hides the end of the world (below).<\/li>\n<li><strong>Dots.<\/strong> A regular row is bulbs. A loose cluster is the alien material.<\/li>\n<li><strong>Words that land<\/strong> are slab letters known by the ink they throw (<code>cross-2d<\/code>).<\/li>\n<\/ol>\n<h2>The building (one, for all three)<\/h2>\n<p>I've used the systems designer's lot: sign at the road, door 16 m straight north of it, canopy and pumps to the west.<\/p>\n<ul>\n<li><strong>The canopy is back on<\/strong>, as the director ruled, and <strong>it sits west of the door<\/strong>, as systems argued. I agree with systems over the steer here. With the canopy in front of the door the sign's shadow would land on its roof, and the door would be in shade all day.<\/li>\n<li><strong>Day arrival now reads as a gas station<\/strong> (<code>place-day-road<\/code>): a black slab on posts with pumps under it, two stripes, a door, and the sign over all of it.<\/li>\n<li><strong>What the canopy costs.<\/strong> Everything under it is ink for most of the day. The pumps are lost in the shade unless the sun is low. The rule \"near things get a paper line\" would bring them back as you walk in; it isn't built, so in these frames the pumps come and go with the hour.<\/li>\n<li><strong>Two things I added to the lot,<\/strong> for the director and systems to accept or not: a shop window east of the door with a low sill (the room needs a view of the slab), and a bench under it. The garage door is paint.<\/li>\n<li><strong>At night the canopy is lit from below<\/strong> (<code>place-night-canopy<\/code>): a bright slab on posts with a pool under it. Nothing has been added to make it strange.<\/li>\n<\/ul>\n<h2>The sign<\/h2>\n<p>A 12 m pylon. The name in seven boxes stacked down the west side. A flat painted arrow hanging beside it, point down, with two rows of bulbs. A starburst on top.<\/p>\n<ul>\n<li><strong>Its shadow is an arrow.<\/strong> Because the arrow is flat and faces the sun, it throws an arrow-shaped shadow on the slab, pointing away from the sign (<code>02-noon-door<\/code>, <code>02-winter-noon<\/code>). That is in every concept, because it's just the sun.<\/li>\n<li><strong>From the side the sign is a line<\/strong> (<code>01-anywhere<\/code>). It is flat. Real ones are too, but this one vanishes. Either the boxes get real depth or the owner is asked; it's on the list below.<\/li>\n<li><strong>From the arrival spot the letters are small<\/strong> on a phone. They're readable at 15 m and not much further.<\/li>\n<\/ul>\n<h2>Where the world ends<\/h2>\n<p>The director asked whether a horizon in two values can hide the join. <strong>Yes.<\/strong> By day the ground far out is paper and the sky is paper, so there is nothing at the horizon to see jump. At night both are ink. The hills are far enough to be the same from both sides. <code>place-edge<\/code> is the view 86 m out, walking back in: the sign is coming back a few marks at a time.<\/p>\n<p>I agree with systems that lights have to be lost at the same distance as everything else. In the prototype the bulbs are, because they pass through the same test.<\/p>\n<h2>Marked out, and marks in another hand (from 04)<\/h2>\n<p><code>place-marked<\/code>: three dashed circles on the ground east of the slab. The prototype also has one dashed footprint by the wall with \"ice box\" beside it in an italic standing in for his hand. Both are paint, so they stay sharp.<\/p>\n<h2>The margin<\/h2>\n<p>Systems added a third item, the mark that opens the list of places. Fine by me. I'd draw all three as small typewriter notes outside the picture and nothing more. Not drawn.<\/p>\n<h2>Sound<\/h2>\n<p>Systems has written the fuller version above; mine is withdrawn in favour of it. The one visual rule stands: every sound has an ink twin.<\/p>\n<h2>The sign, to check against the owner's saved references<\/h2>\n<p>Neither the article nor the photo pool can be opened from this session. For whoever can:<\/p>\n<ol>\n<li><strong>How the arrow is hung.<\/strong> Ours is a separate flat arrow beside the pole, pointing straight down. Was the arrow of that kind usually a separate piece, part of the panel, or on top of it? Did it point straight down, dive at an angle, or curve over?<\/li>\n<li><strong>Where the bulbs are.<\/strong> Ours has two rows along the arrow's edges. Were they on the face, on the edge, or outlining the whole sign? Did they chase toward the point?<\/li>\n<li><strong>How the name is carried.<\/strong> Ours is one letter per lit box, stacked. Were stacked single-letter boxes used on these signs, or is that a motel habit? Would a station more likely have one long lit panel?<\/li>\n<li><strong>The starburst.<\/strong> Is it of that era and that kind of sign, or a decade later?<\/li>\n<li><strong>Thickness.<\/strong> How deep was such a sign? Ours disappears from the side.<\/li>\n<li><strong>The pole.<\/strong> One pole or two; plain or with fins.<\/li>\n<\/ol>\n<h2>Not proven<\/h2>\n<ul>\n<li>A hand: strokes with swell and taper, fixed to surfaces.<\/li>\n<li>Any of it on a real phone, in the hand.<\/li>\n<li>The paper line for near things in shade.<\/li>\n<li>Sound, landed words in 3D, the crossing stroke in 3D.<\/li>\n<li>Twilight: systems' sequence of the sky being inked in with the letters coming on is undrawn.<\/li>\n<\/ul>", "jump": ["One place, one concept", "Where the owner's answers overruled the jam", "The lot", "Light", "Moving", "The four gestures, as the hand makes them", "The door, and the inside being bigger", "Where the world ends", "True of the place at any hour", "Twilight", "Wait", "Without the picture (job 12, line by line)", "The margin", "Adding to the place (jobs 13 and 14; 04 folded in here)", "Sound: where to begin", "States, common to all", "What the browser remembers", "The swim test (asked for first)", "Camera at full rate, ink held", "The pictures", "The look, from his words", "The rules of the drawing", "The building (one, for all three)", "The sign", "Where the world ends", "Marked out, and marks in another hand (from 04)", "The margin", "Sound", "The sign, to check against the owner's saved references", "Not proven"]}}}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------- the three parts */
const WD = D.words, cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const SECTIONS = [["try","#try",WD.try],["elements","#elements",WD.elements],["how","#how",WD.how]];
function header(sel){
  return `<header class="band wrap"><div class="hgrid">
    <div class="name brand"><a href="#try">${esc(D.project.name)}</a></div>
    <div class="sub">${esc(D.project.line)}</div>
  </div></header><div class="wrap"><nav class="filters" aria-label="Sections">${SECTIONS.map(([k,h,t])=>`<a href="${h}" class="${k===sel?"on":""}">${t}</a>`).join("")}</nav></div>`;
}
function point(t){ return `<p class="purpose">${esc(t)}</p>`; }
function about(){ return `<footer class="wrap about"><p>Built from the project's repo. Everything else the team keeps is there.</p></footer>`; }
function jumpList(hs){ return hs.length > 3 ? `<details class="jump"><summary>Contents (${hs.length})</summary>${hs.map(h=>`<a href="#" data-h="${esc(h)}">${esc(h)}</a>`).join("")}</details>` : ""; }

function vTry(){
  const proto = p => `<section class="proto"><h2><a class="u" href="${p.href}">${esc(p.title)} ›</a></h2><p>${esc(p.line)}</p>
    ${p.views.map(v=>`<div class="drow"><span class="t"><a href="${p.href}#${v.hash}">${esc(v.hash)}</a></span><span class="c">${esc(v.line)}</span><span class="chips">${p.hours.map(h=>`<a href="${p.href}#${v.hash}-${h}">${esc(h)}</a>`).join("")}</span></div>`).join("")}</section>`;
  return header("try") + `<main class="wrap wide" style="max-width:1100px">
    ${D.note.trim() ? `<div class="doc-html" style="margin-bottom:8px">${D.note}</div>` : ""}
    ${D.protos.map(proto).join("")}
    <p class="ink2" style="font-size:12.5px;margin-top:18px">Each opens full screen. Use your browser's back to return here.</p>
  </main>${about()}`;
}
function vElements(){
  const e = D.docs.elements, l = D.docs.lights; if (!e && !l) return null;
  const hs = (e ? e.jump : []).concat(l ? [l.title].concat(l.jump) : []);
  return header("elements") + `<main class="wrap">${point("What the place is made of: the elements, then the lights. Against any line say wrong, missing or strike.")}
    <article class="doc-html" id="doc">${jumpList(hs)}${e ? e.html : ""}${l ? `<div id="lights">${l.html}</div>` : ""}</article>
  </main>${about()}`;
}
const HOW = ["concept","controls","place"].filter(k => D.docs[k]);
function vHow(key){
  const d = D.docs[key]; if (!d) return null;
  return header("how") + `<main class="wrap">${point("The logic, architecture and systems of the place.")}
    <div class="chips" style="margin:0 0 20px">${HOW.map(k=>`<a class="${k===key?"on":""}" href="${D.docs[k].route}">${esc(D.docs[k].tab)}</a>`).join("")}</div>
    <article class="doc-html" id="doc">${jumpList(d.jump)}${d.html}</article>
  </main>${about()}`;
}

/* ------- router. Addresses of pages the site no longer has land on "try". */
function route(){
  let h = (location.hash || "").slice(1), html = null;
  try { h = decodeURIComponent(h); } catch(e){}
  if (h === "elements" || h === "lights") html = vElements();
  else if (h === "how" || h === "concept") html = vHow(HOW[0]);
  else if (h === "how-controls") html = vHow("controls");
  else if (h === "how-place") html = vHow("place");
  if (html === null) { if (h && h !== "try") { try { history.replaceState(null, "", "#try"); } catch(e){} } html = vTry(); }
  $app.innerHTML = html;
  document.querySelectorAll("[data-h]").forEach(a => a.onclick = ev => { ev.preventDefault();
    const t = [...document.querySelectorAll("#doc h1,#doc h2,#doc h3")].find(x => x.textContent.trim() === a.dataset.h); if (t) t.scrollIntoView(); });
  wireEmbeds();
  const sec = h === "lights" && document.getElementById("lights");
  if (sec) sec.scrollIntoView(); else window.scrollTo(0, 0);
}
/* Elements in 3D. Each is the prototype in a frame. Many of them running at once would stall a phone, so only the
   one most in view is loaded, and it is unloaded when it leaves. Until you tap, touches on it scroll the page. */
let embedWatch = null;
function wireEmbeds(){
  if (embedWatch) { embedWatch.disconnect(); embedWatch = null; }
  const all = [...document.querySelectorAll(".embed")]; if (!all.length) return;
  const seen = new Map();
  const stop = e => { e.classList.remove("live"); e.querySelector(".frame").innerHTML = ""; e.querySelector("button").textContent = "Tap to turn it and zoom"; };
  const start = e => { all.forEach(o => { if (o !== e && o.querySelector("iframe")) stop(o); });
    if (!e.querySelector("iframe")) { const f = document.createElement("iframe"); f.src = e.dataset.src; f.loading = "lazy"; f.title = "This element in 3D"; f.setAttribute("allow", "accelerometer; gyroscope"); e.querySelector(".frame").appendChild(f); } };
  all.forEach(e => e.querySelector("button").onclick = () => { start(e); const on = e.classList.toggle("live"); e.querySelector("button").textContent = on ? "Done: back to scrolling" : "Tap to turn it and zoom"; });
  if (!("IntersectionObserver" in window)) return;   // then a frame loads only when its button is tapped
  embedWatch = new IntersectionObserver(es => {
    es.forEach(x => seen.set(x.target, x.intersectionRatio));
    let best = null; all.forEach(e => { const r = seen.get(e) || 0; if (r >= 0.6 && (!best || r > seen.get(best))) best = e; });
    all.forEach(e => { if (e !== best && (seen.get(e) || 0) < 0.1 && e.querySelector("iframe")) stop(e); });
    if (best) start(best);
  }, {threshold: [0, 0.1, 0.6, 0.9]});
  all.forEach(e => embedWatch.observe(e));
}
window.addEventListener("hashchange", route);
route();
})();
</script>
