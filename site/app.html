<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gas station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The synths-to-go site's viewer, adapted: same tokens, type and components. Parts with no use here are left out. */
:root{--bg:#EBEBEB;--cell:#F3F3F3;--paper:#FBFBFB;--rule:#C6C6C6;--ink2:#5A5A5A;--ink:#1A1A1A;--on:#23863F;--m:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:24px}
.status,.ev,.tbl,.rows{font-variant-numeric:tabular-nums}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none}
a.u,.ref{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--m)}
.cap{font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.ink2{color:var(--ink2)}
/* header */
header.band{padding:18px var(--m) 14px}
.hgrid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.name{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}
.sub{font-size:13px;color:var(--ink2)}
.sig{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--on);margin-right:7px;vertical-align:2px}
nav.filters{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:0;box-shadow:inset 0 -1px 0 var(--rule);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav.filters::-webkit-scrollbar{display:none}
.wrap:has(>nav.filters){margin-bottom:24px;position:sticky;top:0;z-index:5;background:var(--bg)}
@media(min-width:1024px){.wrap:has(>nav.filters){margin-bottom:36px}}
@media(max-width:599px){nav.filters{gap:16px}nav.filters::after{content:"";flex:none;width:8px}nav.filters.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}}
nav.filters a{font-size:15px;color:var(--ink2);padding:6px 0 9px;border-bottom:2px solid transparent;flex:none}
nav.filters a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.brand a{color:var(--ink);text-decoration:none;white-space:nowrap}
@media(min-width:1024px){:root{--m:48px}.name{font-size:26px}}
/* label */
.label{border-top:1px solid var(--ink);padding-top:8px}
.lh{display:flex;align-items:baseline;gap:8px;font-size:15px;flex-wrap:wrap}
.lh b{font-weight:700}
.lf{font-size:12.5px;color:var(--ink2);margin:2px 0 8px;overflow-wrap:anywhere}
.link{font-size:12.5px;font-weight:500}
/* lists */
h2.sec{font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px}
.dropped{opacity:.62}
/* item */
.back{display:flex;justify-content:space-between;align-items:center;padding:0 var(--m) 10px;font-size:14px;color:var(--ink2)}
.back button{font-size:13px;color:var(--ink2)}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-bottom:30px}
@media(min-width:1024px){.item{grid-template-columns:minmax(0,1fr) 372px;gap:32px}.item .aside{align-self:start;position:sticky;top:60px}}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}
.btn{display:inline-block;border:1px solid var(--ink);padding:6px 12px;font-size:13px;font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips a,.chips button{border:1px solid var(--rule);padding:4px 10px;font-size:13px}
.chips .on{border-color:var(--ink);font-weight:600}
/* docs */
.doc-html{max-width:68ch;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.doc-html figure{margin:14px 0}.doc-html figure img{width:100%;height:auto;display:block;background:var(--paper)}
.doc-html figcaption{font-size:12px;font-weight:500;color:var(--ink2);margin-top:6px;line-height:1.6}
.doc-html figcaption .cst{margin-left:2px}
/* a sheet written as a page: text at reading width, drawings at their own; side-by-side drawings stack on a phone */
.sheetdoc{max-width:none}.sheetdoc>*:not(figure):not(.pair){max-width:68ch}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px;align-items:start}
@media(min-width:600px){.pair{grid-template-columns:repeat(var(--n),minmax(0,1fr));max-width:1100px}}
.doc-html h1{font-size:22px;line-height:1.25;font-weight:600}
.doc-html h2{font-size:17px;font-weight:600;margin:26px 0 8px}
.doc-html h3{font-size:15px;font-weight:600}
.doc-html code{font-size:13px;background:var(--cell);padding:0 3px}
.doc-html pre{overflow:auto;background:var(--cell);padding:10px;font-size:12.5px;line-height:1.35}
.doc-html blockquote{margin:10px 0;padding:2px 12px;border-left:2px solid var(--ink)}
.doc-html hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.doc-html ul,.doc-html ol{padding-left:22px}
.tbl{overflow-x:auto;margin:10px 0;border-top:1px solid var(--rule)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
details.jump{margin:6px 0 16px;font-size:13px}
details.jump summary{cursor:pointer;color:var(--ink2)}
details.jump a{display:block;padding:3px 0}
.note{font-size:12px;color:var(--ink2);border-left:2px solid var(--rule);padding:2px 10px;margin:10px 0}
/* history */
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.ev .t{color:var(--ink2);font-size:12.5px}
.wide{max-width:900px}
.wrap.wide{margin-left:max(0px,calc((100% - 1440px)/2));margin-right:auto}
/* the newest work, cards, gallery */
.nowcard{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:6px 0 18px}
.nowcard img{width:100%;height:auto;max-height:46vh;object-fit:contain;background:var(--paper);display:block}
@media(min-width:900px){.nowcard{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:24px}}
.cases{display:grid;grid-template-columns:minmax(0,1fr);gap:26px 22px}
@media(min-width:700px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
.case{display:block}.case .cimg{background:var(--paper);aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.case img{width:100%;height:100%;object-fit:contain;display:block}
.cmeta{display:flex;gap:10px;align-items:baseline;margin-top:8px;font-size:17px;flex-wrap:wrap}.cmeta b{font-weight:700}
.cst{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--rule);padding:1px 6px;vertical-align:middle}
.cline{font-size:14px;margin:2px 0}
.case.gone .cimg{opacity:.55}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin:10px 0 8px}
@media(min-width:700px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1100px){.thumbs{grid-template-columns:repeat(6,minmax(0,1fr))}}
.thumbs figure{margin:0}.thumbs img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--paper);display:block}
.thumbs figcaption{font-size:11.5px;color:var(--ink2);margin-top:4px;overflow-wrap:anywhere}
.gdocd{border-top:1px solid var(--rule);padding:10px 0}.gdocd summary{cursor:pointer;font-weight:600}
/* a sheet: a tall image made for a phone. Phone: edge to edge, in the page's own scroll. Wider: half size, click for its actual pixels. */
.sheet{background:var(--paper);margin:0 calc(-1 * var(--m)) 6px}
.sheet img{display:block;width:100%;height:auto}
.hint .wideonly{display:none}
@media(min-width:700px){
  .sheet{margin:0 0 6px;overflow-x:auto;cursor:zoom-in;width:fit-content;max-width:100%}
  .sheet img{width:var(--half);max-width:100%}
  .sheet.z{cursor:zoom-out}.sheet.z img{width:var(--full);max-width:none}
  .hint .wideonly{display:inline}.hint .phoneonly{display:none}
}
.still{background:var(--paper);max-width:585px}
.still img{display:block;width:100%;height:auto}
/* page point, waiting list, about */
.sub a,.back a,.back button,[data-copy],.link a,h2.sec a{display:inline-block;padding-top:5px;padding-bottom:5px;margin-top:-5px;margin-bottom:-5px}
.purpose{font-size:15px;margin:0 0 20px;max-width:70ch}
main p,main pre{overflow-wrap:anywhere}
main>.status{margin-bottom:12px}
.wsec{border-top:1.5px solid var(--ink);padding-top:10px;margin-top:26px}.wsec h2{font-size:19px;font-weight:600;margin:0 0 6px}
.about{margin-top:40px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}.about b{color:var(--ink);font-weight:600}
.status{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(72ch,100%)}
.status b{color:var(--ink);font-weight:600}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}
.drow .t{font-weight:600;font-size:15px}.drow .c{font-size:13px;color:var(--ink2)}
.drow .x{font-size:13px;color:var(--ink2)}
@media(min-width:900px){.drow{grid-template-columns:240px minmax(0,1fr) 260px;align-items:baseline}}
@media(max-width:599px){
 .doc-html .tbl{border-top:0;overflow:visible}
 .doc-html table,.doc-html tbody,.doc-html tr,.doc-html td{display:block;width:100%}
 .doc-html thead{display:none}
 .doc-html tr{border-top:1px solid var(--ink);padding:6px 0 8px}
 .doc-html td{border:0;padding:3px 0 3px 106px;position:relative;min-height:22px}
 .doc-html td::before{content:attr(data-label);position:absolute;left:0;width:96px;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding-top:2px;overflow-wrap:anywhere}
 .doc-html td[data-label=""]{padding-left:0}.doc-html td[data-label=""]::before{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* lightbox (Ramka island): every content image opens here */
.lb-wrap{position:relative;display:block}
.lb-host{position:absolute;inset:0;display:block}
.lb-trigger{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;padding:0;cursor:zoom-in;display:block}
.lb-trigger:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lb-backdrop{position:fixed;inset:0;background:rgba(17,17,17,.94);z-index:90}
.lb-content{position:fixed;inset:0;z-index:91;display:flex;flex-direction:column;color:#eee;outline:none}
.lb-slides{flex:1;min-height:0}
.lb-slide{flex:0 0 100%;width:100%;height:100%;min-width:0}
.lb-item{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.lb-zoom{width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;container-type:size}
.lb-media{max-width:100%;max-height:100%}
.lb-media img{display:block;width:100%;height:100%;object-fit:contain;user-select:none}
.lb-bar{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;font-size:13px;z-index:2}
.lb-counter{margin-right:auto;color:#bbb;font-variant-numeric:tabular-nums}
.lb-btn{color:#eee;border:1px solid rgba(255,255,255,.35);padding:6px 12px;min-height:36px;font-size:14px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:34px;color:#eee;z-index:2}
.lb-nav[data-disabled]{opacity:.2}
.lb-prev{left:6px}.lb-next{right:6px}
@media(max-width:599px){.lb-nav{display:none}}
.lb-caption{padding:10px 16px calc(14px + env(safe-area-inset-bottom));font-size:14px;line-height:1.45;max-height:30vh;overflow:auto;color:#ddd}
.lb-caption:empty{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const DOC = D.docs, ST = D.stills;
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------- small builders */
function label(o){ // {code,title,fields,extra}
  return `<div class="label"><div class="lh"><b>${esc(o.code)}</b><span>${esc(o.title||"")}</span></div>
  <div class="lf">${esc(o.fields)}</div>${o.extra||""}</div>`;
}
function updatedLine(){
  const u = D.updated || {};
  return `<div class="status" title="${esc(u.what)}">Updated <b>${esc(u.when)}</b> · ${esc(u.what)}</div>`;
}
const SECTIONS = [ // the site's whole structure, one row
  ["now","#now","now"],["sheets","#sheets","sheets"],["walk","#walk","walk it"],["concept","#concept","concept"],["elements","#elements","elements"],["lights","#lights","lights"],
  ["jobs","#jobs","jobs"],["owner","#owner","owner record"],["scores","#scores","scores"],["history","#history","history"],["archive","#archive","archive"]];
function header(sel){
  return `<header class="band wrap"><div class="hgrid">
    <div class="name brand"><a href="#now">${esc(D.project.name)}</a></div>
    <div class="sub">${esc(D.project.line)}</div>
  </div></header><div class="wrap"><nav class="filters" aria-label="Sections">${SECTIONS.map(([k,h,t])=>`<a href="${h}" class="${k===sel?"on":""}">${t}</a>`).join("")}</nav></div>`;
}
function point(t){ return `<p class="purpose">${esc(t)}</p>`; }
function about(){
  return `<footer class="wrap about"><div class="cap">Where things live</div><p>
    Everything is in the repo under design/gas-station/ ·
    <b>Now</b> ← site/now.md (kept by hand), owner.md · <b>Sheets</b> ← concepts/sheet-N.md, concepts/stills/ ·
    <b>Walk it</b> ← sketches/place/, sketches/controls-test/ · <b>Concept</b> ← concepts/05-left-on.md, concepts/00-shared.md, concepts/controls.md ·
    <b>Elements</b> ← elements.md · <b>Lights</b> ← lights.md · <b>Jobs</b> ← jobs.md · <b>Owner record</b> ← owner.md ·
    <b>Scores</b> ← scores.md, concepts/score-N.md, steer-N.md, the judge files · <b>History</b> ← git log ·
    <b>Archive</b> ← notes/, jam.md, brief.md, earlier concepts, every still.
    Markdown is the source; site/publish.sh rebuilds this site from the repo. The inspiration images in the repo are other people's work and are not shown here.
    <a class="u" href="#licenses">Licences</a>.</p></footer>`;
}
function docRow(slug, note){ const d = DOC[slug]; if (!d) return "";
  return `<a class="drow" href="${d.route}"><span class="t">${esc(d.title)}</span><span class="c">${esc(note || d.lead || "")}</span><span class="x">${esc(d.kind)}${d.changed?" · "+esc(d.changed):""}</span></a>`; }
function backBar(href, text, pt){
  return `${pt?`<div class="wrap">${point(pt)}</div>`:""}<div class="back wrap"><a href="${href}">‹ ${esc(text)}</a><button data-copy="1">copy link</button></div>`;
}
function thumb(name, cap){ const s = ST[name]; if (!s) return "";
  return `<figure><img src="${s.thumb}" data-full="${s.src}" data-w="${s.w}" data-h="${s.h}" width="${s.tw}" height="${s.th}" alt="${esc(cap||name)}" loading="lazy"><figcaption>${esc(cap||name)}</figcaption></figure>`; }
function gallery(names){ return names.length ? `<div class="thumbs">${names.map(n=>thumb(n)).join("")}</div>` : ""; }
function walkBtns(sh){
  return sh.views.length ? `<div class="btns">${sh.views.map((v,i)=>{ const w = D.walk.views.find(x=>x.hash===v); return `<a class="btn" href="walk/#${v}">${i===0?"Walk it: ":""}${esc(w.title.toLowerCase())} ›</a>`; }).join("")}</div>` : ""; }
function sheetStatus(sh){
  const v = sh.verdicts.length ? "Director: " + sh.verdicts[sh.verdicts.length-1].replace(/^Verdict:\s*/,"").replace(/^After the fixes:\s*/,"after the fixes, ") : "";
  const a = sh.questions ? (sh.answered ? "answered" : "waiting on you") : (sh.answered ? "answered" : "");
  return {v, a};
}
function sheetCard(sh, cls){
  const m = sh.card; if (!m) return ""; const s = sheetStatus(sh);
  return `<a class="${cls||"case"}" href="#sheet-${sh.code}">
    <div class="cimg"><img src="${m.thumb}" width="${m.tw}" height="${m.th}" alt="Sheet ${esc(sh.code)}: ${esc(sh.title)}" loading="lazy"></div>
    <div><div class="cmeta"><b>Sheet ${esc(sh.code)}</b>${s.a?`<span class="cst">${s.a}</span>`:""}</div>
    <div class="cline">${esc(sh.title)}</div><div class="ink2" style="font-size:12.5px">${esc(sh.changed)}${s.v?" · "+esc(s.v):""}</div>
    ${cls?'<div class="u" style="margin-top:4px">Open the sheet ›</div>':""}</div></a>`;
}

/* ------- views */
function vNow(){
  const sh = D.sheets[0];
  const open = D.owner.open;
  return header("now") + `<main class="wrap wide">${updatedLine()}<p class="purpose" style="font-size:18px">Where the gas station design stands, and what is waiting on you. Answer in chat; this site is for looking.</p>
    ${sh ? `<h2 class="sec">The latest sheet</h2>${sheetCard(sh, "nowcard")}${walkBtns(sh)}` : ""}
    ${D.now.blocks.map(b=>`<section class="wsec"><h2>${esc(b.title)}</h2><div class="doc-html">${b.html}</div></section>`).join("")}
    ${open ? `<section class="wsec"><h2>${esc(open.title)}</h2><div class="doc-html">${open.html}</div><p class="hint">From the end of <a class="u" href="#owner">your record</a>.</p></section>` : ""}
    <h2 class="sec" style="margin-top:34px">Everything else</h2>
    <a class="drow" href="#sheets"><span class="t">Sheets</span><span class="c">Every sheet, newest first.</span></a>
    <a class="drow" href="#walk"><span class="t">Walk it</span><span class="c">The walkable prototype, on your phone or a computer.</span></a>
    <a class="drow" href="#concept"><span class="t">Concept</span><span class="c">Left on: the idea behind the place.</span></a>
    <a class="drow" href="#elements"><span class="t">Elements</span><span class="c">What each thing needs before it is drawn.</span></a>
    ${DOC["lights"] ? '<a class="drow" href="#lights"><span class="t">Lights</span><span class="c">Every real light in the place.</span></a>' : ""}
    <a class="drow" href="#owner"><span class="t">Owner record</span><span class="c">Everything you have said, in your words, newest first.</span></a>
  </main>${about()}`;
}
function vSheets(){
  return header("sheets") + `<main class="wrap">${point("Each sheet works out one part of the place and puts questions to you. Newest first. Open one to read it at full size and walk what it shows.")}
    <div class="cases">${D.sheets.map(s=>sheetCard(s)).join("")}</div>
    ${D.earlier.length ? `<h2 class="sec" style="margin-top:34px">Earlier</h2><div class="cases">${D.earlier.map(s=>sheetCard(s)).join("")}</div>` : ""}
    <p class="hint" style="margin-top:22px">Every other picture the team has kept is under <a class="u" href="#stills">all stills</a>.</p>
  </main>${about()}`;
}
function sheetFig(name, cap){ const m = ST[name]; if (!m) return "";
  return `${cap?`<h2 class="sec">${esc(cap)}</h2>`:""}<div class="sheet" style="--half:${Math.round(m.w/2)}px;--full:${m.w}px"><img src="${m.src}" width="${m.w}" height="${m.h}" alt="${esc(cap||name)}"></div>
    <div class="hint"><span class="phoneonly">Scroll to read it. Pinch to zoom.</span><span class="wideonly">Click the sheet for its actual pixels; click again to go back.</span> ${m.w} × ${m.h}, made for a phone.</div>`; }
function vSheet(code){
  const sh = D.sheets.concat(D.earlier).find(s => s.code === code); if (!sh) return vMissing("sheet " + code);
  const s = sheetStatus(sh), d = DOC[sh.doc], j = sh.judge && DOC[sh.judge];
  const q = sh.questions ? `<section class="wsec"><h2>${sh.answered ? "What this sheet asked you" : "What this sheet asks you"}</h2><div class="doc-html">${sh.questions}</div>
      <p class="hint">${sh.answered ? `Answered: <a class="u" href="#owner-${sh.answered}">your record, section ${esc(sh.answered)}</a>.` : "Answer in chat."} Wording: ${esc(sh.qfrom)}.</p></section>` : "";
  return header("sheets") + backBar("#sheets", "Sheets", sh.line || "One sheet: the picture, what it asks you, the view you can walk, and the notes behind it.") + `<main class="wrap">
    <div class="wide">${label({code:"Sheet " + sh.code, title:sh.title, fields:["sheet", sh.changed, s.v].filter(Boolean).join(" · "), extra:walkBtns(sh)})}
    ${!sh.questions && sh.answered ? `<p class="hint">Your response: <a class="u" href="#owner-${sh.answered}">your record, section ${esc(sh.answered)}</a>.</p>` : ""}${q}</div>
    ${sh.page ? `<article class="doc-html sheetdoc" style="margin-top:24px">${sh.page}</article>` : ""}
    <div style="margin-top:24px">${sh.images.map((n,i)=>sheetFig(n, sh.captions ? sh.captions[n] : (i===0 ? "The sheet" : n))).join("")}</div>
    <div class="wide">
    ${sh.frames.length ? `<h2 class="sec">Frames from the walk that this sheet's notes name (${sh.frames.length})</h2>${gallery(sh.frames)}` : ""}
    ${sh.page && !sh.notes && !j ? "" : '<h2 class="sec">Behind it</h2>'}
    ${sh.page ? (sh.notes ? docRow(sh.notes, "How the sheet was made, and what is not good yet.") : "") : d && sh.doc !== "concepts-05-left-on" ? `<details class="gdocd"><summary>The designer's notes on this sheet</summary><div class="doc-html" style="margin-top:8px">${d.html}</div></details>` : docRow(sh.doc)}
    ${j ? docRow(sh.judge, "The design director's check before it went to you.") : ""}
    </div>
  </main>${about()}`;
}
function vWalk(){
  const W = D.walk;
  return header("walk") + `<main class="wrap wide" style="max-width:1100px">${point("The place, walked: a throwaway prototype for testing the look on a real phone. It opens full screen. Drag to look, press and hold to walk. Use your browser's back to return here.")}
    ${W.views.map(v=>`<div class="drow"><span class="t"><a href="walk/#${v.hash}">${esc(v.title)}</a></span><span class="c">${esc(v.line)}</span><span class="chips"><a href="walk/#${v.hash}-day">day</a><a href="walk/#${v.hash}-night">night</a></span></div>`).join("")}
    <p class="hint" style="margin-top:16px">Inside it, the links at the foot switch between together, pump and slab, and between day and night. It is drawn live, so it needs a phone or computer from the last few years.</p>
    ${D.controlsTest || DOC["concepts-controls"] ? `<h2 class="sec">The new controls</h2>
      ${D.controlsTest ? `<a class="drow" href="controls-test/"><span class="t">Try the new controls (test page)</span><span class="c">A test of the gestures on stand-in shapes, not the station. Best on a phone. Opens full screen; use your browser's back to return.</span><span class="x">test page${D.controlsTest.changed ? " · " + esc(D.controlsTest.changed) : ""}</span></a>` : ""}
      ${docRow("concepts-controls", "How you move and look, written out.")}` : ""}
    <h2 class="sec">Which sheet goes with which view</h2>
    ${D.sheets.filter(s=>s.views.length).map(s=>`<a class="drow" href="#sheet-${s.code}"><span class="t">Sheet ${esc(s.code)}</span><span class="c">${esc(s.title)}</span><span class="x">${s.views.join(" · ")}</span></a>`).join("")}
    <p class="hint" style="margin-top:16px">Source: ${esc(W.path)} · last changed ${esc(W.changed)}</p>
  </main>${about()}`;
}
function jumpList(d){ return (d.jump && d.jump.length > 3) ? `<details class="jump"><summary>Contents (${d.jump.length})</summary>${d.jump.map(h=>`<a href="#" data-h="${esc(h)}">${esc(h)}</a>`).join("")}</details>` : ""; }
const BACK = {sheets:["#sheets","Sheets"], concept:["#concept","Concept"], scores:["#scores","Scores"], archive:["#archive","Archive"], owner:["#owner","Owner record"], elements:["#elements","Elements"], lights:["#lights","Lights"], jobs:["#jobs","Jobs"]};
function vDoc(slug, o){ // o: {pt, top, noBack}
  o = o || {}; const d = DOC[slug]; if (!d) return vMissing(slug);
  const frames = d.stills.filter(n => !D.sheetStems.includes(n));
  const sheet = D.sheets.find(s => s.doc === slug || s.judge === slug);
  const b = sheet ? ["#sheet-" + sheet.code, "Sheet " + sheet.code] : BACK[d.sec];
  return header(d.sec) + (o.noBack ? `<div class="wrap">${point(o.pt)}</div>` : backBar(b[0], b[1], o.pt || "A record the team keeps, rendered from the repo.")) + `<main class="wrap">${o.top||""}<div class="item">
    <article class="doc-html" id="doc">${jumpList(d)}${d.html}</article>
    <div class="aside">${label({code:d.kind, title:"", fields:[d.changed ? "last changed " + d.changed : "", "source " + d.path].filter(Boolean).join(" · ")})}</div></div>
    ${frames.length ? `<h2 class="sec">Pictures this record names (${frames.length})</h2>${gallery(frames)}` : ""}
  </main>${about()}`;
}
function vConcept(){
  const top = `<div class="wide" style="margin-bottom:22px">${docRow("concepts-00-shared", "The place itself: the lot, walking, the door, the world's edge, sound, twilight.")}${docRow("concepts-controls", "How you move and look: swipe, pinch, tilt.")}${docRow("concepts-coverage-05", "Every job walked against the concept.")}
    ${D.earlier.map(s=>`<a class="drow" href="#sheet-${s.code}"><span class="t">Sheet ${esc(s.code)}</span><span class="c">${esc(s.title)}</span><span class="x">pictures</span></a>`).join("")}</div>`;
  return vDoc("concepts-05-left-on", {noBack:true, top, pt:"Left on is the one concept: what the place is and what you do in it. The director scored it 9; you sent it back on the look, not the idea."});
}
function vOwner(n){
  const O = D.owner;
  const sec = s => `<section class="wsec" id="owner-${esc(s.n || "open")}"><h2>${s.n ? esc(s.n) + ". " : ""}${esc(s.title)}</h2><div class="doc-html">${s.html}</div></section>`;
  return header("owner") + `<main class="wrap wide">${point("Everything you have said about this project, word for word, with the question each answer was given to. Newest first here; the file itself runs oldest first.")}
    <div class="ink2" style="font-size:13px">source ${esc(O.path)} · last changed ${esc(O.changed)}</div>
    <div class="doc-html">${O.intro}</div>
    <details class="jump"><summary>Sections (${O.sections.length})</summary>${O.sections.map(s=>`<a href="#owner-${esc(s.n)}">${esc(s.n)}. ${esc(s.title)}</a>`).join("")}</details>
    ${O.open ? sec(O.open) : ""}${O.sections.map(sec).join("")}
  </main>${about()}`;
}
function vScores(){
  const by = re => D.order.filter(s => re.test(DOC[s].rel)).sort((a,b)=>DOC[b].rel.localeCompare(DOC[a].rel, undefined, {numeric:true}));
  const rows = (t, list) => list.length ? `<h2 class="sec">${t}</h2>${list.map(s=>docRow(s)).join("")}` : "";
  const d = DOC["scores"];
  return header("scores") + `<main class="wrap wide" style="max-width:1100px">${point("Every score the design director has given and every objection, in order, then the director's full write-ups. Directors judge; they decide nothing for you.")}
    <article class="doc-html" id="doc" style="max-width:none">${d ? d.html : ""}</article>
    ${rows("Checks of the sheets", by(/sheet-\d+-judge\.md$/))}
    ${rows("Scores, round by round", by(/score-\d+\.md$/))}
    ${rows("Steers", by(/steer-\d+\.md$/))}
    ${rows("Other checks", by(/(?<!sheet-\d+)-judge\.md$/))}
  </main>${about()}`;
}
function vHistory(){
  const n = D.history.reduce((a,d)=>a+d.events.length,0);
  return header("history") + `<main class="wrap wide">${point("What changed and when: every change saved to the repo, newest first.")}
    <div class="ink2" style="font-size:13px">${n} changes · from git log</div>
    ${D.history.map(d=>`<h2 class="sec">${esc(d.day)}</h2>${d.events.map(e=>`<div class="ev"><span class="t">${esc(e.t)}</span><span>${esc(e.s)}</span></div>`).join("")}`).join("")}
  </main>${about()}`;
}
function vArchive(){
  const pick = f => D.order.filter(s => DOC[s].sec === "archive" && f(DOC[s]));
  const used = new Set();
  const rows = (t, list) => { list.forEach(s=>used.add(s)); return list.length ? `<h2 class="sec">${t}</h2>${list.map(s=>docRow(s)).join("")}` : ""; };
  const a = rows("Team notes", pick(d=>d.rel.startsWith("notes/"))), b = rows("The brief and the jam", pick(d=>["brief.md","jam.md"].includes(d.rel))),
    c = rows("Earlier concepts, folded or merged into Left on", pick(d=>/^concepts\/0\d/.test(d.rel))), e = rows("The look test", pick(d=>/look-/.test(d.rel)));
  const f = rows("Everything else", pick(d=>!used.has(d.slug)));
  return header("archive") + `<main class="wrap wide" style="max-width:1100px">${point("Everything else the team has kept: working notes, the brief, the jam, earlier concepts and every still. Nothing here is waiting on you.")}
    <h2 class="sec">Pictures</h2><a class="drow" href="#stills"><span class="t">All stills</span><span class="c">Every picture in concepts/stills: sheets, frames from the walk, tests.</span><span class="x">${Object.keys(ST).length} pictures</span></a>
    ${b}${a}${c}${e}${f}
  </main>${about()}`;
}
function vStills(){
  const names = Object.keys(ST), used = new Set();
  const grp = (t, f) => { const l = names.filter(n => !used.has(n) && f(n)); l.forEach(n=>used.add(n)); return l.length ? `<h2 class="sec">${t} (${l.length})</h2>${gallery(l)}` : ""; };
  const a = grp("Sheets", n=>D.sheetStems.includes(n)), b = grp("Sheet 2: frames from the walk", n=>/^s2-/.test(n)), c = grp("Sheet 2: the director's own frames", n=>/^s2j-/.test(n)),
    d = grp("Left on: frames from the walk", n=>/^lo-/.test(n)), e = grp("Other", n=>true);
  return header("archive") + backBar("#archive", "Archive", "Every picture the team has kept, as it is in the repo. Tap one to see it large.") + `<main class="wrap">${a}${b}${c}${d}${e}</main>${about()}`;
}
function vStill(name){
  const s = ST[name]; if (!s) return vMissing(name);
  const sh = D.sheets.concat(D.earlier).find(x => x.images.includes(name));
  return header("archive") + backBar("#stills", "All stills", "One picture from the team's work. Tap it to see it large.") + `<main class="wrap item">
    <div><div class="still"><img src="${s.src}" width="${s.w}" height="${s.h}" alt="${esc(name)}"></div></div>
    <div class="aside">${label({code:name, title:"", fields:`still · ${s.w} × ${s.h} · source ${s.path}`})}
      ${sh ? `<p><a class="btn" href="#sheet-${sh.code}">Open Sheet ${esc(sh.code)} ›</a></p>` : ""}
      ${s.docs.length ? `<h2 class="sec">Named in</h2>${s.docs.map(x=>`<a class="drow" style="grid-template-columns:minmax(0,1fr)" href="${DOC[x].route}"><span class="t">${esc(DOC[x].title)}</span></a>`).join("")}` : ""}</div>
  </main>${about()}`;
}
function vLicenses(){
  return header("") + `<main class="wrap wide">${point("Open-source code this site uses, with its licence.")}${(D.licenses||[]).map(l=>`<h2 class="sec">${esc(l.name)}</h2><p><a class="u" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a></p><pre style="white-space:pre-wrap;font-size:12.5px">${esc(l.text)}</pre>`).join("")}</main>${about()}`;
}
function vMissing(code){ return header("") + `<main class="wrap"><p>${esc(code)} isn't on this site. <a class="u" href="#now">Back to the start</a></p></main>`; }

/* ------- router */
function route(){
  let h = (location.hash || "").slice(1), html, m, after = null;
  try { h = decodeURIComponent(h); } catch(e){}
  if (h === "" || h === "now" || h === "home") html = vNow();
  else if (h === "sheets") html = vSheets();
  else if ((m = h.match(/^sheet-(\w+)$/))) html = vSheet(m[1]);
  else if (h === "walk") html = vWalk();
  else if (h === "concept") html = vConcept();
  else if (h === "elements") html = vDoc("elements", {noBack:true, pt:"The list you asked for before anything is drawn: every thing the place has and what each one needs. Against any line say wrong, missing or strike."});
  else if (h === "lights") html = vDoc("lights", {noBack:true, pt:"Every real light in the place, listed the way the elements are. Against any line say wrong, missing or strike."});
  else if (h === "jobs") html = vDoc("jobs", {noBack:true, pt:"What a visitor comes to do, and what you need the site to do. Every concept is checked against these."});
  else if (h === "owner") html = vOwner();
  else if ((m = h.match(/^owner-(\w+)$/))) { html = vOwner(); after = "owner-" + m[1]; }
  else if (h === "scores") html = vScores();
  else if (h === "history") html = vHistory();
  else if (h === "archive") html = vArchive();
  else if (h === "stills") html = vStills();
  else if ((m = h.match(/^still-([\w-]+)$/))) html = vStill(m[1]);
  else if ((m = h.match(/^doc-([\w-]+)$/))) html = DOC[m[1]] && DOC[m[1]].route !== "#doc-" + m[1] ? (location.replace(DOC[m[1]].route), "") : vDoc(m[1]);
  else if (h === "licenses") html = vLicenses();
  else html = vMissing(h);
  $app.innerHTML = html;
  wire();
  return after;
}
function go(){ const a = route(); const e = a && document.getElementById(a); if (e) e.scrollIntoView(); else window.scrollTo(0, 0); }
window.addEventListener("hashchange", go);

/* ------- wiring per view */
function wire(){
  const nv = document.querySelector("nav.filters"), on = nv && nv.querySelector("a.on");
  if (nv){ const fade = () => nv.classList.toggle("fade", nv.scrollLeft + nv.clientWidth < nv.scrollWidth - 4);
    if (on && nv.scrollWidth > nv.clientWidth) nv.scrollLeft = Math.max(0, on.offsetLeft - nv.offsetLeft - 16);
    fade(); nv.onscroll = fade; }
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    try { navigator.clipboard.writeText(location.href).then(() => { b.textContent = "copied"; }, () => { b.textContent = "copy the address bar"; }); } catch(e){ b.textContent = "copy the address bar"; }
  });
  document.querySelectorAll(".sheet").forEach(v => v.onclick = () => { if (window.matchMedia("(min-width: 700px)").matches) v.classList.toggle("z"); });
  document.querySelectorAll("[data-h]").forEach(a => a.onclick = ev => { ev.preventDefault();
    const t = [...document.querySelectorAll("#doc h1,#doc h2,#doc h3")].find(x => x.textContent.trim() === a.dataset.h); if (t) t.scrollIntoView(); });
  document.querySelectorAll(".doc-html pre").forEach(p => {
    let fs = 12.5;
    while (p.scrollWidth > p.clientWidth + 1 && fs > 9.5){ fs -= 0.5; p.style.fontSize = fs + "px"; }
  });
  wireLightbox();
}
const LB_SKIP = ".case, .nowcard, .sheet";  // navigation cards keep their own taps; a sheet is read in the page
function wireLightbox(){
  const imgs = [...document.querySelectorAll("main img")].filter(im => !im.closest(LB_SKIP));
  const items = imgs.map(im => {
    const w = +im.dataset.w || +im.getAttribute("width") || im.naturalWidth || 1170, h = +im.dataset.h || +im.getAttribute("height") || im.naturalHeight || 1992;
    const fig = im.closest("figure"), cap = fig && fig.querySelector("figcaption");
    return {src: im.dataset.full || im.getAttribute("src"), alt: im.alt || "", caption: (cap ? cap.textContent : im.alt || "").trim(), width: w, height: h};
  });
  const set = () => window.BELightbox.set(items, imgs);
  if (window.BELightbox) set(); else document.addEventListener("belightbox-ready", set, {once: true});
}
const first = route();
if (first) setTimeout(() => { const e = document.getElementById(first); if (e) e.scrollIntoView(); }, 30);
})();
</script>
<script src="media/vendor/lightbox.js" defer></script>
</body>
