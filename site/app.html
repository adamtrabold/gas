<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gas station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The synths-to-go site's look: same tokens, type and components. Only the parts this site uses. */
:root{--bg:#EBEBEB;--cell:#F3F3F3;--paper:#FBFBFB;--rule:#C6C6C6;--ink2:#5A5A5A;--ink:#1A1A1A;--on:#23863F;--m:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:24px}
.tbl{font-variant-numeric:tabular-nums}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none}
a.u,.ref{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--m)}
.ink2{color:var(--ink2)}
/* header */
header.band{padding:18px var(--m) 14px}
.hgrid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.name{font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}
.sub{font-size:13px;color:var(--ink2)}
nav.filters{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:0;box-shadow:inset 0 -1px 0 var(--rule);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav.filters::-webkit-scrollbar{display:none}
.wrap:has(>nav.filters){margin-bottom:24px;position:sticky;top:0;z-index:5;background:var(--bg)}
@media(min-width:1024px){.wrap:has(>nav.filters){margin-bottom:36px}}
@media(max-width:599px){nav.filters{gap:16px}nav.filters::after{content:"";flex:none;width:8px}nav.filters.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}}
nav.filters a{font-size:15px;color:var(--ink2);padding:6px 0 9px;border-bottom:2px solid transparent;flex:none}
nav.filters a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.brand a{color:var(--ink);text-decoration:none;white-space:nowrap}
@media(min-width:1024px){:root{--m:48px}.name{font-size:26px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips a,.chips button{border:1px solid var(--rule);padding:4px 10px;font-size:13px}
.chips .on{border-color:var(--ink);font-weight:600}
/* docs */
.doc-html{max-width:68ch;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.doc-html h1{font-size:22px;line-height:1.25;font-weight:600}
.doc-html h2{font-size:17px;font-weight:600;margin:26px 0 8px}
.doc-html h3{font-size:15px;font-weight:600}
.doc-html code{font-size:13px;background:var(--cell);padding:0 3px}
.doc-html pre{overflow:auto;background:var(--cell);padding:10px;font-size:12.5px;line-height:1.35}
.doc-html blockquote{margin:10px 0;padding:2px 12px;border-left:2px solid var(--ink)}
.doc-html hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.doc-html ul,.doc-html ol{padding-left:22px}
.tbl{overflow-x:auto;margin:10px 0;border-top:1px solid var(--rule)}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
details.jump{margin:6px 0 16px;font-size:13px}
details.jump summary{cursor:pointer;color:var(--ink2)}
details.jump a{display:block;padding:3px 0}
.proto{border-top:1.5px solid var(--ink);padding-top:10px;margin-top:26px}.proto h2{font-size:19px;font-weight:600;margin:0 0 6px}.proto p{margin:0 0 10px}
/* an element you can turn round: the prototype in a frame. Only the one in view runs; touches scroll the page until you tap. */
.embed{margin:12px 0 18px}
.embed .frame{height:clamp(300px,60vh,520px);background:var(--paper);border:1px solid var(--rule);position:relative}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;pointer-events:none}
.embed.live iframe{pointer-events:auto}
.embed.live .frame{border-color:var(--ink)}
.embedbar{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-size:13px;margin:6px 0 0}
.embedbar button{font:inherit;color:inherit;background:none;border:1px solid var(--ink);padding:5px 10px;cursor:pointer}
#lights{margin-top:44px;padding-top:6px;border-top:1.5px solid var(--ink)}
.wide{max-width:900px}
.wrap.wide{margin-left:max(0px,calc((100% - 1440px)/2));margin-right:auto}
.purpose{font-size:15px;margin:0 0 20px;max-width:70ch}
main p,main pre{overflow-wrap:anywhere}
.about{margin-top:40px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}.about b{color:var(--ink);font-weight:600}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}
.drow .t{font-weight:600;font-size:15px}.drow .c{font-size:13px;color:var(--ink2)}
@media(min-width:900px){.drow{grid-template-columns:240px minmax(0,1fr) 260px;align-items:baseline}}
@media(max-width:599px){
 .doc-html .tbl{border-top:0;overflow:visible}
 .doc-html table,.doc-html tbody,.doc-html tr,.doc-html td{display:block;width:100%}
 .doc-html thead{display:none}
 .doc-html tr{border-top:1px solid var(--ink);padding:6px 0 8px}
 .doc-html td{border:0;padding:3px 0 3px 106px;position:relative;min-height:22px}
 .doc-html td::before{content:attr(data-label);position:absolute;left:0;width:96px;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding-top:2px;overflow-wrap:anywhere}
 .doc-html td[data-label=""]{padding-left:0}.doc-html td[data-label=""]::before{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------- the three parts */
const WD = D.words, cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const SECTIONS = [["try","#try",WD.try],["elements","#elements",WD.elements],["how","#how",WD.how]];
function header(sel){
  return `<header class="band wrap"><div class="hgrid">
    <div class="name brand"><a href="#try">${esc(D.project.name)}</a></div>
    <div class="sub">${esc(D.project.line)}</div>
  </div></header><div class="wrap"><nav class="filters" aria-label="Sections">${SECTIONS.map(([k,h,t])=>`<a href="${h}" class="${k===sel?"on":""}">${t}</a>`).join("")}</nav></div>`;
}
function point(t){ return `<p class="purpose">${esc(t)}</p>`; }
function about(){ return `<footer class="wrap about"><p>Built from the project's repo. Everything else the team keeps is there.</p></footer>`; }
function jumpList(hs){ return hs.length > 3 ? `<details class="jump"><summary>Contents (${hs.length})</summary>${hs.map(h=>`<a href="#" data-h="${esc(h)}">${esc(h)}</a>`).join("")}</details>` : ""; }

function vTry(){
  const proto = p => `<section class="proto"><h2><a class="u" href="${p.href}">${esc(p.title)} ›</a></h2><p>${esc(p.line)}</p>
    ${p.views.map(v=>`<div class="drow"><span class="t"><a href="${p.href}#${v.hash}">${esc(v.hash)}</a></span><span class="c">${esc(v.line)}</span><span class="chips">${p.hours.map(h=>`<a href="${p.href}#${v.hash}-${h}">${esc(h)}</a>`).join("")}</span></div>`).join("")}</section>`;
  return header("try") + `<main class="wrap wide" style="max-width:1100px">
    ${D.note.trim() ? `<div class="doc-html" style="margin-bottom:8px">${D.note}</div>` : ""}
    ${D.protos.map(proto).join("")}
    <p class="ink2" style="font-size:12.5px;margin-top:18px">Each opens full screen. Use your browser's back to return here.</p>
  </main>${about()}`;
}
function vElements(){
  const e = D.docs.elements, l = D.docs.lights; if (!e && !l) return null;
  const hs = (e ? e.jump : []).concat(l ? [l.title].concat(l.jump) : []);
  return header("elements") + `<main class="wrap">${point("What the place is made of: the elements, then the lights. Against any line say wrong, missing or strike.")}
    <article class="doc-html" id="doc">${jumpList(hs)}${e ? e.html : ""}${l ? `<div id="lights">${l.html}</div>` : ""}</article>
  </main>${about()}`;
}
const HOW = ["concept","controls","place"].filter(k => D.docs[k]);
function vHow(key){
  const d = D.docs[key]; if (!d) return null;
  return header("how") + `<main class="wrap">${point("The logic, architecture and systems of the place.")}
    <div class="chips" style="margin:0 0 20px">${HOW.map(k=>`<a class="${k===key?"on":""}" href="${D.docs[k].route}">${esc(D.docs[k].tab)}</a>`).join("")}</div>
    <article class="doc-html" id="doc">${jumpList(d.jump)}${d.html}</article>
  </main>${about()}`;
}

/* ------- router. Addresses of pages the site no longer has land on "try". */
function route(){
  let h = (location.hash || "").slice(1), html = null;
  try { h = decodeURIComponent(h); } catch(e){}
  if (h === "elements" || h === "lights") html = vElements();
  else if (h === "how" || h === "concept") html = vHow(HOW[0]);
  else if (h === "how-controls") html = vHow("controls");
  else if (h === "how-place") html = vHow("place");
  if (html === null) { if (h && h !== "try") { try { history.replaceState(null, "", "#try"); } catch(e){} } html = vTry(); }
  $app.innerHTML = html;
  document.querySelectorAll("[data-h]").forEach(a => a.onclick = ev => { ev.preventDefault();
    const t = [...document.querySelectorAll("#doc h1,#doc h2,#doc h3")].find(x => x.textContent.trim() === a.dataset.h); if (t) t.scrollIntoView(); });
  wireEmbeds();
  const sec = h === "lights" && document.getElementById("lights");
  if (sec) sec.scrollIntoView(); else window.scrollTo(0, 0);
}
/* Elements in 3D. Each is the prototype in a frame. Many of them running at once would stall a phone, so only the
   one most in view is loaded, and it is unloaded when it leaves. Until you tap, touches on it scroll the page. */
let embedWatch = null;
function wireEmbeds(){
  if (embedWatch) { embedWatch.disconnect(); embedWatch = null; }
  const all = [...document.querySelectorAll(".embed")]; if (!all.length) return;
  const seen = new Map();
  const stop = e => { e.classList.remove("live"); e.querySelector(".frame").innerHTML = ""; e.querySelector("button").textContent = "Tap to turn it and zoom"; };
  const start = e => { all.forEach(o => { if (o !== e && o.querySelector("iframe")) stop(o); });
    if (!e.querySelector("iframe")) { const f = document.createElement("iframe"); f.src = e.dataset.src; f.loading = "lazy"; f.title = "This element in 3D"; f.setAttribute("allow", "accelerometer; gyroscope"); e.querySelector(".frame").appendChild(f); } };
  all.forEach(e => e.querySelector("button").onclick = () => { start(e); const on = e.classList.toggle("live"); e.querySelector("button").textContent = on ? "Done: back to scrolling" : "Tap to turn it and zoom"; });
  if (!("IntersectionObserver" in window)) return;   // then a frame loads only when its button is tapped
  embedWatch = new IntersectionObserver(es => {
    es.forEach(x => seen.set(x.target, x.intersectionRatio));
    let best = null; all.forEach(e => { const r = seen.get(e) || 0; if (r >= 0.6 && (!best || r > seen.get(best))) best = e; });
    all.forEach(e => { if (e !== best && (seen.get(e) || 0) < 0.1 && e.querySelector("iframe")) stop(e); });
    if (best) start(best);
  }, {threshold: [0, 0.1, 0.6, 0.9]});
  all.forEach(e => embedWatch.observe(e));
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
